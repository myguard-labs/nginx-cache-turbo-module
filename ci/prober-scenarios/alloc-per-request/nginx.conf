#
# S25 port of testkit's generic alloc-per-request scenario against a REAL
# cache_turbo HIT path, not the bare `return 200` the generic conf ships.
# Same load/zone/origin/cached shape as ../fault-slab-store/nginx.conf --
# see that file for the load_module and probe-directive rationale.
load_module @BUILD_OBJS@/ngx_http_cache_turbo_module.so;
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;

events { worker_connections 128; }

http {
    @PROBE_ZONE@

    # Same generous header-buffer sizing as the upstream scenario: the point
    # is the request-SIZE class of allocation, and a 400 at header-parse time
    # would short-circuit before the cache_turbo filter chain ever runs.
    large_client_header_buffers 16 64k;
    client_header_buffer_size 8k;

    cache_turbo_zone name=ct 8m;

    access_log off;

    server {
        listen 127.0.0.1:@PORT@;

        location /origin {
            default_type text/plain;
            return 200 "ct-alloc-per-request-payload\n";
        }

        # The measured location. Every case below hits the SAME cache key
        # (cache_turbo_key $uri with no query in the key), so the big-request
        # cases exercise cache_turbo's per-request HIT-path work (header
        # replay, refcounting) atop nginx's own request-size machinery,
        # instead of proving only that nginx itself is allocation-neutral.
        location /cached/ {
            cache_turbo        ct;
            cache_turbo_key    $uri;
            cache_turbo_valid  60s;

            proxy_pass         http://127.0.0.1:@PORT@/origin;
        }

        location /__probe { @PROBE@ }
    }
}
