#
# S25 port of testkit's fd-starve against a real cache_turbo HIT path. Same
# load/zone/origin/cached shape as the sibling S25 confs. worker_connections
# 10 (same as upstream) is the fd-pressure mechanism: with a small connection
# table, a per-request descriptor leak (a cache-entry fd, an unreleased
# upstream connection) exhausts the worker far sooner than it would under a
# generous limit, so `delta fds == 0` here is a tighter oracle than the same
# assertion under a roomy conf. multi_accept makes the parked sockets visible
# in the next probe snapshot instead of accepting them one event at a time.
load_module @BUILD_OBJS@/ngx_http_cache_turbo_module.so;
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events {
    worker_connections 10;
    multi_accept on;
}
http {
    @PROBE_ZONE@

    cache_turbo_zone name=ct 8m;

    access_log off;
    keepalive_timeout 0;

    server {
        listen 127.0.0.1:@PORT@;

        location /origin {
            default_type text/plain;
            return 200 "ct-fd-starve-payload\n";
        }

        location /cached/ {
            cache_turbo        ct;
            cache_turbo_key    $uri;
            cache_turbo_valid  60s;

            proxy_pass         http://127.0.0.1:@PORT@/origin;
        }

        location /__probe { @PROBE@ }
    }
}
