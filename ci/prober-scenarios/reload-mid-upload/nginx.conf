#
# S25 port of testkit's reload-mid-upload: a slow request BODY spans a
# SIGHUP, and the upload must complete intact once absorbed.
#
# UNLIKE the sibling S25 confs, @PROBE@ here is deliberately left as
# testkit's DEFAULT test_ref_probe (no PROBER_PROBE override in ./env). The
# reload target is /upload -> cache_turbo's /sink passthrough, which needs no
# cache_turbo zone lookup to prove the upload survived; the ONLY thing
# post-reload.rule's probe reads is the generic "fds" field, which is
# rendered by testkit's core probe code (src/ngx_test_probe.c) independent of
# which shm_zone (if any) @PROBE@ is pointed at. Routing it at
# cache_turbo_probe instead would buy nothing here and would hit
# CTPROBE-STATIC-ZONE-NO-RELOAD (memory/labs/nginx-cache-turbo-module/
# issues.md): that directive's zone pointer is a static that survives the
# whole worker process, so the SECOND config parse -- this scenario's one
# reload -- would reject with "is duplicate" and the scenario could never
# pass. test_ref_probe carries no such state.
load_module @BUILD_OBJS@/ngx_http_cache_turbo_module.so;
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 16; }
http {
    @PROBE_ZONE@

    cache_turbo_zone name=ct 8m;

    server {
        listen 127.0.0.1:@PORT@;

        # The slow-drip target, proxied through cache_turbo rather than
        # served directly: proxy_request_buffering (default on) still forces
        # nginx to read the whole body before dispatching, exactly as
        # upstream's plain proxy_pass does, but now cache_turbo's own filter
        # chain is what decides whether/how to cache the result -- a POST is
        # not cacheable by cache_turbo's own rules, so this exercises the
        # module's request-method bypass path under a slow body rather than
        # its HIT path (the cached-GET path is exercised separately by
        # ../alloc-per-request and ../rss-slope).
        location /upload {
            client_max_body_size 10m;
            cache_turbo         ct;
            proxy_pass          http://127.0.0.1:@PORT@/sink;
        }
        location /sink { return 200 "UPLOADED\n"; }

        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
