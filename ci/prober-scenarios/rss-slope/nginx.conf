#
# S25 port of testkit's rss-slope against a real cache_turbo HIT path. Same
# load/zone/origin/cached shape as ../fault-slab-store/nginx.conf and
# ../alloc-per-request/nginx.conf.
load_module @BUILD_OBJS@/ngx_http_cache_turbo_module.so;
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 100; }
http {
    @PROBE_ZONE@

    cache_turbo_zone name=ct 8m;

    access_log off;

    server {
        listen 127.0.0.1:@PORT@;

        location /origin {
            default_type text/plain;
            return 200 "ct-rss-slope-payload\n";
        }

        location /cached/ {
            cache_turbo        ct;
            cache_turbo_key    $uri;
            cache_turbo_valid  60s;

            proxy_pass         http://127.0.0.1:@PORT@/origin;
        }

        location /__probe { @PROBE@ }
    }
}
