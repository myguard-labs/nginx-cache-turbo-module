#
# S26 port of testkit's reload-cycle: the server is SIGHUP-reloaded several
# times in a row, and each reload's worker cycle-pool/fd bookkeeping must be
# flat across the series (driver.sh). Oracle shape is testkit's own; what
# this port adds is real cache_turbo traffic through the reload series --
# a request against /cached/item must MISS once, then HIT on every later
# request including ones issued after a reload, proving the shm zone (not a
# per-worker cache) survives the reload and that cache_turbo_probe itself
# survives being parsed a second, third, ... time (S26,
# CTPROBE-STATIC-ZONE-NO-RELOAD in memory/labs/nginx-cache-turbo-module/
# issues.md).
#
# ONE WORKER, DELIBERATELY -- same reasoning as fault-slab-store next door:
# the resource oracles (cycle_used/cycle_blocks/cycle_large/fds) are
# PER-WORKER readings, and with several workers the pre- and post-reload
# snapshots could be taken on different workers, making the comparison
# meaningless rather than red. worker_processes 4 is multi-worker's own
# scenario for cross-worker coherence; this one measures the reload axis.
load_module @BUILD_OBJS@/ngx_http_cache_turbo_module.so;
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 1;
events { worker_connections 32; }
http {
    @PROBE_ZONE@

    cache_turbo_zone name=ct 8m;

    access_log off;

    server {
        listen 127.0.0.1:@PORT@;

        location /origin {
            default_type text/plain;
            return 200 "ct-reload-cycle-payload\n";
        }

        location /cached/ {
            cache_turbo        ct;
            cache_turbo_key    $uri;
            cache_turbo_valid  60s;

            proxy_pass         http://127.0.0.1:@PORT@/origin;
        }

        location / { return 200 "OK\n"; }

        # Served by cache_turbo's OWN probe directive -- see ../env. This is
        # what the whole scenario is proving can survive a second (and
        # third, ...) parse of this same conf.
        location /__probe { @PROBE@ }
    }
}
