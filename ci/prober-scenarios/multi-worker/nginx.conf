#
# S25 port of testkit's multi-worker: several workers sharing ONE cache_turbo
# shm zone must all serve consistent cache state -- a request that MISSed on
# worker A must HIT on worker B, since the zone (not the worker) is where the
# entry lives. Same load/zone/origin/cached shape as the sibling S25 confs.
load_module @BUILD_OBJS@/ngx_http_cache_turbo_module.so;
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;
worker_processes 4;
events { worker_connections 100; }
http {
    @PROBE_ZONE@

    cache_turbo_zone name=ct 8m;

    access_log off;

    server {
        listen 127.0.0.1:@PORT@;

        location /origin {
            default_type text/plain;
            return 200 "ct-multi-worker-payload\n";
        }

        location /cached/ {
            cache_turbo        ct;
            cache_turbo_key    $uri;
            cache_turbo_valid  60s;

            proxy_pass         http://127.0.0.1:@PORT@/origin;
        }

        location / { return 200 "OK\n"; }
        location /__probe { @PROBE@ }
    }
}
