#
# @LOAD@ above load_modules the testkit ref probe, which carries
# ngx_test_probe.o (the generic renderer, the hook dispatch, and
# ngx_test_probe_arm's fault-query parser). This line loads the module under
# test out of the SAME objs/, exactly as the sibling scenarios do. ./requires
# has already SKIPped the scenario on a tree lacking the .so, so this line is
# only reached where it exists.
load_module @BUILD_OBJS@/ngx_http_cache_turbo_module.so;
daemon off;
pid @PREFIX@/nginx.pid;
error_log @PREFIX@/logs/error.log info;

# ONE WORKER, DELIBERATELY, AND IT IS THE OPPOSITE CHOICE FROM
# shm-coherence-varidx NEXT DOOR.
#
# The resource oracles here read `cycle_used`, `cycle_blocks`, `cycle_large`
# and `fds` out of the probe document, and every one of those is a PER-WORKER
# reading taken from whichever worker answered the probe request. With several
# workers, the request that trips the fault and the request that reads the
# snapshot are load-balanced independently, so a delta would compare worker A's
# pool before against worker B's pool after -- two unrelated numbers whose
# difference means nothing, in either direction. That is not a flaky test; it
# is a test with no oracle at all.
#
# ⚠ This does NOT make the countdown's home in shared memory redundant, and the
# reasoning must not be "simplified" that way later. The arm and the trip are
# separate TCP connections even here; they only reliably meet because the
# counter is in the zone. One worker makes the RESOURCE READING attributable --
# it does not make a per-worker global correct, it merely hides the difference
# on this one conf. The multi-worker case is the normal deployment, and
# shm-coherence-varidx is the scenario that runs four.
worker_processes 1;

events { worker_connections 128; }

http {
    @PROBE_ZONE@

    # Small on purpose but comfortably above the module's own 8-page floor.
    # The fault is injected by the arm, never by exhaustion, so this zone is
    # deliberately big enough that an UNARMED store always succeeds -- an
    # oracle that cannot tell "the fault fired" from "the zone was full" is no
    # oracle. The unarmed-control leg in driver.sh is what proves that.
    cache_turbo_zone name=ct 4m;

    access_log off;

    server {
        listen 127.0.0.1:@PORT@;

        # No keepalive. Each leg is a fresh connection so nothing about this
        # scenario depends on connection reuse, and the fd oracle sees a
        # settled descriptor count rather than a lingering idle connection.
        keepalive_timeout 0;

        # THE ORIGIN. A plainly cacheable 200 with a body: no Vary, no
        # Set-Cookie, no Cache-Control that would make the module refuse the
        # store for a reason unrelated to the injected fault. Every refusal
        # this scenario observes must be attributable to fault_slab and to
        # nothing else, which is why this response is as boring as possible.
        location /origin {
            default_type text/plain;
            return 200 "ct-fault-slab-payload\n";
        }

        # The measured location. Distinct URI prefixes per leg (driver.sh uses
        # /cached/armed and /cached/control) so the legs cannot contaminate one
        # another through a shared cache key -- a control leg that HIT on the
        # armed leg's entry would report the store path healthy without ever
        # running it.
        location /cached/ {
            cache_turbo        ct;
            cache_turbo_key    $uri;
            cache_turbo_valid  60s;

            proxy_pass         http://127.0.0.1:@PORT@/origin;
        }

        # Served by cache_turbo's OWN probe directive, not testkit's
        # test_ref_probe: test_ref_probe aims the probe at the REF module's
        # zone, which is NULL here, and a NULL zone never reaches our
        # fault_set hook (ngx_test_probe_arm dispatches to fault_set only when
        # a zone is present). The arm would silently fall through and every
        # oracle below would measure an unarmed server.
        location /__probe { @PROBE@ }
    }
}
