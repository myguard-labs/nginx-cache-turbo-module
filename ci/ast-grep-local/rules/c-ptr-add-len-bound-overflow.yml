id: c-ptr-add-len-bound-overflow
language: c
severity: warning
message: >-
  Pointer-overflow bounds check: `p + n` is formed before it is compared
  (n is length-named). When n is a length parsed from input, p + n can wrap or move past
  one-past-the-end, which is undefined behavior, and the check can pass.
  Compare the length against the remaining space instead.
note: >-
  For `p + n > last`, write `n > (size_t) (last - p)` (after establishing
  p <= last). Keep the original comparison's equality behavior: `p + n >= last`
  becomes `n >= (size_t) (last - p)`, `p + n < last` becomes
  `n < (size_t) (last - p)`, and a reversed operand order flips accordingly. A
  literal n, such as `p + 1 < last` or `p + (1) < last`, cannot be attacker-sized
  and is not flagged. ast-grep has no types, so this is a name heuristic; a
  genuinely safe hit is rewritten anyway (HARD-B4), not suppressed. Companion
  rule: c-ptr-add-bound-overflow. This rule keys on n being named like a length (an identifier ending in len,
  size, length or nbytes, also inside redundant parentheses); the bound is
  deliberately unconstrained, so integer forms such as `off + len > size` match
  too (the same unsigned-wrap class). For that unsigned integer form the
  pointer subtraction does not apply: rewrite `off + len > size` as
  `off > size || len > size - off` (the offset guard stops `size - off` from
  wrapping; an exact fit stays valid).
  Widened forms (HARD-B3-FOLLOWUP): a length-named right-hand addend of a sum
  (also a left-nested one, up to three levels) is flagged: scaled (`p + 2 * len`,
  `p + n * size`, `p + len * 2`, `p + (len * 2)`), nested with a trailing
  constant (`p + len + 2 > end`, `(p + len) + 1 > q`) and with a sum on both
  sides (`lo + 1 < p + len`). The literal-only side (`lo + 1`) is never the
  flagged offset, and an all-literal chain (`p + 1 + 2 > last`) is not flagged.
  Not flagged by design (none were flagged before either): a length-named left
  operand (`len + p > q`), a length-named operand inside a parenthesized
  sub-sum (`p + (len + 1) > q`) and a chain nested deeper than three levels.
  The rule is structural (kind, operator and field relations; the sum nesting
  is unrolled to three levels) rather than a `$P + $N` pattern list, because
  an `any` of patterns binds the first matching branch and so missed two-sided
  sums.
  A site matching both rules (e.g. `p + len > end`) is reported once per rule, so the
  baseline holds two rows for it; this is intended, each rule gates independently.
utils:
  lenlike0:
    regex: '(^[(\s]*|[._>])\w*(len|size|length|nbytes)[\s)]*$'
  scaled:
    all:
      - kind: binary_expression
      - has:
          field: operator
          regex: '^\*$'
      - any:
          - has:
              field: left
              matches: lenlike0
          - has:
              field: right
              matches: lenlike0
  lenlike:
    any:
      - matches: lenlike0
      - matches: scaled
      - all:
          - kind: parenthesized_expression
          - has:
              any:
                - matches: lenlike0
                - matches: scaled
  off0:
    all:
      - kind: binary_expression
      - has:
          field: operator
          regex: '^\+$'
      - any:
          - has:
              field: right
              matches: lenlike
  off1:
    all:
      - kind: binary_expression
      - has:
          field: operator
          regex: '^\+$'
      - any:
          - has:
              field: right
              matches: lenlike
          - has:
              field: left
              matches: off0
          - has:
              field: left
              kind: parenthesized_expression
              has:
                matches: off0
  off2:
    all:
      - kind: binary_expression
      - has:
          field: operator
          regex: '^\+$'
      - any:
          - has:
              field: right
              matches: lenlike
          - has:
              field: left
              matches: off1
          - has:
              field: left
              kind: parenthesized_expression
              has:
                matches: off1
  sumside:
    any:
      - matches: off2
      - all:
          - kind: parenthesized_expression
          - has:
              matches: off2
rule:
  all:
    - kind: binary_expression
    - has:
        field: operator
        regex: '^(<|>|<=|>=)$'
    - any:
        - all:
            - has:
                field: left
                matches: sumside
            - has:
                field: right
                regex: '(?s).'
        - all:
            - has:
                field: right
                matches: sumside
            - has:
                field: left
                regex: '(?s).'
