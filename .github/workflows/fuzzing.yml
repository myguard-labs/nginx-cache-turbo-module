# sync-sha: c834f76579388cf4aeb095f972639372df76d657cf6bcc9d8755bdc583bf6024
name: Fuzzing

# Fast fuzz regression gate on every PR/push — 60s/target on all five parser
# fuzzers (+dict where useful), kept short so PR feedback stays quick. Long
# discovery fuzzing (hours/target) lives in ci-deep.yml (monthly cron +
# workflow_dispatch).
#
# Action pins (keep in sync with build-test.yml header):
# actions/checkout@v5        -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd
# actions/upload-artifact@v5 -> 330a01c490aca151604b8cf639adc76d48f6c5d4

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Only used to namespace the ccache cache key (the fuzz targets do not link
  # the nginx source tree); keep in sync with the other workflows' pin.

on:
  # No triggers of its own: ci.yml is the single PR entry point, and the
  # path gate that used to live here is now the `changes` job there (a
  # reusable workflow cannot filter its own triggering). That gate still
  # matters -- with only 4 runner slots, a long job on a PR that cannot
  # possibly affect it pushes the whole wave's wall-clock out. The targets
  # are built from ci/fuzz/*.c plus the shims, which mirror parser code
  # lifted out of src/, so a docs or unrelated-workflow PR cannot change
  # fuzz behaviour. Keep ci.yml's `fuzz=` alternation in sync with what
  # ci/fuzz/build.sh actually compiles.
  workflow_call: {}
  workflow_dispatch: {}

concurrency:
  group: fuzzing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz-regression:
    name: Fuzz regression (60s/target)
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    env:
      # Single source for the per-target exploration budget. This is the
      # REGRESSION gate: the recorded-crash replay step above is what proves
      # known bugs stay fixed, and it is unaffected by this budget. Long
      # exploration (3600s/target, dispatch-tunable) lives in ci-deep.yml's
      # fuzz job. Kept as one env key so the value cannot drift between the
      # step name, the echo lines and the -max_total_time flag.
      FUZZ_SECONDS: 60
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install clang + libFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          mode: debug
          nginx-version: ${{ env.NGINX_VERSION }}

      - name: Build fuzz targets
        run: bash ci/fuzz/build.sh "$GITHUB_WORKSPACE/ci/fuzz"

      - name: Smoke absent and present-empty Cookie headers under ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ci/fuzz/auto_classify_empty_smoke

      # Recorded crashes first: deterministic, seconds, and a returning bug fails
      # here rather than waiting on the fresh budget below to rediscover it.
      # Each unit is replayed as a single input (no -max_total_time): libFuzzer
      # runs the file once and exits non-zero if it still reproduces.
      - name: Replay recorded regressions
        run: |
          set -euo pipefail
          cd ci/fuzz
          total=0
          failed=0
          for dir in regressions/*/; do
            bin="$(basename "$dir")"
            [ -x "./$bin" ] || { echo "❌ no such fuzz target: $bin"; exit 1; }
            # Real units only; README.md and an empty dir are both fine.
            n=0
            bad=0
            for unit in $(find "$dir" -type f ! -name 'README.md' | sort); do
              n=$((n + 1))
              total=$((total + 1))
              # One unit per invocation, status checked individually. Do NOT
              # batch these through xargs: xargs reports its own 123 rather than
              # the target's exit code, so a crashing unit reads as a pass.
              set +e
              out=$("./$bin" -runs=1 "$unit" 2>&1)
              rc=$?
              set -e
              if [ $rc -ne 0 ]; then
                bad=$((bad + 1))
                failed=$((failed + 1))
                echo "❌ $bin: $unit still reproduces (exit $rc)"
                printf '%s\n' "$out" | tail -30
              fi
            done
            if [ "$n" -eq 0 ]; then
              echo "— $bin: no recorded regressions"
            elif [ "$bad" -eq 0 ]; then
              echo "✓ $bin: all $n replayed clean"
            fi
          done
          [ "$failed" -eq 0 ] || { echo "❌ $failed recorded regression(s) reproduce"; exit 1; }
          if [ "$total" -eq 0 ]; then
            # Loud, not a failure: an empty regressions/ tree is the documented
            # normal state for targets that have never crashed (see
            # regressions/README.md). But a step that silently replays nothing
            # reads exactly like a step that replayed something and passed —
            # make the no-op explicit so this gate cannot go vacuous unnoticed.
            echo "⚠ replayed 0 recorded regression(s) across all targets — this step is"
            echo "  currently a no-op (no crash has ever been recorded; see regressions/README.md)"
          else
            echo "replayed $total recorded regression(s) across all targets, all clean"
          fi

      # Name carries the literal, not ${{ env.FUZZ_SECONDS }}: the run: block
      # below is the single consumer of that value, and a step name is not
      # worth an expression. Update both together if the budget changes.
      - name: Run each target 60s
        run: |
          set -euo pipefail
          cd ci/fuzz
          # target:corpus:dict — dict empty where a token dictionary does not help.
          targets="fuzz_resp_parser:corpus:fuzz.dict \
                   fuzz_norm_args:corpus_norm_args: \
                   fuzz_mc_parser:corpus_mc:fuzz_mc.dict \
                   fuzz_auto_classify:corpus_auto: \
                   fuzz_blob:corpus_blob:"
          for t in $targets; do
            bin="${t%%:*}"; rest="${t#*:}"; corp="${rest%%:*}"; dict="${rest#*:}"
            echo "=== $bin over $corp (${FUZZ_SECONDS}s)${dict:+ dict=$dict} ==="
            args="-max_total_time=${FUZZ_SECONDS} -print_final_stats=1 -artifact_prefix=crash-${bin}-"
            [ -n "$dict" ] && args="$args -dict=$dict"
            set +e
            # shellcheck disable=SC2086
            "./$bin" $args "$corp/"
            rc=$?
            set -e
            [ $rc -eq 0 ] || { echo "❌ $bin crash (exit $rc)"; exit 1; }
            echo "✓ $bin: no crashes in ${FUZZ_SECONDS}s"
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: fuzz-fast-crashes
          path: |
            ${{ github.workspace }}/ci/fuzz/crash-*
          retention-days: 14
