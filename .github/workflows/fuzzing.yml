# sync-sha: a7f2a3fd9d9ae9767102c835c1bc4a4bbebdfd6589e4988f6ff85b48e0a89101
name: Fuzzing

# Fast fuzz regression gate on every PR/push — 120s/target on all five parser
# fuzzers (+dict where useful), kept short so PR feedback stays quick. Long
# discovery fuzzing (hours/target) lives in ci-deep.yml (monthly cron +
# workflow_dispatch).
#
# Action pins (keep in sync with build-test.yml header):
# actions/checkout@v5        -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd
# actions/upload-artifact@v5 -> 330a01c490aca151604b8cf639adc76d48f6c5d4

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Only used to namespace the ccache cache key (the fuzz targets do not link
  # the nginx source tree); keep in sync with the other workflows' pin.
  NGINX_VERSION: "1.31.1"

on:
  # Path-gated for the same reason asan.yml is: this is a ~8min job and, with only
  # 4 matching runner slots, every long job on a PR that cannot possibly affect it
  # pushes the whole wave's wall-clock out. The targets are built from ci/fuzz/*.c
  # plus the shims, which mirror parser code lifted out of src/ -- so a docs, memory,
  # or unrelated-workflow PR cannot change fuzz behaviour. Keep this list in sync
  # with what ci/fuzz/build.sh actually compiles.
  workflow_call: {}
  workflow_dispatch: {}

concurrency:
  group: fuzzing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz-regression:
    name: Fuzz regression (120s/target)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","builder02"]') }}
    timeout-minutes: 45
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install clang + libFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          mode: debug
          nginx-version: ${{ env.NGINX_VERSION }}

      - name: Build fuzz targets
        run: bash ci/fuzz/build.sh "$GITHUB_WORKSPACE/ci/fuzz"

      # Recorded crashes first: deterministic, seconds, and a returning bug fails
      # here rather than waiting on the fresh budget below to rediscover it.
      # Each unit is replayed as a single input (no -max_total_time): libFuzzer
      # runs the file once and exits non-zero if it still reproduces.
      - name: Replay recorded regressions
        run: |
          set -euo pipefail
          cd ci/fuzz
          total=0
          failed=0
          for dir in regressions/*/; do
            bin="$(basename "$dir")"
            [ -x "./$bin" ] || { echo "❌ no such fuzz target: $bin"; exit 1; }
            # Real units only; README.md and an empty dir are both fine.
            n=0
            bad=0
            for unit in $(find "$dir" -type f ! -name 'README.md' | sort); do
              n=$((n + 1))
              total=$((total + 1))
              # One unit per invocation, status checked individually. Do NOT
              # batch these through xargs: xargs reports its own 123 rather than
              # the target's exit code, so a crashing unit reads as a pass.
              set +e
              out=$("./$bin" -runs=1 "$unit" 2>&1)
              rc=$?
              set -e
              if [ $rc -ne 0 ]; then
                bad=$((bad + 1))
                failed=$((failed + 1))
                echo "❌ $bin: $unit still reproduces (exit $rc)"
                printf '%s\n' "$out" | tail -30
              fi
            done
            if [ "$n" -eq 0 ]; then
              echo "— $bin: no recorded regressions"
            elif [ "$bad" -eq 0 ]; then
              echo "✓ $bin: all $n replayed clean"
            fi
          done
          [ "$failed" -eq 0 ] || { echo "❌ $failed recorded regression(s) reproduce"; exit 1; }
          echo "replayed $total recorded regression(s) across all targets, all clean"

      - name: Run each target 120s
        run: |
          set -euo pipefail
          cd ci/fuzz
          # target:corpus:dict — dict empty where a token dictionary does not help.
          targets="fuzz_resp_parser:corpus:fuzz.dict \
                   fuzz_norm_args:corpus_norm_args: \
                   fuzz_mc_parser:corpus_mc:fuzz_mc.dict \
                   fuzz_auto_classify:corpus_auto: \
                   fuzz_blob:corpus_blob:"
          for t in $targets; do
            bin="${t%%:*}"; rest="${t#*:}"; corp="${rest%%:*}"; dict="${rest#*:}"
            echo "=== $bin over $corp (120s)${dict:+ dict=$dict} ==="
            args="-max_total_time=120 -print_final_stats=1 -artifact_prefix=crash-${bin}-"
            [ -n "$dict" ] && args="$args -dict=$dict"
            set +e
            # shellcheck disable=SC2086
            "./$bin" $args "$corp/"
            rc=$?
            set -e
            [ $rc -eq 0 ] || { echo "❌ $bin crash (exit $rc)"; exit 1; }
            echo "✓ $bin: no crashes in 120s"
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: fuzz-fast-crashes
          path: |
            ${{ github.workspace }}/ci/fuzz/crash-*
          retention-days: 14
