# sync-sha: 49341d0b6872812ccdf18993b3365946b7aeb136202d298b9a04b8b1ebe0fc98
name: Build & Test

# Runner labels live in the POOL repository variable. Every checked-in selector
# therefore stays portable and falls back to GitHub-hosted execution when unset.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      skip-expensive-jobs:
        description: "Skip expensive jobs (validation, build) on docs-only changes; required checks (runtime, prove) still run as quick no-ops"
        required: false
        type: boolean
        default: false
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    name: Validation
    if: ${{ !inputs.skip-expensive-jobs }}
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck shellcheck python3-pip pipx
          # ruff is pinned so a new release cannot add a rule to the selected
          # tiers and land this job red on an unrelated PR.
          #
          # Same pipx-with-pip-fallback shape as the semgrep install in
          # security-scanners.yml: PEP 668 blocks a bare pip3 install into the
          # system Python on Ubuntu 24.04. Both paths
          # land the binary in ~/.local/bin, which is NOT on the runner's
          # default PATH -- without the GITHUB_PATH append the next step dies
          # with "ruff: command not found", i.e. a gate that fails for a reason
          # that has nothing to do with the code.
          if command -v pipx >/dev/null; then
            pipx install --quiet 'ruff==0.15.20'
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            pip3 install --quiet --user --break-system-packages 'ruff==0.15.20'
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: ruff (correctness tiers F,B,I,PLE,RET,RUF059)
        run: |
          set -euo pipefail
          # ci/tools/test_runtime.py IS the runtime suite (~15.6k lines) and
          # went unlinted before this gate. RUF059 (unused-unpacked-variable)
          # is the reason this gate exists: a captured-then-never-read variable
          # is the tell for the vacuous-assertion class that produced a test
          # whose only surviving assertion was satisfied by BOTH the pass and
          # the fail state. Mirrors the ruff hook in .pre-commit-config.yaml --
          # move both together.
          #
          # I (import sorting) joined the gate 2026-08-02: measured across all
          # nine module repos it is 100% safe-autofixable (`--select I --fix`),
          # so it cannot land red on arrival. The rest of the nominally "cheap"
          # tier (N, C4, SIM, UP, PLW, RUF) was measured at 84 findings here
          # with only 21 safe-autofixable, i.e. 63 hand-edits to the test
          # harness for no correctness gain -- left out deliberately, see the
          # ruff hook comment in .pre-commit-config.yaml for the full reasoning.
          #
          # Style tiers (PT018, E501) are deliberately excluded: 257 findings
          # would land this red on arrival and train --no-verify.
          ruff --version          # records which ruff resolved off PATH
          ruff check --select F,B,I,PLE,RET,RUF059 ci/

      - name: Validate scripts and source
        run: |
          # ci/linter/*.sh joins the glob with the linter gate itself: without
          # it the checker scripts were the only shell in the repo CI never
          # syntax-checked, which is the wrong file set to leave uncovered.
          # Default severity (no -S), so info-level findings are fatal here
          # even though the pre-commit hook gates at -S warning.
          bash -n ci/tools/*.sh ci/fuzz/*.sh ci/linter/*.sh
          shellcheck ci/tools/*.sh ci/fuzz/*.sh ci/linter/*.sh
          # The runtime suite is a package (facade + ci/tools/areas/*.py), so
          # compile every part: a single-file py_compile of the facade would
          # let a syntax error in an area module reach the suite run instead
          # of failing in this cheap gate. The glob is nullglob-free on
          # purpose -- if areas/ ever disappears this errors rather than
          # silently checking one file.
          python3 -m py_compile ci/tools/test_runtime.py
          if [ -d ci/tools/areas ]; then
            python3 -m py_compile ci/tools/areas/*.py
          fi
          LINT_ONLY=ci-runners ci/linter/run-all.sh
          bash ci/tools/lint-ci-ports.sh
          python3 ci/tools/lint-orphan-tests.py
          python3 ci/tools/lint-doc-preset-count.py
          # P4-2-s3a: the admin reply buffers size themselves from a
          # hand-maintained fixed term that had drifted 237 bytes BELOW the
          # prose it must render. Measures it against the format string instead.
          python3 ci/tools/lint-admin-buffer-budget.py
          python3 ci/tools/test-tls-fixture-cleanup.py
          # Each stamped .github/ file carries a `# sync-sha:` of its own
          # content, so a `--list` diff against nginx-skeleton-module names
          # exactly which copies have drifted. The stamps are only worth
          # reading if they cannot go stale, hence this gate: edit a workflow
          # without running ci/tools/sync-stamp.sh and the PR goes red here.
          bash ci/tools/sync-stamp.sh --check

      - name: Reject corrupt downloaded inputs
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          printf corrupt > "$tmp/nginx-1.31.1.tar.gz"
          if bash ci/tools/verify-download.sh "$tmp/nginx-1.31.1.tar.gz"; then
            echo "corrupt nginx archive passed checksum verification" >&2
            exit 1
          fi

      - name: Static analysis (R7 shm-lock + P4-2-s3b stripe seam + CARVE-INIT + cppcheck + whitespace)
        run: |
          bash ci/tools/lint-shm-lock.sh
          # CARVE-INIT: every shctx member must be initialised at zone carve.
          # ngx_slab_alloc() does not zero, but the fresh-carve path lands on
          # kernel-zeroed pages, so a forgotten member reads 0 anyway and no
          # runtime test can observe the omission -- only this gate can.
          #
          # This checker PARSES the module with clang rather than lexing it,
          # so it needs an nginx tree whose ./configure has run -- that is
          # where ALL_INCS comes from. `configure` mode stops before make, so
          # this costs seconds, not a build. It is deliberately NOT reusing the
          # build job's tree: this job runs first and must stay independent of
          # it, and a gate that silently skipped when the tree was absent would
          # be the silent-green this checker exists to prevent (it exits 2).
          # ci-build.sh sources .github/versions.env itself and prints the
          # tree it produced, so the path is READ BACK from that line rather
          # than re-derived here. Re-deriving it would put the pinned version
          # in two places, and a drift between them would point NGX_SRC_TREE at
          # a directory that does not exist -- which this gate reports as
          # exit 2, correctly but confusingly.
          tree="$(bash ci/tools/ci-build.sh nginx "" configure | sed -n 's/^tree=//p')"
          [ -n "$tree" ] || { echo "ci-build.sh printed no tree= line" >&2; exit 1; }
          NGX_SRC_TREE="$tree" bash ci/tools/lint-carve-init.sh
          # P4-2-s3b: no site may reach a stripe's slab pool outside the
          # resolver. At N == 1 a stray bare `z->shpool` behaves identically to
          # the resolver, so no runtime test can see it -- this is the only
          # gate that can.
          bash ci/tools/lint-stripe-seam.sh
          # Scan every source (CI-4): the explicit list previously omitted
          # src/ngx_http_cache_turbo_autotune.c. A glob keeps new sources covered.
          # -DNGX_PTR_SIZE=8: the breaker probe-word layout selects on it and
          # #errors when it is undefined (H-1 -- an undefined macro in #if
          # silently evaluates to 0 and picked the wrong layout for the whole
          # unit suite). It normally arrives from nginx's generated
          # objs/ngx_auto_config.h, which cppcheck never sees here, so it has to
          # be supplied. 8 matches every target this module builds for.
          # --suppress=unusedStructMember and -I src mirror the pre-commit hook.
          # cppcheck analyses one TU at a time here, so it cannot see a struct
          # member read from another file and reports every one of them as
          # unused; unsuppressed it is a false-positive generator. -I src lets
          # headers next to the sources resolve instead of being reported
          # missing. The config header's rule is that a divergence gets fixed
          # toward CI, never by relaxing the hook.
          cppcheck \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=normalCheckLevelMaxBranches \
            --suppress=unusedFunction \
            --suppress=unusedStructMember \
            -I src \
            -DNGX_PTR_SIZE=8 \
            src/*.c
          git diff --check

      - name: Pure-math unit tests (SWR + autotune boundary branches)
        run: |
          # Fast, hermetic, no nginx: compiles the shipped src units verbatim
          # against a shim and drives the fixed-point boundary branches the HTTP
          # runtime suite cannot reach. check_constants.sh guards shim drift.
          bash ci/tests/unit/run.sh

      - name: Lint workflows
        run: |
          version=1.7.7
          archive="/tmp/actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          bash ci/tools/verify-download.sh "$archive"
          tar -xzf "$archive" -C /tmp actionlint
          # -config-file explicitly: auto-discovery of .github/actionlint.yaml
          # is not reliable across checkout layouts, and without the config the
          # self-hosted runner labels are flagged as unknown.
          /tmp/actionlint -color -config-file .github/actionlint.yaml \
            .github/workflows/*.yml

  build:
    name: Build
    if: ${{ !inputs.skip-expensive-jobs }}
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # dwarves provides pahole, which ci/tests/unit/extract_shm.sh needs
          # to measure ngx_http_cache_turbo_node_t's size (P2-3 slab-class
          # assertion). Without it the check has nothing to skip TO but a
          # silent pass -- so it is a required dependency, not optional.
          sudo apt-get install -y build-essential ccache clang curl dwarves eatmydata libpcre2-dev libssl-dev mold zlib1g-dev

      # ccache + upstream-tarball cache (see .github/actions/build-cache). No
      # whole-.build tree cache: ci-build.sh writes every mode into the shared
      # .build/nginx-<ver> path, so a cached tree could poison a later
      # sanitizer job -- ccache gives the compile win content-keyed and safe.
      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          mode: debug
          nginx-version: ${{ env.NGINX_VERSION }}

      - name: Build server and dynamic module
        run: |
          bash ci/tools/ci-build.sh nginx "$NGINX_VERSION"
          build=".build/nginx-${NGINX_VERSION}/objs"
          test -x "$build/nginx"
          test -f "$build/ngx_http_cache_turbo_module.so"

      - name: Report compiler-cache effectiveness
        run: ccache --show-stats

      - name: No hiredis dependency (native Redis driver)
        run: |
          # cache-turbo's L2 is native nginx upstream; the build must not link
          # hiredis. Guard against a regression that reintroduces it.
          if ldd ".build/nginx-${NGINX_VERSION}/objs/ngx_http_cache_turbo_module.so" \
              2>/dev/null | grep -qi hiredis; then
            echo "module links hiredis; expected native Redis driver" >&2
            exit 1
          fi

      - name: Unit tests — shm node state machine (ASan/UBSan)
        # Runs HERE, not in Validation, because these link nginx's real
        # ngx_rbtree.c and so need the configured tree the build job just made.
        # ci/tests/unit/run.sh SKIPS them when no such tree exists, so this step is
        # what makes them actually execute -- do not remove it on the assumption
        # the Validation job covers it. It does not.
        #
        # Guards CR-A (the L13 negative memo must survive the claim() that stubs
        # its node) and CR-B (unstub() must not free a COUNTER carrying min_uses
        # progress). Both are unreachable through the HTTP surface, so the
        # runtime suite passes with either bug restored -- see ci/tests/unit/
        # ngx_shim_shm.h. Each assertion is control-verified by injecting the
        # bug into the shipped source.
        run: |
          make -C ci/tests/unit --no-print-directory check \
            NGINX_VERSION="$NGINX_VERSION" \
            NGINX_SRC=".build/nginx-${NGINX_VERSION}/src" \
            NGINX_OBJS=".build/nginx-${NGINX_VERSION}/objs"

      - name: Unit tests — shm node state machine (TSan)
        # C1 made the PERF-7 blob refcount lock-free: blob_release() decrements
        # it OUTSIDE the zone mutex, so `refs` is the one piece of shm state
        # whose correctness rests on an atomic rather than on the mutex. ASan
        # proves each blob is freed exactly once; only TSan proves the counter
        # that decides so is race-free — a plain `refs--` there still frees once
        # per run on an unloaded box and sails through the ASan job.
        #
        # Control-verified: replacing that decrement with a non-atomic one makes
        # this step report a data race in blob_release and exit 66. Same binary,
        # same suite as the step above, second sanitizer (they cannot be linked
        # into one image).
        run: |
          make -C ci/tests/unit --no-print-directory tsan \
            NGINX_VERSION="$NGINX_VERSION" \
            NGINX_SRC=".build/nginx-${NGINX_VERSION}/src" \
            NGINX_OBJS=".build/nginx-${NGINX_VERSION}/objs"

      - name: Strict module compile
        # CI-1 (compiler axis): the same -Werror wall under BOTH gcc and clang.
        # The two diverge on warnings (clang flags shadow/unreachable/format cases
        # gcc misses and vice-versa), so a clean compile under both is a stronger
        # gate than gcc alone.
        run: |
          build=".build/nginx-${NGINX_VERSION}"
          cflags=$(awk '/^CFLAGS[[:space:]]*=/{sub(/^CFLAGS[[:space:]]*=[[:space:]]*/,""); print; exit}' "$build/objs/Makefile")
          incs=$(awk '/^ALL_INCS[[:space:]]*=/{found=1} found{line=$0; sub(/^ALL_INCS[[:space:]]*=[[:space:]]*/,"",line); continued=(line ~ /\\$/); gsub(/\\$/, "", line); printf "%s ", line; if (!continued) exit}' "$build/objs/Makefile")
          for cc in gcc clang; do
            echo "== strict compile: $cc =="
            for src in ngx_http_cache_turbo_module ngx_http_cache_turbo_shm ngx_http_cache_turbo_swr ngx_http_cache_turbo_autotune ngx_http_cache_turbo_redis ngx_http_cache_turbo_memcached; do
              # cflags and incs are compiler flag lists and must word-split.
              # shellcheck disable=SC2086
              ( cd "$build" && "$cc" -c -fPIC $cflags \
                  -Wall -Wextra -Wshadow -Wstrict-prototypes \
                  -Wstrict-aliasing -Wunreachable-code -Werror \
                  -Wno-unused-parameter \
                  $incs "$GITHUB_WORKSPACE/src/${src}.c" -o "/tmp/${cc}-${src}.o" )
            done
          done

      - name: Stage artifact
        run: |
          mkdir artifact
          cp ".build/nginx-${NGINX_VERSION}/objs/nginx" artifact/
          cp ".build/nginx-${NGINX_VERSION}/objs/ngx_http_cache_turbo_module.so" artifact/

      - name: Upload nginx artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: nginx-mainline
          path: artifact/
          retention-days: 1

# Clang --analyze static pass moved to ci-deep.yml (nightly) 2026-07-21: it is
# deterministic (same result every run) and security-scanners.yml's clang-tidy
# clang-analyzer-security.* pass already gives per-PR clang static-analyzer
# coverage, so a second full-configure clang pass per PR was redundant.

  runtime:
    name: Runtime
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    # REQUIRED CHECK: always report this check, but run full suite only when
    # code changed. When docs-only, skip and report quick success.
    # Always needs build, but build will be skipped if skip-expensive-jobs=true.
    needs: build
    # `!cancelled()` alone would REPLACE the implicit success() guard: on a
    # code-bearing PR where `build` genuinely fails, this job would still run
    # (as a noop, since skip-expensive-jobs is false but build produced no
    # artifact) and report SUCCESS -- a required check going green over a
    # failed build is worse than the slow-CI problem this workflow exists to
    # fix. Only let cancelled() bypass success() on the docs-only path, where
    # `build` was itself skipped (result == 'skipped', not 'success') and
    # this job must still run as a no-op to satisfy branch protection.
    if: ${{ !cancelled() && (inputs.skip-expensive-jobs || needs.build.result == 'success') }}
    # AUD-CIPORT1: own 64-wide port band so this job's fixtures cannot be
    # swept/collided by another runtime-bearing job on the same self-hosted
    # runner (asan.yml / ci-deep.yml). Every job below carries a DISTINCT
    # TEST_BASE_PORT -- see ci/tools/lint-ci-ports.sh, which fails CI if two
    # collide or if a sweep reverts to a hardcoded literal.
    env:
      TEST_BASE_PORT: 18880
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: "Docs-only skip: report success"
        if: ${{ inputs.skip-expensive-jobs }}
        run: echo "Skipped on docs-only changes; required check reports success"

      - name: Download nginx artifact
        if: ${{ !inputs.skip-expensive-jobs }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: nginx-mainline
          path: nginx-bin

      - name: Install runtime dependencies
        if: ${{ !inputs.skip-expensive-jobs }}
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server memcached

      - name: Sweep stale test listeners
        if: ${{ !inputs.skip-expensive-jobs }}
        run: |
          # Kill leftovers from earlier crashed runs still holding test
          # ports in THIS job's own band (cross-repo collisions on shared
          # runners). Must never widen back to the old shared 18870-18999 --
          # that killed a SIBLING job's live fixtures (AUD-CIPORT1).
          command -v fuser >/dev/null || sudo apt-get install -y psmisc
          for p in $(seq "$TEST_BASE_PORT" $((TEST_BASE_PORT + 63))); do
            fuser -k -TERM "${p}/tcp" 2>/dev/null || true
          done
          sleep 1

      - name: Verify runtime port band
        if: ${{ !inputs.skip-expensive-jobs }}
        run: ci/tools/max-port.sh "$TEST_BASE_PORT"

      - name: Run runtime suite
        if: ${{ !inputs.skip-expensive-jobs }}
        # Wrapped in ci-hang-guard.sh, same pattern as asan.yml: 749s worst-observed
        # on a runner shared with 4 sibling jobs leaves too little headroom to trust
        # a bare job timeout, and this job is not the critical path (A/UBSan is), so
        # a soft-timeout guard that captures evidence costs nothing on the happy path.
        #
        # AUD-TESTFIX1 log capture: ci-hang-guard.sh does `"$@" &` and tracks nginx as
        # a descendant of $! (see descendants()/nginx_pids_under() there). Piping
        # test_runtime.py directly (`cmd | tee log -- ...`) would make tee, not
        # python3, the backgrounded process, and nginx would come up as a SIBLING of
        # tee rather than a descendant -- the guard would report "no nginx under pid"
        # and never capture a hang again. Wrapping the whole pipeline in one
        # `bash -c '...'` keeps a single process ($!) that is the ancestor of both
        # python3 and tee, so nginx (python3's descendant) stays inside the tracked
        # tree. `set -o pipefail` inside that inner bash makes the wrapper's exit
        # status the suite's, not tee's, so a failing suite still fails this step.
        env:
          # Breadcrumb: the harness writes the running test here (see
          # test_runtime.py _write_breadcrumb). On an R6b hang the guard copies
          # it to hanging-test.txt so the backtrace is labelled with the culprit.
          CT_TEST_BREADCRUMB: ${{ github.workspace }}/ci-hang-artifacts/current-test.txt
        run: |
          chmod +x nginx-bin/nginx
          # Guard bound: measured 15 runs of THIS step on main
          # (2026-08-08, gh api .../jobs, "Run runtime suite" step
          # started_at/completed_at) gave min=709s median=724s max=749s.
          # That left only 151s of margin against the old 900s bound
          # (max within ~1.2x) -- a slower/contended runner risks the
          # guard firing mid-test and reading as an R6b hang (SUITE-
          # TIMEOUT-MARGIN, memory/labs/nginx-cache-turbo-module/TODO.md).
          # Raised to 1200s to match asan.yml's bound and restore real
          # headroom (900s -> 1200s, +451s over observed max).
          bash ci/tools/ci-hang-guard.sh 1200 "$GITHUB_WORKSPACE/ci-hang-artifacts" -- \
            bash -c '
              set -o pipefail
              python3 ci/tools/test_runtime.py \
                --fault-injection \
                --port "$TEST_BASE_PORT" \
                --nginx-binary "$GITHUB_WORKSPACE/nginx-bin/nginx" \
                --module "$GITHUB_WORKSPACE/nginx-bin/ngx_http_cache_turbo_module.so" \
                --redis-server /usr/bin/redis-server \
                --memcached-server /usr/bin/memcached \
                | tee runtime-suite.log
            '

      - name: Assert the requested fixture set actually came up (AUD-TESTFIX1)
        if: ${{ !inputs.skip-expensive-jobs }}
        run: bash ci/tools/assert-fixtures.sh runtime-suite.log

      # Without this the guard writes hanging-test.txt, the gdb backtrace and the
      # nginx error.log into ci-hang-artifacts/ and the job then discards them,
      # which is how earlier wedges produced no evidence. Mirrors asan.yml.
      - name: Upload hang-capture artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: runtime-hang-capture
          path: ci-hang-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  prove:
    name: Preset suite (Test::Nginx)
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    # REQUIRED CHECK: always report this check, but run full suite only when
    # code changed. When docs-only, skip and report quick success.
    # Always needs build, but build will be skipped if skip-expensive-jobs=true.
    needs: build
    # See the identical guard on `runtime` above: `!cancelled()` alone drops
    # the implicit success() check, which would let this REQUIRED check report
    # SUCCESS even when `build` failed on a code-bearing PR.
    if: ${{ !cancelled() && (inputs.skip-expensive-jobs || needs.build.result == 'success') }}
    # AUD-CIPORT1: own 64-wide band, same rule as the runtime job above -- the
    # band is what the sweep step below clears, and what keeps this job off a
    # sibling job's ports.
    #
    # NOTE the band is swept but NOT bound: under TEST_NGINX_RANDOMIZE (see the
    # run step) Test::Nginx picks its own random port per parallel job and
    # binds only ports it proved free, which is what makes `prove -j` safe.
    # The band therefore reserves this job's territory on the shared runner
    # without pinning the suite to it.
    env:
      TEST_BASE_PORT: 19264
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: "Docs-only skip: report success"
        if: ${{ inputs.skip-expensive-jobs }}
        run: echo "Skipped on docs-only changes; required check reports success"

      - name: Download nginx artifact
        if: ${{ !inputs.skip-expensive-jobs }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: nginx-mainline
          path: nginx-bin

      - name: Install Test::Nginx
        if: ${{ !inputs.skip-expensive-jobs }}
        run: |
          # Test::Nginx::Socket is the openresty harness (NOT nginx.org's
          # Test::Nginx). cpanminus pulls its dependency tree; the runner may
          # already carry it, so this is idempotent.
          # Group the install: `A || B && C` parses as `(A || B) && C`, so an
          # ungrouped form runs the apt install even when cpanm is already here.
          command -v cpanm >/dev/null || { sudo apt-get update && sudo apt-get install -y cpanminus; }
          perl -MTest::Nginx::Socket -e1 2>/dev/null || sudo cpanm --notest Test::Nginx

      - name: Sweep stale test listeners
        if: ${{ !inputs.skip-expensive-jobs }}
        run: |
          # Same band-scoped sweep as the runtime job -- never widen past the
          # band edge or it kills a sibling job's live fixtures (AUD-CIPORT1).
          command -v fuser >/dev/null || sudo apt-get install -y psmisc
          for p in $(seq "$TEST_BASE_PORT" $((TEST_BASE_PORT + 63))); do
            fuser -k -TERM "${p}/tcp" 2>/dev/null || true
          done
          sleep 1

      # AUD-CIPORT3. This job is the one that does NOT run on its declared
      # band: TEST_NGINX_RANDOMIZE makes Test::Nginx pick from gen_rand_port's
      # hardcoded 1988-65534 (Util.pm, no env knob), which straddles every band
      # in this repo. So this job's nginx port -- and its origin listener at
      # server_port()+1 -- can land inside a SIBLING job's band, where that
      # sibling's own sweep step will SIGTERM it mid-run.
      #
      # With 6 sibling bands (384 swept ports) that is a ~4.7% chance per run
      # across 4 parallel files, and it scales with the file count: at the 33
      # preset files this suite is heading for it reaches ~33%. It would
      # present as an unreproducible "connection refused" in an unrelated
      # preset, which is the worst kind of CI flake to chase.
      #
      # Cheapest correct fix: pre-bind the sibling bands for the life of this
      # job, so those ports are unpickable rather than merely unlucky.
      #
      # BIND SCOPE IS LOAD-BEARING. The generated nginx server listens on a
      # BARE port (Test::Nginx Util.pm `listen $ServerPort;`), i.e. 0.0.0.0.
      # A fence bound to 127.0.0.1 does not stop a wildcard bind from taking
      # the same port, so fencing loopback-only left exactly the collision
      # this step exists to prevent. Fence the same scope nginx uses.
      #
      # The converse half of the same asymmetry -- gen_rand_port PROBES only
      # 127.0.0.1 while nginx binds 0.0.0.0, so a "proved free" port can still
      # fail to bind -- is fixed suite-side in ci/t/lib/CacheTurbo.pm, which
      # re-probes on the wildcard address and re-draws. Read that header
      # before changing either half. Observed as run 32075040354: 278 preset
      # assertions passed and the job still failed on bind(0.0.0.0:34782).
      # AUD-CIPORT4: the sibling-band tuple below used to be a hand-maintained
      # literal list. It was already stale when found (missing 19328) and
      # gained a second miss (19392) the next time a band was added, because
      # nothing checked it against the workflow files it was transcribed from.
      # ci/tools/lint-ci-ports.sh derives its own band list from a repo-wide
      # scan already (`TEST_BASE_PORT:` across every .github/workflows/*.yml,
      # AUD-CIPORT2's overlap check) -- this step now performs the SAME derive
      # at run time instead of hand-listing, so a new band never needs a
      # second edit here to stay correct. TEST_BASE_PORT is exported by this
      # job's own `env:` block, so it is simply excluded rather than needing a
      # literal to subtract.
      # Derive the sibling bands SYNCHRONOUSLY, in a step of its own, and let
      # a derivation failure fail the JOB -- not silently disappear inside a
      # backgrounded process. The binder below runs `&` so it can outlive
      # this run step and stay alive through the suite; a `raise` inside a
      # backgrounded python is reaped along with the process and never
      # touches this step's exit code, so the empty-scan guard has to live
      # here, before anything is backgrounded, to actually gate the job.
      - name: Derive sibling port bands from the workflow files
        if: ${{ !inputs.skip-expensive-jobs }}
        run: |
          python3 - <<'PY' > sibling-bands.txt
          import glob, os, re

          own_base = int(os.environ["TEST_BASE_PORT"])

          # Derive every OTHER job's band from the workflow files themselves,
          # the same source ci/tools/lint-ci-ports.sh's AUD-CIPORT2 overlap
          # check reads -- not a hand-maintained tuple that can drift from it
          # (AUD-CIPORT4: the old tuple was already missing 19328 when found,
          # and gained a second miss, 19392, the next time a band was added).
          pattern = re.compile(r'TEST_BASE_PORT:\s*"?([0-9]+)"?')
          bases = set()
          for path in glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml"):
              with open(path, encoding="utf-8") as f:
                  for line in f:
                      m = pattern.search(line)
                      if m:
                          bases.add(int(m.group(1)))
          bases.discard(own_base)

          if not bases:
              # A repo-wide scan that finds NO sibling bands at all is not a
              # quiet success -- it means the glob or the regex broke, and a
              # silent empty fence is worse than the hand-maintained list it
              # replaced (it would report "fenced" while fencing nothing).
              # This step is NOT backgrounded, so this exit code is the job's.
              raise SystemExit(
                  "AUD-CIPORT4 fence: derived ZERO sibling TEST_BASE_PORT "
                  "bands from .github/workflows/*.yml -- refusing to report "
                  "a fence that holds no ports"
              )

          for base in sorted(bases):
              print(base)
          PY
          echo "derived $(wc -l < sibling-bands.txt) sibling bands: $(paste -sd, sibling-bands.txt)"

      - name: Fence sibling port bands off from RANDOMIZE
        if: ${{ !inputs.skip-expensive-jobs }}
        run: |
          # A leftover marker from an earlier attempt on the same runner would
          # satisfy the wait below instantly and hand the suite a fence that is
          # not built yet -- the exact failure this handshake exists to stop.
          rm -f fence-ready
          python3 - <<'PY' &
          import socket, time

          band_width = 64
          with open("sibling-bands.txt", encoding="utf-8") as f:
              bases = [int(line) for line in f if line.strip()]

          holders = []
          for base in bases:
              for p in range(base, base + band_width):
                  s = socket.socket()
                  # No SO_REUSEADDR: holding the port is the entire point, and
                  # sharing it would make the fence a no-op against a wildcard
                  # binder.
                  try:
                      s.bind(("0.0.0.0", p))
                      s.listen(1)
                      holders.append(s)
                  except OSError:
                      # Already held -- by a live sibling job, or by a stale
                      # listener its own sweep will clear. Either way this job
                      # must not pick it, and the suite's own wildcard probe
                      # will now decline it too.
                      s.close()
          print(f"fenced {len(holders)} ports across {len(bases)} sibling bands: {bases}", flush=True)
          # READINESS HANDSHAKE, not a sleep. Every socket above is bound
          # before this file appears, and the step below blocks on it.
          #
          # This replaced `sleep 2`, which was a real defect the moment the
          # band list stopped being hand-maintained: 2s was sized for the
          # 6-band literal tuple (384 sockets) and the derive correctly grew
          # the fence to 8 bands (512 sockets). The suite then started while
          # the binder was still working, probed 19433 (band 19392) as free,
          # and nginx lost the race to the fence a moment later --
          # "bind() to 127.0.0.1:19433 failed (98: Address already in use)",
          # 41 preset files dead. The scaffold's probe is NOT blind here
          # (a 0.0.0.0 holder does refuse a later 127.0.0.1 bind, verified);
          # it simply probed before the fence existed. A bigger sleep would
          # only move the race, so the fence reports done instead.
          with open("fence-ready", "w", encoding="utf-8") as fh:
              fh.write(f"{len(holders)}\n")
          # Outlive the prove step; the runner reaps us at job teardown.
          time.sleep(3600)
          PY
          echo "fence binder started (pid $!)"
          # Bounded wait: the binder is backgrounded, so its failure cannot
          # reach this step's exit code any other way. 60s is far above the
          # observed bind time and still fails fast if the binder died.
          for _ in $(seq 1 600); do
              [ -f fence-ready ] && break
              sleep 0.1
          done
          if [ ! -f fence-ready ]; then
              echo "fence binder never reported ready -- refusing to run the suite against a half-built fence" >&2
              exit 1
          fi
          echo "fence ready: $(cat fence-ready) ports held"

      - name: Run the preset suite
        if: ${{ !inputs.skip-expensive-jobs }}
        env:
          TEST_NGINX_BINARY: ${{ github.workspace }}/nginx-bin/nginx
          TEST_NGINX_LOAD_MODULES: ${{ github.workspace }}/nginx-bin/ngx_http_cache_turbo_module.so
          # RANDOMIZE is what makes `prove -j` correct, not merely faster: it
          # gives each parallel job its own random listening port AND its own
          # t/servroot_<port>/. Without it every job shares one port and one
          # servroot and they race -- observed as "bind() to <port> failed
          # (98: Address already in use)" plus a truncated NOTESTS result.
          # Do not pin TEST_NGINX_PORT or TEST_NGINX_SERVROOT alongside it;
          # either one re-shares the resource RANDOMIZE just separated. The
          # origin port is derived per process in ci/t/lib/CacheTurbo.pm.
          TEST_NGINX_RANDOMIZE: "1"
          # A shared-runner cold start competes with package builds; the
          # default 3s bound turns that into a "flaky" failure with nothing
          # wrong in the code. See feedback-nla-runtime-tests-timeout-env.
          TEST_NGINX_TIMEOUT: "20"
        run: |
          chmod +x nginx-bin/nginx
          set -o pipefail
          # servroot_<port> dirs are created under t/ by the scaffold itself.
          mkdir -p t
          # -j runs FILES in parallel; each .t owns its own nginx and servroot.
          prove -j4 -r ci/t/

# Legacy nginx (pre-1.23) runtime and ASan+UBSan moved OUT of this workflow
# 2026-07-21:
#   * Legacy pre-1.23 runtime -> ci-deep.yml (nightly). The pre-1.23 cookie-ARRAY
#     ABI branch changes rarely; nightly coverage is sufficient and keeps it off
#     the per-PR critical path.
#   * ASan+UBSan -> dedicated, path-gated asan.yml (compile-once + two parallel
#     suite jobs). Only runs on PRs that touch C sources / the build+runtime
#     harness, and no longer serialises the two suite runs.
