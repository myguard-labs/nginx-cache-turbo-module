# sync-sha: 1bf266342b892c57722f3f334848886dda8b45ca02b4942d8e55cc5f74d79224
name: CI

# Single entry point for the PR suite. The six checks below used to be
# independent workflows, each carrying its own push/pull_request trigger, so a
# PR asked for all of them at once. On the self-hosted pool that is the wrong
# shape: wall-clock here is dominated by jobs QUEUEING for a label-matching
# slot, not by the jobs themselves, so six simultaneous requests just means the
# tail waits.
#
# LANE MAP -- measured, not estimated. Re-derive with:
#
#   gh run view <id> -R myguard-labs/nginx-cache-turbo-module --json jobs \
#     -q '.jobs[] | [.name, .conclusion,
#                    (((.completedAt|fromdate)-(.startedAt|fromdate))|tostring)+"s"] | @tsv'
#
# All from ONE run, 31424310119 (2026-08-10, green) -- a single run rather than
# a per-workflow best, so the numbers are mutually consistent and the queueing
# gaps below are real:
#
#   changes         7s     Build&Test  Validation 31s, Build 127s,
#   CodeQL         88s                 Presets 59s, Runtime 755s
#   Valgrind      132s     A/UBSan     Build 164s, single-process 703s,
#   Scanners      302s                 multi-worker 761s
#   Fuzzing       668s
#
# Lint is not in that run (it was added after) and is not laned: hosted,
# no nginx build, takes no self-hosted slot, so it cannot affect the budget.
#
# The budget is the longest single JOB -- A/UBSan multi-worker at 761s -- because
# no arrangement can finish sooner than that. Lanes, measured:
#
#   A  A/UBSan     (164 build -> 703/761 the two soaks in parallel)  = 925s
#   B  Build&Test  (31 -> 127 -> 755/59 runtime + presets)           = 913s
#   C  Fuzzing (668s) and Security scanners (302s), side by side     = 668s
#
# Lane A is the critical path at 925s and the floor for the whole suite.
#
# Scanners USED to be chained behind fuzzing, when the pair fitted the budget
# (676 + 117 = 793s against 795s). It has since grown to 302s, which made that
# chain 970s -- 209s over -- and the suite's critical path. It now runs beside
# fuzzing instead; see the lane C comment below. Observed total wall-clock for
# the run above, with the chain still in place, was 1007s.
#
# Nothing queued in that run: every job started within 10s of its dependencies
# finishing, so these are execution times, not waits. Check /proc/loadavg and
# the slot count before comparing -- the host runs six ci-ephemeral@ slots
# (four lxc + two docker) and the org pool adds builder03.
#
# Valgrind (132s) is deliberately NOT chained behind anything: it is short,
# independent, and chaining it would only recreate the problem lane C just had.
#
# A lane is not a slot. Build&Test fans out into four jobs and A/UBSan into
# three, so observed peak is well above three runners; the org pool answers
# `builder02` with ten online slots (four lxc + two docker on builder02, four on
# builder03), so brief oversubscription at t=0 is absorbed.
#
# Lint and CodeQL run on ubuntu-latest, take no self-hosted slot, and are
# therefore not laned at all -- no `needs:`, they start immediately.
#
# Follow-ups use !cancelled() so a FAILING first check does not suppress an
# unrelated second one, and so a chain survives an earlier job being SKIPPED by
# the changed-files gate below.
#
# No `push:` trigger, by repo policy: CI runs on the PR, and the merge commit is
# identical to the tested PR head, so re-running it on merge buys nothing.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # "orchestrator-", not "ci-": build-test.yml already uses
  # ci-${{ github.workflow }}-${{ github.ref }}, and a called workflow inherits
  # the caller's github.workflow/github.ref -- so an identical group string
  # would make the member cancel its own caller and kill the lane before it
  # starts a single job. The prefix is what keeps the two apart.
  group: orchestrator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- changed-files gate --------------------------------------------------
  # asan.yml and fuzzing.yml previously carried their own `paths:` filters. A
  # reusable workflow cannot filter its own triggering, so those gates move here
  # as explicit job-level `if`s over this job's outputs. Dropping them silently
  # would run the ~800s sanitizer and ~680s fuzz jobs on every docs-only PR.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      asan: ${{ steps.filter.outputs.asan }}
      fuzz: ${{ steps.filter.outputs.fuzz }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          # Full history: a shallow clone has no common ancestor with the base,
          # so `base...HEAD` dies with "no merge base" and the gate would fall
          # through to false -- skipping the sanitizer on exactly the PRs that
          # need it.
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # workflow_dispatch has no PR base; treat that as "run everything".
          if [ -z "${BASE_SHA:-}" ]; then
            echo "asan=true" >> "$GITHUB_OUTPUT"
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail loudly rather than fail open. A gate that cannot compute its
          # diff must stop the run, not report "nothing relevant changed".
          if ! changed=$(git diff --name-only "$BASE_SHA"...HEAD); then
            echo "::error::cannot diff $BASE_SHA...HEAD -- refusing to fail open" >&2
            exit 1
          fi
          printf '%s\n' "$changed"
          # Mirrors the paths: filters asan.yml and fuzzing.yml carried before
          # the demotion. Keep in sync with what each job actually consumes.
          if printf '%s\n' "$changed" | grep -qE '^(src/|ci/tools/(ci-build\.sh|test_runtime\.py|ci-hang-guard\.sh|assert-fixtures\.sh)|\.github/actions/build-cache/|\.github/workflows/(asan|ci)\.yml)'; then
            echo "asan=true" >> "$GITHUB_OUTPUT"
          else
            echo "asan=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qE '^(src/|ci/fuzz/|ci/tools/assert-fixtures\.sh|\.github/actions/build-cache/|\.github/workflows/(fuzzing|ci)\.yml)'; then
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
          else
            echo "fuzz=false" >> "$GITHUB_OUTPUT"
          fi

  # --- lane A: the budget-setting workflow, alone --------------------------
  # A/UBSan's multi-worker soak is the longest job in the suite at 795s, so the
  # suite cannot finish sooner. Nothing is chained behind it.
  asan:
    name: A/UBSan
    needs: changes
    if: ${{ needs.changes.outputs.asan == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/asan.yml

  # --- lane B: Build&Test, alone -------------------------------------------
  # Its Runtime job is 741s, close enough to the budget that chaining anything
  # behind it would make this lane the critical path.
  build-test:
    name: Build&Test
    permissions:
      contents: read
    uses: ./.github/workflows/build-test.yml

  # --- lane C: Fuzzing, and Security Scanners BESIDE it, not behind it -----
  # Scanners was chained behind fuzzing while the pair fitted the budget:
  # 676s + 117s = 793s against 795s. Re-measured 2026-08-10 (run 31424310119)
  # it no longer does -- Security scanners has grown 117s -> 302s, so the chain
  # is 668 + 302 = 970s against a 761s budget (the ASan multi-worker soak, the
  # longest single job). That made lane C the critical path and put the whole
  # suite 209s over.
  #
  # Unchained, lane C is max(668, 302) = 668s and the critical path returns to
  # A/UBSan at 164 + 761 = 925s, which is the floor no arrangement can beat.
  # The cost is one more self-hosted slot at t=0 (peak 3 -> 4 concurrent);
  # the org pool answers `builder02` with ten slots, so the headroom is there.
  #
  # `needs: changes` is kept, and so is the `needs.changes.result == 'success'`
  # guard: that job exits 1 rather than fail open when it cannot compute its
  # diff, and a bare `!cancelled()` would run scanners anyway on a run whose
  # gate never produced a verdict. Fail-loud stays fail-closed down the lane.
  fuzzing:
    name: Fuzzing
    needs: changes
    if: ${{ needs.changes.outputs.fuzz == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/fuzzing.yml

  security-scanners:
    name: Security Scanners
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/security-scanners.yml

  # --- unlaned: short, independent, self-hosted ----------------------------
  # 139s. Chaining it behind fuzzing would put lane C at 932s -- over budget.
  valgrind:
    name: Valgrind
    permissions:
      contents: read
    uses: ./.github/workflows/valgrind.yml

  # --- unlaned: hosted, takes no self-hosted slot --------------------------
  # The ci/linter/ gate -- the same entry point .githooks/pre-commit runs, so a
  # clone that never set core.hooksPath still cannot land a lint regression.
  # Hosted, unlaned and fastest in the suite: it needs no nginx build and takes
  # no self-hosted slot, so it never competes with the soaks for the budget.
  lint:
    name: Lint
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  # --- unlaned: hosted, takes no self-hosted slot --------------------------
  codeql:
    name: CodeQL
    permissions:
      # Read-only checkout; the called workflow does not write to the repo.
      contents: read
      # codeql.yml's analyze job declares security-events: write itself; a
      # called workflow cannot receive more than the caller grants, so it is
      # granted here too and nowhere wider. It is what lets the CodeQL SARIF
      # upload reach code-scanning; every other member is called without it.
      security-events: write  # forwarded so codeql.yml can upload its SARIF
    uses: ./.github/workflows/codeql.yml
