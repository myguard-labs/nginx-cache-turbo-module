# sync-sha: b32700caf729ee9d48229309f5fc219ba90f61d51cb629ab054d5c300bdf19c9
name: CI

# Single entry point for the PR suite. The checks below used to be independent
# workflows, each carrying its own push/pull_request trigger, so a PR asked for
# all of them at once.
#
# SCHEDULING MODEL -- the pool is sized at 4 concurrent slots, and at that width
# this gate is WORK-BOUND, not latency-bound. That distinction drives every
# decision in this file, so it is worth stating precisely:
#
#   critical path (longest dependency chain)  =  921s
#   total work / 4 slots                      = 1001s   <-- the binding limit
#
# Because total work exceeds the critical path, makespan is set by the SUM of
# job durations, not by the longest chain. The practical consequence is
# counter-intuitive and has already been measured:
#
#   *** SHARDING A JOB MAKES THIS GATE SLOWER, NOT FASTER. ***
#
# Splitting Runtime into 2 shards was simulated at 1433s vs 1232s unsharded;
# 3 shards 1335s; sharding Fuzzing 1461s. Each shard re-pays the runtime
# suite's fixture setup (redis + memcached + TLS cert generation, ~30s) and
# there is no idle slot to absorb it. Only REMOVING work shortens this gate.
# Do not "parallelize" anything here without re-running that arithmetic.
#
# LANE MAP -- measured, not estimated. Re-derive with:
#
#   gh run view <id> -R myguard-labs/nginx-cache-turbo-module --json jobs \
#     -q '.jobs[] | [.name, .conclusion,
#                    (((.completedAt|fromdate)-(.startedAt|fromdate))|tostring)+"s",
#                    .startedAt, .completedAt] | @tsv'
#
# Medians over runs 32065061015 and 32061694088 (2026-08-17, both green 13/13):
#
#   changes        12s     Build&Test  Validation 50s, Build 157s,
#   Lint           41s                 Presets 182s, Runtime 764s
#   Scanners      174s     A/UBSan     Build 154s, single-process 725s,
#                                      multi-worker 738s
#   Fuzzing       ~370s (5 targets x 60s + replay; was 664s at 120s/target)
#
# Chains, measured:
#
#   A  A/UBSan     (154 build -> 725/738 parallel soaks)   = 892s
#   B  Build&Test  (157 build -> 764/182 runtime+presets)  = 921s  <-- longest
#   C  Fuzzing, and Security scanners beside it            = ~370s
#
# WHAT IS DELIBERATELY *NOT* HERE, and where it went. Each was removed because
# ci-deep.yml already runs a strictly stronger version of it; the PR leg was
# paying for a weaker duplicate:
#
#   Valgrind memcheck lite (60s soak, 158s job)
#       -> ci-deep.yml `memcheck` (600s soak, + `helgrind`). ASan already
#          covers memory errors on this leg, so the lite soak was the single
#          cheapest cut: dropping it alone recovers 6-slot makespan at 4 slots.
#   CodeQL (185s job)
#       -> codeql.yml's OWN monthly cron ("47 4 5 * *") -- it was never
#          exclusive to this gate, so nothing needed to move. Its findings
#          overlap the scanners job on the PR leg.
#
# Fuzzing stays, at a reduced 60s/target budget: its recorded-crash REPLAY step
# is the actual regression gate and is unaffected by that budget. Long
# exploration (3600s/target) is ci-deep.yml's `fuzz` job.
#
# A lane is not a slot. Build&Test fans out into four jobs and A/UBSan into
# three, so the initial peak still exceeds 4 and the pool serializes the tail.
#
# Lint is not laned -- no `needs:`, so it starts immediately.
#
# Follow-ups use !cancelled() so a FAILING first check does not suppress an
# unrelated second one, and so a chain survives an earlier job being SKIPPED by
# the changed-files gate below.
#
# NOTE: every job here, Lint included, resolves `runs-on` from vars.POOL and so
# consumes a self-hosted slot. An earlier revision of this header claimed Lint
# and CodeQL were hosted and slot-free; they were not, and the lane budget built
# on that claim was wrong. There are no hosted jobs in this gate.
#
# No `push:` trigger, by repo policy: CI runs on the PR, and the merge commit is
# identical to the tested PR head, so re-running it on merge buys nothing.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # "orchestrator-", not "ci-": build-test.yml already uses
  # ci-${{ github.workflow }}-${{ github.ref }}, and a called workflow inherits
  # the caller's github.workflow/github.ref -- so an identical group string
  # would make the member cancel its own caller and kill the lane before it
  # starts a single job. The prefix is what keeps the two apart.
  group: orchestrator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- changed-files gate --------------------------------------------------
  # asan.yml and fuzzing.yml previously carried their own `paths:` filters. A
  # reusable workflow cannot filter its own triggering, so those gates move here
  # as explicit job-level `if`s over this job's outputs. Dropping them silently
  # would run the ~800s sanitizer and ~680s fuzz jobs on every docs-only PR.
  changes:
    name: Detect relevant changes
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      asan: ${{ steps.filter.outputs.asan }}
      fuzz: ${{ steps.filter.outputs.fuzz }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          # Full history: a shallow clone has no common ancestor with the base,
          # so `base...HEAD` dies with "no merge base" and the gate would fall
          # through to false -- skipping the sanitizer on exactly the PRs that
          # need it.
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # workflow_dispatch has no PR base; treat that as "run everything".
          if [ -z "${BASE_SHA:-}" ]; then
            echo "asan=true" >> "$GITHUB_OUTPUT"
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail loudly rather than fail open. A gate that cannot compute its
          # diff must stop the run, not report "nothing relevant changed".
          if ! changed=$(git diff --name-only "$BASE_SHA"...HEAD); then
            echo "::error::cannot diff $BASE_SHA...HEAD -- refusing to fail open" >&2
            exit 1
          fi
          printf '%s\n' "$changed"
          # Mirrors the paths: filters asan.yml and fuzzing.yml carried before
          # the demotion. Keep in sync with what each job actually consumes.
          # ci/tools/areas/ holds the split-out runtime tests (MAINT-T1). It
          # MUST stay in this alternation: the suite used to be one file, and a
          # filter naming only test_runtime.py would stop triggering ASan the
          # moment a test moved into an area module -- coverage lost silently,
          # on every later PR, with nothing red to notice.
          if printf '%s\n' "$changed" | grep -qE '^(src/|ci/tools/(ci-build\.sh|test_runtime\.py|areas/|ci-hang-guard\.sh|assert-fixtures\.sh)|\.github/actions/build-cache/|\.github/workflows/(asan|ci)\.yml)'; then
            echo "asan=true" >> "$GITHUB_OUTPUT"
          else
            echo "asan=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qE '^(src/|ci/fuzz/|ci/tools/assert-fixtures\.sh|\.github/actions/build-cache/|\.github/workflows/(fuzzing|ci)\.yml)'; then
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
          else
            echo "fuzz=false" >> "$GITHUB_OUTPUT"
          fi
          # code: detect changes to code, CI workflows, or tests (anything that
          # isn't docs-only). gates Build&Test and Security Scanners to skip
          # on docs-only PRs.
          if printf '%s\n' "$changed" | grep -qvE '^\.(md|gitignore|github/ISSUE_TEMPLATE/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # --- lane A: the budget-setting workflow, alone --------------------------
  # A/UBSan's 715s terminal follows its mandatory 185s build. Nothing is
  # chained behind either terminal, so this stays at the 900s floor.
  asan:
    name: A/UBSan
    needs: changes
    if: ${{ needs.changes.outputs.asan == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/asan.yml

  # --- lane B: Build&Test, alone -------------------------------------------
  # Its 141s build fans out to 703s Runtime and 107s Presets: 844s total, with
  # only 56s headroom against the budget. Nothing independent follows it.
  #
  # On docs-only PRs, skip the expensive build/validation/runtime suite via
  # skip-expensive-jobs=true. The required checks (runtime and prove jobs)
  # still run but are quick no-ops, so branch protection is satisfied.
  build-test:
    name: Build&Test
    needs: changes
    permissions:
      contents: read
    uses: ./.github/workflows/build-test.yml
    with:
      skip-expensive-jobs: ${{ needs.changes.outputs.code == 'false' }}

  # --- lane C: Fuzzing, and Security Scanners BESIDE it, not behind it -----
  # Current measurements are 671s and 210s. Chaining them would take 881s and
  # consume almost the entire 900s budget; keeping them side by side leaves
  # lane C at 671s and preserves headroom for normal variance.
  #
  # `needs: changes` is kept, and so is the `needs.changes.result == 'success'`
  # guard: that job exits 1 rather than fail open when it cannot compute its
  # diff, and a bare `!cancelled()` would run scanners anyway on a run whose
  # gate never produced a verdict. Fail-loud stays fail-closed down the lane.
  fuzzing:
    name: Fuzzing
    needs: changes
    if: ${{ needs.changes.outputs.fuzz == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/fuzzing.yml

  # Scanners gate on code changes only: on docs-only PRs, skip the security
  # scanning (expensive). `needs: changes` is kept to inherit that job's
  # fail-closed behaviour: `changes` exits 1 rather than fail open when it
  # cannot compute its diff, and the explicit `result == 'success'` test means
  # a run whose gate never produced a verdict does not silently scan anyway.
  security-scanners:
    name: Security Scanners
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/security-scanners.yml

  # --- unlaned --------------------------------------------------------------
  # The ci/linter/ gate -- the same entry point .githooks/pre-commit runs, so a
  # clone that never set core.hooksPath still cannot land a lint regression.
  # Fastest job in the suite: it needs no nginx build. It stays outside the
  # runtime lanes because it has no runtime dependency (but it DOES take a
  # pool slot -- see the note in the header).
  lint:
    name: Lint
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml
