# sync-sha: b544425fcdde83e6dd3a6609ea9e7de56ba35f467ec99d9b2ef8de3e2df6f875
name: CI

# Single entry point for the PR suite. The checks below used to be independent
# workflows, each carrying its own push/pull_request trigger, so a PR asked for
# all of them at once.
#
# LANES (CI-L3..L5). The PR suite is four lanes plus the gate; each lane is
# one runner slot except A/UBSan, which is two self-contained jobs that run
# concurrently:
#
#   L-build   build-test.yml  build + unit (ASan/UBSan, TSan) + strict compile
#                             + runtime suite + preset suite, sequential, no
#                             artifact hop                         (~16-17m)
#   L-asan1   asan.yml        ASan/UBSan build + single-process runtime (~15m)
#   L-asan2   asan.yml        ASan/UBSan build + multi-worker runtime   (~16m)
#   L-static  static.yml      lint + validation + security scanners + fuzz
#                             regression + testkit prober, sequential (~15m)
#
# Earlier measurements showed this gate is WORK-bound at the pool's 4 slots, not
# latency-bound, so sharding a job makes it slower (each shard re-pays fixture
# setup) and only REMOVING work shortens it. Folding jobs into lanes removes the
# repeated checkout/tool setup and the artifact upload/download; no test was
# dropped (see the step inventory in the PR that introduced the lanes).
#
# WHAT IS DELIBERATELY *NOT* HERE, and where it went: Valgrind memcheck lite ->
# ci-deep.yml `memcheck`; CodeQL -> codeql.yml's own monthly cron. Fuzzing stays
# at a reduced 60s/target budget; its recorded-crash REPLAY step is the actual
# regression gate. Long exploration is ci-deep.yml's `fuzz` job.
#
# NOTE: every job here resolves `runs-on` from vars.POOL and so consumes a
# self-hosted slot; there are no hosted jobs in this gate.
#
# No `push:` trigger, by repo policy: CI runs on the PR, and the merge commit is
# identical to the tested PR head, so re-running it on merge buys nothing.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # "orchestrator-", not "ci-": build-test.yml already uses
  # ci-${{ github.workflow }}-${{ github.ref }}, and a called workflow inherits
  # the caller's github.workflow/github.ref -- so an identical group string
  # would make the member cancel its own caller and kill the lane before it
  # starts a single job. The prefix is what keeps the two apart.
  group: orchestrator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- changed-files gate --------------------------------------------------
  # asan.yml and fuzzing.yml (now static.yml) previously carried their own `paths:` filters. A
  # reusable workflow cannot filter its own triggering, so those gates move here
  # as explicit job-level `if`s over this job's outputs. Dropping them silently
  # would run the ~800s sanitizer and ~680s fuzz jobs on every docs-only PR.
  changes:
    name: Detect relevant changes
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      asan: ${{ steps.filter.outputs.asan }}
      fuzz: ${{ steps.filter.outputs.fuzz }}
      code: ${{ steps.filter.outputs.code }}
      testkit: ${{ steps.filter.outputs.testkit }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          # Full history: a shallow clone has no common ancestor with the base,
          # so `base...HEAD` dies with "no merge base" and the gate would fall
          # through to false -- skipping the sanitizer on exactly the PRs that
          # need it.
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # workflow_dispatch has no PR base; treat that as "run everything".
          if [ -z "${BASE_SHA:-}" ]; then
            {
              echo "asan=true"
              echo "fuzz=true"
              echo "code=true"
              echo "testkit=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail loudly rather than fail open. A gate that cannot compute its
          # diff must stop the run, not report "nothing relevant changed".
          if ! changed=$(git diff --name-only "$BASE_SHA"...HEAD); then
            echo "::error::cannot diff $BASE_SHA...HEAD -- refusing to fail open" >&2
            exit 1
          fi
          printf '%s\n' "$changed"
          # Mirrors the paths: filters asan.yml and fuzzing.yml carried before
          # the demotion. Keep in sync with what each job actually consumes.
          # ci/tools/areas/ holds the split-out runtime tests (MAINT-T1). It
          # MUST stay in this alternation: the suite used to be one file, and a
          # filter naming only the former monolithic runtime driver would stop triggering ASan the
          # moment a test moved into an area module -- coverage lost silently,
          # on every later PR, with nothing red to notice.
          if printf '%s\n' "$changed" | grep -qE '^(src/|ci/tools/(ci-build\.sh|test_runtime\.py|areas/|ci-hang-guard\.sh|assert-fixtures\.sh)|\.github/actions/build-cache/|\.github/workflows/(asan|ci)\.yml)'; then
            echo "asan=true" >> "$GITHUB_OUTPUT"
          else
            echo "asan=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qE '^(src/|ci/fuzz/|ci/tools/assert-fixtures\.sh|\.github/actions/build-cache/|\.github/workflows/(static|ci)\.yml)'; then
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
          else
            echo "fuzz=false" >> "$GITHUB_OUTPUT"
          fi
          # testkit: the prober leg reads src/, its local scenarios and its
          # driver/manifest scripts. Keep the matcher in one tested script so
          # a scenario-only oracle change cannot silently skip this job.
          # It does NOT depend on the runtime-suite driver or its area modules --
          # it drives testkit's scenario, not our runtime suite -- so this
          # alternation is deliberately narrower than asan's above.
          if ci/tools/testkit-impact-filter.sh <<<"$changed"; then
            echo "testkit=true" >> "$GITHUB_OUTPUT"
          else
            echo "testkit=false" >> "$GITHUB_OUTPUT"
          fi
          # code: detect changes to code, CI workflows, or tests (anything that
          # isn't docs-only). gates Build&Test to skip on docs-only PRs.
          # NOTE: this must anchor the DOCS-ONLY exclusions at the END of the
          # path (`\.md$`, not `^\.md`) or the start of the whole relative
          # path (`^\.gitignore$`, `^\.github/ISSUE_TEMPLATE/`) -- an earlier
          # version anchored everything at `^\.`, which only matches a path
          # beginning with a literal dot. `README.md` never matches that, so
          # `grep -qv` always found a "non-docs" line and `code` was ALWAYS
          # true. Verified against a fixture path list before landing.
          if printf '%s\n' "$changed" | grep -qvE '\.md$|^\.gitignore$|^\.github/ISSUE_TEMPLATE/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # --- lane L-asan: two self-contained sanitizer jobs (CI-L4) ----------------
  # asan.yml holds asan-single and asan-multi; each builds for itself (shared
  # `asan` ccache key, no artifact hop) and runs its suite on its own port band.
  asan:
    name: A/UBSan
    needs: changes
    if: ${{ needs.changes.outputs.asan == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/asan.yml  # zizmor: ignore[self-repository] -- $/ not yet accepted by actionlint

  # --- lane L-build: build, units, strict compile, runtime, presets (CI-L3) --
  # One job, sequential, no artifact hop. On docs-only PRs the whole lane is
  # skipped via skip-expensive-jobs; the gate job counts a skipped lane as green.
  build-test:
    name: Build&Test
    needs: changes
    permissions:
      contents: read
    uses: ./.github/workflows/build-test.yml  # zizmor: ignore[self-repository] -- $/ not yet accepted by actionlint
    with:
      skip-expensive-jobs: ${{ needs.changes.outputs.code == 'false' }}

  # --- lane L-static: lint, validation, scanners, fuzz, testkit (CI-L5) -------
  # One job of sequential steps (static.yml). Each section is gated by the
  # matching `changes` output; lint and the security scanners run on every PR
  # (a scanner finding can come from any file, so they are not path-gated).
  # `needs.changes.result == 'success'` keeps the fail-closed behaviour: a run
  # whose `changes` gate never produced a verdict does not silently lint/scan.
  static:
    name: Static
    needs: changes
    if: ${{ needs.changes.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/static.yml  # zizmor: ignore[self-repository] -- $/ not yet accepted by actionlint
    with:
      code: ${{ needs.changes.outputs.code == 'true' }}
      fuzz: ${{ needs.changes.outputs.fuzz == 'true' }}
      testkit: ${{ needs.changes.outputs.testkit == 'true' }}

  # --- result gate -----------------------------------------------------------
  # One stable check ("CI / gate") summarising every lane above, so branch
  # protection can require a single name and lanes can be added, merged or
  # renamed without touching it. `always()` makes it run even when a needed job
  # failed or was cancelled; without it a failed lane would leave the gate
  # skipped, which GitHub reports as passing for a required check.
  #
  # Verdict: any needed job failure/cancelled -> red; success or skipped ->
  # green (change detection legitimately skips asan/fuzzing/testkit). A job
  # skipped because its own upstream failed cannot hide: every lane's only
  # upstream is `changes`, which is in `needs` and must be exactly `success`.
  # An empty or malformed needs blob also fails (ci/tools/ci-gate-verdict.py).
  # Keep `needs` equal to every other job; ci/tests/test_ci_gate_verdict.py
  # asserts it.
  gate:
    name: gate
    needs: [changes, asan, build-test, static]
    if: ${{ always() }}
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Evaluate lane results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s' "$NEEDS" | python3 ci/tools/ci-gate-verdict.py
