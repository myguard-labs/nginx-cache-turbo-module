# sync-sha: fca183532239244ef9c5624dfad57db6284101c61bb969ac9426c4f865fdd4cd
name: CI Deep

# Exhaustive dynamic analysis — monthly cron + on-demand only, NEVER on PR.
# The fast PR/push gates live in the standalone fuzzing.yml (fuzz regression),
# valgrind.yml (memcheck lite) and security-scanners.yml (scanners) workflows;
# THIS file keeps the long/exhaustive runs. CodeQL remains in codeql.yml; this
# workflow complements it with long dynamic-analysis and scanner jobs.
#
# Jobs: fuzz (up to 14400s/target × 5) · legacy-runtime (pre-1.23 ABI) ·
#       clang-analyze (full-source path-flow) · memcheck soak · helgrind soak ·
#       asan-soak (ASan multi-worker fault-injection ×N — flake repetition) ·
#       scanners · coverage (gcov report — a REPORT, never a gate).
#   * memcheck AND helgrind run under ci/tools/soak.sh, which passes
#     --suppressions=ci/tools/valgrind.supp for BOTH, and --error-exitcode=99 for
#     helgrind — the drift-fix baseline for every module.
#   * cache-turbo is a memory-heavy module (shm slab + LRU + SWR + L2 clients),
#     so both soaks run 600s (longer than the 300s baseline) to churn eviction.
#
# Action pins (keep in sync with build-test.yml header):
# actions/checkout@v5        -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd
# actions/upload-artifact@v5 -> 330a01c490aca151604b8cf639adc76d48f6c5d4

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Monthly, day 5 @ 03:30 UTC — staggered per repo so ci-deep runs
    # don't pile up on the shared self-hosted runners.
    - cron: "30 3 5 * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Per-target fuzz duration (seconds)"
        required: false
        type: number
        default: 3600
      soak_iterations:
        description: "asan-soak: runtime-suite repetitions (flake hunt)"
        required: false
        type: number
        default: 8

concurrency:
  # "-${{ github.event_name }}": schedule and workflow_dispatch resolve the same
  # github.workflow AND the same github.ref on the default branch, so without it
  # both triggers hash to one group and cancel-in-progress makes a dispatch kill
  # a running monthly soak. Hit live: run 32060092573 was cancelled 58 min in,
  # superseded by a dispatch (32065298347). The PR gate drops Valgrind on the
  # grounds ci-deep still covers it -- true only if the deep run finishes.
  # Two triggers therefore get two groups; each still self-cancels.
  group: ci-deep-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-flavors:
    name: Compatibility (${{ matrix.flavor }} ${{ matrix.label }})
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    env:
      TEST_BASE_PORT: 19328
    strategy:
      fail-fast: false
      # The matrix deliberately reuses one verified band, so its legs are
      # serialized instead of racing three Test::Nginx servers on it.
      max-parallel: 1
      matrix:
        include:
          - flavor: nginx
            version_key: NGINX_MAINLINE
            label: mainline
          - flavor: nginx
            version_key: NGINX_STABLE
            label: stable
          - flavor: angie
            version_key: ANGIE_VERSION
            label: angie
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Resolve matrix version
        env:
          VERSION_KEY: ${{ matrix.version_key }}
        run: |
          value="${!VERSION_KEY:-}"
          [ -n "$value" ] || { echo "::error::$VERSION_KEY is not pinned"; exit 1; }
          echo "MATRIX_VERSION=$value" >> "$GITHUB_ENV"

      - name: Install build and Test::Nginx dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache cpanminus curl eatmydata \
            libio-socket-ssl-perl libpcre2-dev libssl-dev mold zlib1g-dev
          perl -MTest::Nginx::Socket -e1 2>/dev/null || sudo cpanm --notest Test::Nginx

      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          mode: debug
          flavor: ${{ matrix.flavor }}
          nginx-version: ${{ env.MATRIX_VERSION }}

      - name: Build server and module
        env:
          MATRIX_FLAVOR: ${{ matrix.flavor }}
        run: |
          bash ci/tools/ci-build.sh "$MATRIX_FLAVOR" "$MATRIX_VERSION" debug
          objs="$GITHUB_WORKSPACE/.build/${MATRIX_FLAVOR}-${MATRIX_VERSION}/objs"
          case "$MATRIX_FLAVOR" in angie) server=angie ;; *) server=nginx ;; esac
          test -x "$objs/$server"
          test -f "$objs/ngx_http_cache_turbo_module.so"
          echo "TEST_NGINX_BINARY=$objs/$server" >> "$GITHUB_ENV"
          echo "TEST_NGINX_LOAD_MODULES=$objs/ngx_http_cache_turbo_module.so" >> "$GITHUB_ENV"

      - name: Verify compatibility port band
        run: ci/tools/max-port.sh "$TEST_BASE_PORT"

      - name: Run Test::Nginx compatibility suite
        env:
          TEST_NGINX_PORT: ${{ env.TEST_BASE_PORT }}
          TEST_NGINX_SERVROOT: ${{ github.workspace }}/t/servroot-compat
          TEST_NGINX_TIMEOUT: 20
        run: |
          # Test::Nginx does mkdir(TEST_NGINX_SERVROOT), not mkdir -p, so the
          # PARENT has to exist. `t/` holds no tracked file (the suite lives in
          # ci/t/), so a fresh checkout has no t/ at all and every compat job
          # died on its first file with:
          #   FAILED--Further testing stopped: Failed to do mkdir .../t/servroot-compat
          # build-test.yml:464 already does this for the same reason.
          mkdir -p t
          PATH="$(dirname "$TEST_NGINX_BINARY"):$PATH" prove -r ci/t/

  fuzz:
    name: Fuzz (all targets, long)
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 600
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install clang + libFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Select fuzz duration
        env:
          FUZZ_SECONDS_INPUT: ${{ inputs.fuzz_seconds || '3600' }}
        run: |
          case "$FUZZ_SECONDS_INPUT" in
            ''|*[!0-9]*)
              echo "::error::fuzz_seconds must contain decimal digits only"
              exit 2
              ;;
          esac
          if [ "$FUZZ_SECONDS_INPUT" -lt 1 ] \
              || [ "$FUZZ_SECONDS_INPUT" -gt 14400 ]; then
            echo "::error::fuzz_seconds must be between 1 and 14400"
            exit 2
          fi
          printf 'FUZZ_SECS=%s\n' "$FUZZ_SECONDS_INPUT" >> "$GITHUB_ENV"

      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          mode: debug
          nginx-version: ${{ env.NGINX_VERSION }}

      - name: Build fuzz targets
        run: bash ci/fuzz/build.sh "$GITHUB_WORKSPACE/ci/fuzz"

      - name: Fuzz each target
        run: |
          set -euo pipefail
          cd ci/fuzz
          # target:corpus:dict — each target gets the full per-target budget.
          targets="fuzz_resp_parser:corpus:fuzz.dict \
                   fuzz_norm_args:corpus_norm_args: \
                   fuzz_mc_parser:corpus_mc:fuzz_mc.dict \
                   fuzz_auto_classify:corpus_auto: \
                   fuzz_blob:corpus_blob:"
          for t in $targets; do
            bin="${t%%:*}"; rest="${t#*:}"; corp="${rest%%:*}"; dict="${rest#*:}"
            echo "=== $bin over $corp (${FUZZ_SECS}s)${dict:+ dict=$dict} ==="
            args="-max_total_time=$FUZZ_SECS -print_final_stats=1 -artifact_prefix=crash-${bin}-"
            [ -n "$dict" ] && args="$args -dict=$dict"
            set +e
            # shellcheck disable=SC2086
            "./$bin" $args "$corp/"
            rc=$?
            set -e
            [ $rc -eq 0 ] || { echo "❌ $bin crash (exit $rc)"; exit 1; }
            echo "✓ $bin: no crashes in ${FUZZ_SECS}s"
            mkdir -p "${corp}-min"
            "./$bin" -merge=1 "${corp}-min/" "$corp/"
            echo "merged $corp: $(find "${corp}-min" -type f | wc -l) units"
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: fuzz-deep-crashes
          path: ${{ github.workspace }}/ci/fuzz/crash-*
          retention-days: 30

      - name: Upload minimized corpus
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: fuzz-corpus
          path: ${{ github.workspace }}/ci/fuzz/*-min
          retention-days: 30

      - name: Notify Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_BUILDS: ${{ secrets.DISCORD_CHANNEL_BUILDS }}
          # Passed as env, never interpolated into the run: block below.
          # A ${{ }} inside `run:` is pasted into the shell command by the
          # runner before bash sees it; via env: the value arrives as data.
          # These three are GitHub-controlled, so this is hardening, not a
          # live injection fix -- but it keeps the whole file free of the
          # pattern, so a future edit cannot quietly add an
          # attacker-controlled context beside a safe one.
          GH_REPO: ${{ github.repository }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          [ -n "$DISCORD_BOT_TOKEN" ] || exit 0
          curl -fsS -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_BUILDS/messages" \
            -d "{\"content\":\"🔴 $GH_REPO — CI Deep / fuzz FAILED. $GH_SERVER_URL/$GH_REPO/actions/runs/$GH_RUN_ID\"}" || true

  legacy-runtime:
    # Pre-1.23 nginx exposes multi-value request headers as the
    # r->headers_in.cookies ARRAY (ngx_array_t of ngx_table_elt_t*), not the
    # 1.23+ r->headers_in.cookie linked list. The module carries a separate
    # #else code path for that ABI (key-cookie lookup, preset key-cookie fold,
    # cache_turbo_key_cookie lookup). The mainline 1.31.1 jobs build ONLY the
    # 1.23+ branch, so without this job the pre-1.23 branch has ZERO coverage of
    # any kind (no compile job either) — a break there would ship silently.
    # 1.22.1 is the last pre-1.23 stable release. This builds it and runs the
    # full runtime suite, so the preset/DIY key-cookie tests execute the ARRAY
    # branch at runtime, not just compile it. Moved here from build-test.yml
    # 2026-07-21: the ABI branch changes rarely, so nightly coverage is enough
    # and it no longer sits on the per-PR critical path.
    name: Legacy nginx (pre-1.23) runtime
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    env:
      # AUD-CIPORT1: own 64-wide port band, distinct from every other
      # runtime-bearing job on this shared runner. See
      # ci/tools/lint-ci-ports.sh (fails CI on a collision or a hardcoded sweep).
      TEST_BASE_PORT: 19072
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache curl eatmydata libpcre2-dev libssl-dev mold redis-server memcached zlib1g-dev

      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          mode: debug
          nginx-version: ${{ env.LEGACY_NGINX_VERSION }}

      - name: Build module against legacy nginx
        run: bash ci/tools/ci-build.sh nginx "$LEGACY_NGINX_VERSION" debug

      - name: Sweep stale test listeners
        run: |
          # Kill leftovers from earlier crashed runs still holding test
          # ports in THIS job's own band. Must never widen back to the old
          # shared 18870-18999 -- that killed a SIBLING job's live fixtures
          # (AUD-CIPORT1).
          command -v fuser >/dev/null || sudo apt-get install -y psmisc
          for p in $(seq "$TEST_BASE_PORT" $((TEST_BASE_PORT + 63))); do
            fuser -k -TERM "${p}/tcp" 2>/dev/null || true
          done
          sleep 1

      - name: Verify legacy runtime port band
        run: ci/tools/max-port.sh "$TEST_BASE_PORT"

      - name: Run runtime suite against legacy nginx
        run: |
          B="$GITHUB_WORKSPACE/.build/nginx-${LEGACY_NGINX_VERSION}/objs"
          python3 ci/tools/test_runtime.py \
            --fault-injection \
            --port "$TEST_BASE_PORT" \
            --nginx-binary "$B/nginx" \
            --module "$B/ngx_http_cache_turbo_module.so" \
            --redis-server /usr/bin/redis-server \
            --memcached-server /usr/bin/memcached

      - name: Notify Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_BUILDS: ${{ secrets.DISCORD_CHANNEL_BUILDS }}
          # Passed as env, never interpolated into the run: block below.
          # A ${{ }} inside `run:` is pasted into the shell command by the
          # runner before bash sees it; via env: the value arrives as data.
          # These three are GitHub-controlled, so this is hardening, not a
          # live injection fix -- but it keeps the whole file free of the
          # pattern, so a future edit cannot quietly add an
          # attacker-controlled context beside a safe one.
          GH_REPO: ${{ github.repository }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          [ -n "$DISCORD_BOT_TOKEN" ] || exit 0
          curl -fsS -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_BUILDS/messages" \
            -d "{\"content\":\"🔴 $GH_REPO — CI Deep / legacy-runtime FAILED. $GH_SERVER_URL/$GH_REPO/actions/runs/$GH_RUN_ID\"}" || true

  clang-analyze:
    # Clang path-flow static analyzer (null-deref, leaks, uninit reads, dead
    # stores) over all six sources with the configured nginx include set. Any
    # report fails the job. Moved here from build-test.yml 2026-07-21: it is
    # deterministic, and security-scanners' clang-tidy clang-analyzer-security.*
    # pass already covers per-PR clang static analysis — so this deeper full-source
    # pass runs nightly rather than duplicating clang work on every PR.
    name: Clang static analyzer
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache clang curl eatmydata libpcre2-dev libssl-dev mold zlib1g-dev

      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          mode: module
          nginx-version: ${{ env.NGINX_VERSION }}

      - name: Clang --analyze every source
        run: |
          bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" module
          build=".build/nginx-${NGINX_VERSION}"
          incs=$(awk '/^ALL_INCS[[:space:]]*=/{found=1} found{line=$0; sub(/^ALL_INCS[[:space:]]*=[[:space:]]*/,"",line); continued=(line ~ /\\$/); gsub(/\\$/, "", line); printf "%s ", line; if (!continued) exit}' "$build/objs/Makefile")
          rc=0
          # Derive the list from the tree. It was hardcoded to six names while
          # src/ grew to fifteen, so access.c, filters.c, blob.c, conf.c,
          # purge.c, presets.c, match.c, vary.c and admin.c -- the hit path,
          # the store path, the blob (de)serialiser and the whole config
          # surface -- were never analysed and the lane still reported green.
          srcs=$(find "$GITHUB_WORKSPACE/src" -maxdepth 1 -name '*.c' -printf '%f\n' | sed 's/\.c$//' | sort)
          if [ -z "$srcs" ]; then
            echo "::error::no sources found under src/ -- refusing to report a vacuous pass"
            exit 1
          fi
          echo "analysing $(printf '%s\n' "$srcs" | wc -l) translation unit(s)"
          for src in $srcs; do
            # incs is a flag list and must word-split.
            # shellcheck disable=SC2086
            ( cd "$build" && clang --analyze -Xanalyzer -analyzer-output=text \
                -DNGX_DEBUG_PALLOC=1 $incs \
                "$GITHUB_WORKSPACE/src/${src}.c" 2>"/tmp/analyze-${src}.log" ) || {
              echo "::error file=src/${src}.c::clang failed to analyse this translation unit"
              cat "/tmp/analyze-${src}.log"
              rc=1
              continue
            }
            # Gate on parsed diagnostics, not on file size: clang writes notes
            # and incidental chatter to the same stream, so `[ -s ]` fails the
            # job on output that carries no finding at all.
            warns=$(grep -c 'warning:' "/tmp/analyze-${src}.log" 2>/dev/null) || warns=0
            if [ "$warns" -gt 0 ]; then
              echo "::error file=src/${src}.c::clang analyzer reported ${warns} warning(s)"
              cat "/tmp/analyze-${src}.log"
              rc=1
            fi
          done
          rm -f "$build"/*.plist
          exit "$rc"

      - name: Notify Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_BUILDS: ${{ secrets.DISCORD_CHANNEL_BUILDS }}
          # Passed as env, never interpolated into the run: block below.
          # A ${{ }} inside `run:` is pasted into the shell command by the
          # runner before bash sees it; via env: the value arrives as data.
          # These three are GitHub-controlled, so this is hardening, not a
          # live injection fix -- but it keeps the whole file free of the
          # pattern, so a future edit cannot quietly add an
          # attacker-controlled context beside a safe one.
          GH_REPO: ${{ github.repository }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          [ -n "$DISCORD_BOT_TOKEN" ] || exit 0
          curl -fsS -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_BUILDS/messages" \
            -d "{\"content\":\"🔴 $GH_REPO — CI Deep / clang-analyze FAILED. $GH_SERVER_URL/$GH_REPO/actions/runs/$GH_RUN_ID\"}" || true

  memcheck:
    name: Valgrind Memcheck soak
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 240
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache curl eatmydata libpcre2-dev libssl-dev mold pkg-config \
            redis-server memcached valgrind zlib1g-dev
      - name: Start L2 backends (redis, memcached)
        # apt's postinst calls deb-systemd-invoke/invoke-rc.d to start the
        # service, but GitHub-hosted runner images ship a policy-rc.d that
        # blocks automatic service starts on package install (it exists to
        # stop random daemons from booting on a build image) -- so the
        # packages land in /usr/bin with nothing listening on 6379/11211.
        # `apt-get install` succeeding is not evidence either port is up;
        # start both explicitly and wait for them to accept connections
        # before the soak below ever generates L2 traffic against them.
        run: |
          # The runner image MASKS both units (`Unit redis-server.service is
          # masked`), so `service ... start` cannot start them -- unmask and
          # enable first. This is a stronger block than policy-rc.d: masking
          # symlinks the unit to /dev/null, so nothing short of unmasking
          # brings it back. (The per-PR runtime job in build-test.yml sidesteps
          # this entirely by handing test_runtime.py --redis-server /usr/bin/...
          # so the harness spawns its OWN daemons; the soak wants the ordinary
          # system services, so it unmasks instead.)
          sudo systemctl unmask redis-server.service memcached.service || true
          sudo systemctl enable --now redis-server.service memcached.service || true
          sudo service redis-server start || true
          sudo service memcached start || true
          for _ in $(seq 1 50); do
            redis-cli -h 127.0.0.1 -p 6379 ping 2>/dev/null | grep -q PONG && break
            sleep 0.2
          done
          redis-cli -h 127.0.0.1 -p 6379 ping | grep -q PONG || {
            echo "::error::redis-server did not come up on 127.0.0.1:6379"; exit 1; }
          for _ in $(seq 1 50); do
            printf 'version\r\nquit\r\n' | timeout 2 nc 127.0.0.1 11211 2>/dev/null | grep -q VERSION && break
            sleep 0.2
          done
          printf 'version\r\nquit\r\n' | timeout 2 nc 127.0.0.1 11211 | grep -q VERSION || {
            echo "::error::memcached did not come up on 127.0.0.1:11211"; exit 1; }
      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          mode: debug
          nginx-version: ${{ env.NGINX_VERSION }}
      - name: Build debug nginx + cache-turbo module
        run: bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" debug
      - name: Memcheck soak (600s @ 4 conc, WITH suppressions, L1+L2)
        env:
          USE_VALGRIND: "1"
          # redis-server/memcached are explicitly started (and verified
          # ready) by the "Start L2 backends" step above, on their package
          # defaults (127.0.0.1:6379, 127.0.0.1:11211). Setting both here is
          # what makes soak.sh build the L2 vhost instead of its L1-only
          # default; see soak.sh's own header for the gate this trips if
          # either tier never actually gets hit.
          REDIS: "127.0.0.1:6379"
          MEMCACHED: "127.0.0.1:11211"
        run: |
          B="$GITHUB_WORKSPACE/.build/nginx-${NGINX_VERSION}/objs"
          MODULE="$B/ngx_http_cache_turbo_module.so" \
            bash ci/tools/soak.sh "$B/nginx" 600 4
      - name: Notify Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_BUILDS: ${{ secrets.DISCORD_CHANNEL_BUILDS }}
          # Passed as env, never interpolated into the run: block below.
          # A ${{ }} inside `run:` is pasted into the shell command by the
          # runner before bash sees it; via env: the value arrives as data.
          # These three are GitHub-controlled, so this is hardening, not a
          # live injection fix -- but it keeps the whole file free of the
          # pattern, so a future edit cannot quietly add an
          # attacker-controlled context beside a safe one.
          GH_REPO: ${{ github.repository }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          [ -n "$DISCORD_BOT_TOKEN" ] || exit 0
          curl -fsS -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_BUILDS/messages" \
            -d "{\"content\":\"🔴 $GH_REPO — CI Deep / memcheck FAILED. $GH_SERVER_URL/$GH_REPO/actions/runs/$GH_RUN_ID\"}" || true

  helgrind:
    name: Valgrind Helgrind soak
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 240
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache curl eatmydata libpcre2-dev libssl-dev mold pkg-config \
            redis-server memcached valgrind zlib1g-dev
      - name: Start L2 backends (redis, memcached)
        # See the memcheck job above: GitHub-hosted runner images ship a
        # policy-rc.d that blocks apt postinst's automatic service start, so
        # installing the packages does not put anything on 6379/11211.
        # Start both explicitly and wait for them to accept connections.
        run: |
          # The runner image MASKS both units (`Unit redis-server.service is
          # masked`), so `service ... start` cannot start them -- unmask and
          # enable first. This is a stronger block than policy-rc.d: masking
          # symlinks the unit to /dev/null, so nothing short of unmasking
          # brings it back. (The per-PR runtime job in build-test.yml sidesteps
          # this entirely by handing test_runtime.py --redis-server /usr/bin/...
          # so the harness spawns its OWN daemons; the soak wants the ordinary
          # system services, so it unmasks instead.)
          sudo systemctl unmask redis-server.service memcached.service || true
          sudo systemctl enable --now redis-server.service memcached.service || true
          sudo service redis-server start || true
          sudo service memcached start || true
          for _ in $(seq 1 50); do
            redis-cli -h 127.0.0.1 -p 6379 ping 2>/dev/null | grep -q PONG && break
            sleep 0.2
          done
          redis-cli -h 127.0.0.1 -p 6379 ping | grep -q PONG || {
            echo "::error::redis-server did not come up on 127.0.0.1:6379"; exit 1; }
          for _ in $(seq 1 50); do
            printf 'version\r\nquit\r\n' | timeout 2 nc 127.0.0.1 11211 2>/dev/null | grep -q VERSION && break
            sleep 0.2
          done
          printf 'version\r\nquit\r\n' | timeout 2 nc 127.0.0.1 11211 | grep -q VERSION || {
            echo "::error::memcached did not come up on 127.0.0.1:11211"; exit 1; }
      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          mode: debug
          nginx-version: ${{ env.NGINX_VERSION }}
      - name: Build debug nginx + cache-turbo module
        run: bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" debug
      - name: Helgrind soak (600s @ 4 conc, --error-exitcode=99, WITH suppressions, L1+L2)
        env:
          USE_HELGRIND: "1"
          # redis-server/memcached are explicitly started (and verified
          # ready) by the "Start L2 backends" step above. See the memcheck
          # job above: without these two env vars, soak.sh silently builds
          # the L1-only vhost and the L2 drivers never run under helgrind.
          REDIS: "127.0.0.1:6379"
          MEMCACHED: "127.0.0.1:11211"
        run: |
          B="$GITHUB_WORKSPACE/.build/nginx-${NGINX_VERSION}/objs"
          MODULE="$B/ngx_http_cache_turbo_module.so" \
            bash ci/tools/soak.sh "$B/nginx" 600 4
      - name: Notify Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_BUILDS: ${{ secrets.DISCORD_CHANNEL_BUILDS }}
          # Passed as env, never interpolated into the run: block below.
          # A ${{ }} inside `run:` is pasted into the shell command by the
          # runner before bash sees it; via env: the value arrives as data.
          # These three are GitHub-controlled, so this is hardening, not a
          # live injection fix -- but it keeps the whole file free of the
          # pattern, so a future edit cannot quietly add an
          # attacker-controlled context beside a safe one.
          GH_REPO: ${{ github.repository }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          [ -n "$DISCORD_BOT_TOKEN" ] || exit 0
          curl -fsS -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_BUILDS/messages" \
            -d "{\"content\":\"🔴 $GH_REPO — CI Deep / helgrind FAILED. $GH_SERVER_URL/$GH_REPO/actions/runs/$GH_RUN_ID\"}" || true

  asan-soak:
    # Flake-repetition soak. The per-PR asan.yml runs the fault-injection suite
    # ONCE; the intermittent shutdown "open socket left in connection" (#12,
    # fixed in #90) and the R6b single-process hang are both ~1-in-4 events, so a
    # single run usually misses them. This loops the SAME sanitized multi-worker
    # binary N times fail-fast (default 8 = the ">=8 clean is proof" bar from the
    # socket-flake hunt), giving the "free repetition" a per-PR run cannot. Kept
    # in ci-deep (monthly + dispatch), never on PR — it is a regression tripwire,
    # not a merge gate. Builds its own ASan binary (ci-deep jobs are
    # self-contained; no cross-workflow artifact reuse).
    name: ASan multi-worker soak (flake repetition)
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    # 180, not 60: one iteration of the fault-injection suite costs ~13 min
    # under ASan, so the default 8 iterations is ~104 min of soak plus ~6 min
    # of build -- the old 60 could not fit its OWN default and was cancelled
    # around iteration 4 every time it got far enough to try (run
    # 32841340162, cancelled at exactly 60m00s with every build step green).
    # Earlier runs failed on a test flake before reaching the wall, which hid
    # this; the 58-min "supersede" noted in the concurrency block above may be
    # the same defect misattributed. Sized at ~60% headroom over the measured
    # ~110 min, still below the 240 the two Valgrind soaks get for less work.
    timeout-minutes: 180
    # AUD-CIPORT1: own 64-wide port band, distinct from every other
    # runtime-bearing job on this shared runner. The nested per-iteration
    # sweep below shares this SAME band -- it is not a separate job. See
    # ci/tools/lint-ci-ports.sh (fails CI on a collision or a hardcoded sweep).
    env:
      TEST_BASE_PORT: 19136
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache curl eatmydata libpcre2-dev libssl-dev mold redis-server memcached zlib1g-dev

      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          mode: asan
          nginx-version: ${{ env.NGINX_VERSION }}

      - name: Build with sanitizers
        run: bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" asan

      - name: Sweep stale test listeners
        run: |
          # Kill leftovers from earlier crashed runs still holding test
          # ports in THIS job's own band. Must never widen back to the old
          # shared 18870-18999 -- that killed a SIBLING job's live fixtures
          # (AUD-CIPORT1).
          command -v fuser >/dev/null || sudo apt-get install -y psmisc
          for p in $(seq "$TEST_BASE_PORT" $((TEST_BASE_PORT + 63))); do
            fuser -k -TERM "${p}/tcp" 2>/dev/null || true
          done
          sleep 1

      - name: Verify ASan soak port band
        run: ci/tools/max-port.sh "$TEST_BASE_PORT"

      - name: Run multi-worker fault-injection suite N times (fail-fast)
        env:
          # detect_leaks=1 HERE, tracking asan.yml's CI-3 job, which runs the
          # SAME multi-worker topology (no --single-process). The nginx-core
          # false positive both hit -- ngx_event_process_init()'s three
          # never-freed per-process tables -- is exempted by POINTER in the
          # module's exit_process hook (LSAN-CORE-EVENT-TABLES,
          # src/ngx_http_cache_turbo_blob.c), which nginx also calls on the
          # worker exit path (ngx_worker_process_exit, ngx_process_cycle.c:947).
          #
          # The residual question -- whether a RETIRING worker (`-s reload`
          # generation handover) holds any OTHER unfreed core allocation -- was
          # measured on 2026-08-27 and answered NO: the full multi-worker
          # fault-injection suite runs clean under detect_leaks=1, and a
          # deliberately leaked malloc() in exit_process still turns the run RED.
          # Full rationale and the negative control live in asan.yml's CI-3
          # comment; this job intentionally carries the same setting.
          #
          # This soak runs the SAME suite N times, so it is the leg most likely
          # to surface a leak that only appears after repeated worker
          # generations -- which is precisely why it should not stay at 0.
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          # Instrumented latency is not a signal -- see asan.yml. An 8-iteration
          # soak multiplies the odds of a spurious per-request TimeoutError.
          TEST_CT_TIMEOUT: "30"
          SOAK_ITERATIONS: ${{ github.event.inputs.soak_iterations || 8 }}
        run: |
          B="$GITHUB_WORKSPACE/.build/nginx-${NGINX_VERSION}/objs/nginx"
          n="${SOAK_ITERATIONS}"
          echo "asan-soak: $n iterations of the multi-worker fault-injection suite"
          for i in $(seq 1 "$n"); do
            echo "=== asan-soak iteration $i/$n ==="
            # Sweep between iterations: a crashed run can leave a listener
            # held. Same band as the job's own pre-suite sweep above (not a
            # separate job, so it shares TEST_BASE_PORT -- AUD-CIPORT1).
            for p in $(seq "$TEST_BASE_PORT" $((TEST_BASE_PORT + 63))); do
              fuser -k -TERM "${p}/tcp" 2>/dev/null || true
            done
            python3 ci/tools/test_runtime.py \
              --fault-injection \
              --sanitizer \
              --port "$TEST_BASE_PORT" \
              --redis-server /usr/bin/redis-server \
              --memcached-server /usr/bin/memcached \
              --nginx-binary "$B"
          done
          echo "asan-soak: $n/$n iterations clean"

      - name: Notify Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_BUILDS: ${{ secrets.DISCORD_CHANNEL_BUILDS }}
          # Passed as env, never interpolated into the run: block below.
          # A ${{ }} inside `run:` is pasted into the shell command by the
          # runner before bash sees it; via env: the value arrives as data.
          # These three are GitHub-controlled, so this is hardening, not a
          # live injection fix -- but it keeps the whole file free of the
          # pattern, so a future edit cannot quietly add an
          # attacker-controlled context beside a safe one.
          GH_REPO: ${{ github.repository }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          [ -n "$DISCORD_BOT_TOKEN" ] || exit 0
          curl -fsS -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_BUILDS/messages" \
            -d "{\"content\":\"🔴 $GH_REPO — CI Deep / asan-soak FAILED. $GH_SERVER_URL/$GH_REPO/actions/runs/$GH_RUN_ID\"}" || true

  testkit-sanitizer:
    # The nginx-module-testkit prober leg, under ASan/UBSan -- deliberately
    # NOT in testkit.yml. The sanitized tree is a SECOND full cold nginx build
    # (ref probe + cache-turbo, configured with -DNGX_TEST_HARNESS), and
    # testkit.yml's own header sets the rule this job exists to honour: "if
    # the cold cost ever dominates a lane, demote it to ci-deep.yml rather
    # than weakening the oracle." A PR gate cannot absorb two cold nginx
    # builds; a monthly/dispatch lane can.
    #
    # Runs BOTH scenarios testkit-run.sh knows about for this module:
    #   consumer-cache-turbo    -- the per-request allocation-neutrality
    #                              oracle testkit.yml already runs unsanitized
    #   l2-cross-instance-fill  -- this repo's own L2 (Redis-backed)
    #                              cross-instance scenario. Its ./requires
    #                              gate SKIPs cleanly without redis-server on
    #                              PATH, so it is installed explicitly below
    #                              rather than relying on some other job's
    #                              dependency list.
    #   shm-coherence-varidx    -- the cross-process shm invariant lens
    #                              (`fanout`/`quiesce`/`zone_invariant`) against
    #                              this module's own shared counters. It is the
    #                              only automated guard on COR-5 (the
    #                              varidx_inflight strand, PR #443). Four
    #                              workers, and it needs redis-server AND
    #                              redis-cli -- the latter is its anti-vacuity
    #                              oracle, which reads the variant-index set's
    #                              cardinality straight out of Redis.
    #
    # detect_leaks stays OFF here, UNLIKE asan.yml/ci-deep.yml's own runtime
    # legs, which turned it on by scoping detect_leaks=0 to just their
    # short-lived `nginx -t` / `-s reload` subprocesses (see
    # ci/tools/test_runtime_base.py config_check_env()). That trick needs a
    # process-level distinction this leg cannot make: testkit's own
    # prober_heap_env (nginx-module-testkit ci/prober/lib.sh, NOT this repo)
    # exports ONE ASAN_OPTIONS for its whole run, and prober_boot then reuses
    # that SAME inherited environment for both its internal `nginx -t` and the
    # real server it backgrounds right after -- there is no per-invocation
    # hook this repo can drive without editing testkit itself, which is out of
    # scope here. So: nginx never frees its config pool, LSan would abort on
    # that internal `nginx -t` before a single oracle runs, and the fix lives
    # in testkit, not here (tracked as a testkit-side TODO, not this repo's to
    # implement). The LSan suppressions this repo tried, leak:ngx_create_pool
    # and leak:main, were DISPROVEN by negative control -- they hide real
    # module leaks. Do not set LSAN_OPTIONS here.
    name: Testkit prober (sanitized)
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    # AUD-CIPORT1/2: own 64-wide port band, distinct from every other
    # runtime-bearing job across every workflow (see ci/tools/lint-ci-ports.sh
    # § check 2). 19456 is testkit.yml's own band; the next band clear of
    # both the existing set and ci/t/core/breaker-retry-count.t's
    # 19420-19490 reservation is 19520.
    env:
      TEST_BASE_PORT: 19520
      NGINX_VERSION: "1.31.3"
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # Sibling repo, pinned -- same rationale and same pin as testkit.yml:
      # not vendored (t/module/config compiles by relative climb out of its
      # own tree) and not a submodule (this repo has no .gitmodules; adding
      # one for a single test leg changes clone semantics repo-wide).
      - name: Check out nginx-module-testkit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: myguard-labs/nginx-module-testkit
          ref: 27f724082e16f6d9bd8a2a0ee944ef9dd551ab7e
          path: .testkit
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # openssl + zlib headers are for the PROBER CLIENT (body_sha256
          # links OpenSSL, gunzip links zlib), not for this module. redis-server
          # is for l2-cross-instance-fill's ./requires gate -- without it the
          # scenario SKIPs cleanly, which is correct behaviour but zero
          # coverage of the L2 cross-instance path.
          # redis-tools carries redis-cli, which shm-coherence-varidx's
          # anti-vacuity leg uses as its oracle. On ubuntu-latest redis-server
          # already pulls it in, but naming it is what keeps the requirement
          # visible: without redis-cli that scenario SKIPs, and a SKIP here is
          # zero coverage of the only COR-5 guard there is.
          sudo apt-get install -y build-essential ccache curl eatmydata \
            libpcre2-dev libssl-dev redis-server redis-tools zlib1g-dev

      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          # Distinct namespace from testkit.yml's own "testkit" mode: this
          # tree is built under ci-build.sh's asan flags on top of the
          # ref-probe + cache-turbo dual-module configure, so it shares
          # neither the plain testkit tree nor the plain asan tree's cache.
          mode: testkit-asan
          nginx-version: ${{ env.NGINX_VERSION }}

      - name: Sweep stale test listeners
        run: |
          # This job's own band only -- widening it would kill a sibling
          # job's live fixtures on the shared runner (AUD-CIPORT1).
          command -v fuser >/dev/null || sudo apt-get install -y psmisc
          for p in $(seq "$TEST_BASE_PORT" $((TEST_BASE_PORT + 63))); do
            fuser -k -TERM "${p}/tcp" 2>/dev/null || true
          done
          sleep 1

      - name: Verify runtime port band
        run: ci/tools/max-port.sh "$TEST_BASE_PORT"

      - name: Stage cache-turbo + testkit ref probe under ASan/UBSan
        env:
          TESTKIT_ROOT: ${{ github.workspace }}/.testkit
        run: ci/tools/testkit-stage.sh --version "$NGINX_VERSION" --sanitizer

      - name: Report compiler-cache effectiveness
        run: ccache --show-stats

      - name: Prober scenarios on the sanitized tree
        env:
          TESTKIT_ROOT: ${{ github.workspace }}/.testkit
        run: |
          # rss-slope (S25) and reload-mid-upload (S25) are CT-authored ports
          # of testkit's generic scenarios of the same name, rebuilt against a
          # real cache_turbo HIT path rather than testkit's own `return 200`
          # -- see each scenario's own header comment for the non-vacuity
          # argument and the planted-mutation proof. Both belong HERE, not in
          # testkit.yml's PR gate, because both are loop/reload-shaped rather
          # than single-shot: rss-slope runs 70 sequential requests per
          # oracle (10 warmup + 60 sampled) and reload-mid-upload spans one
          # live SIGHUP -- the same PR-gate-cost reasoning that already keeps
          # l2-cross-instance-fill and shm-coherence-varidx's four-worker
          # Redis fixture out of testkit.yml.
          #
          # rss-slope uses cache_turbo_probe (like shm-coherence-varidx);
          # reload-mid-upload deliberately stays on the default test_ref_probe
          # (see its nginx.conf header) because cache_turbo_probe's zone
          # pointer used to be a process-lifetime static that could not
          # survive a SECOND config parse -- CTPROBE-STATIC-ZONE-NO-RELOAD,
          # memory/labs/nginx-cache-turbo-module/issues.md -- and
          # reload-mid-upload's one SIGHUP is exactly that second parse.
          #
          # reload-cycle (S26) is the fix for that finding, ported here for
          # the same reason as rss-slope/reload-mid-upload: it is an 8-SIGHUP
          # series, not single-shot. It is the first scenario to route
          # @PROBE@ at cache_turbo_probe ACROSS a reload -- see its own
          # header comment for the RED-before/GREEN-after proof against
          # CTPROBE-STATIC-ZONE-NO-RELOAD.
          ci/tools/testkit-run.sh --version "$NGINX_VERSION" --sanitizer \
            --port "$TEST_BASE_PORT" \
            -- consumer-cache-turbo l2-cross-instance-fill \
               shm-coherence-varidx rss-slope reload-mid-upload reload-cycle

      - name: Notify Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_BUILDS: ${{ secrets.DISCORD_CHANNEL_BUILDS }}
          GH_REPO: ${{ github.repository }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          [ -n "$DISCORD_BOT_TOKEN" ] || exit 0
          curl -fsS -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_BUILDS/messages" \
            -d "{\"content\":\"🔴 $GH_REPO — CI Deep / testkit-sanitizer FAILED. $GH_SERVER_URL/$GH_REPO/actions/runs/$GH_RUN_ID\"}" || true

  scanbench:
    name: Zipf hit-ratio benchmark
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install build and benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache curl eatmydata libpcre2-dev libssl-dev mold python3 zlib1g-dev

      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          mode: debug
          nginx-version: ${{ env.NGINX_VERSION }}

      - name: Build server and module
        run: |
          bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" debug
          BUILD_DIR="$GITHUB_WORKSPACE/.build/nginx-${NGINX_VERSION}/objs"
          echo "NGINX_BINARY=$BUILD_DIR/nginx" >> "$GITHUB_ENV"
          echo "MODULE_SO=$BUILD_DIR/ngx_http_cache_turbo_module.so" >> "$GITHUB_ENV"

      - name: Run Zipf hit-ratio benchmark
        run: |
          echo "=== Zipf hit-ratio benchmark ==="
          bash ci/tools/zipfbench.sh "$NGINX_BINARY" "$MODULE_SO"
          echo ""
          echo "Benchmark complete; hit-ratio recorded above."

      - name: Notify Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_BUILDS: ${{ secrets.DISCORD_CHANNEL_BUILDS }}
          GH_REPO: ${{ github.repository }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          [ -n "$DISCORD_BOT_TOKEN" ] || exit 0
          curl -fsS -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_BUILDS/messages" \
            -d "{\"content\":\"🔴 $GH_REPO — CI Deep / scanbench FAILED. $GH_SERVER_URL/$GH_REPO/actions/runs/$GH_RUN_ID\"}" || true

  scanners:
    name: Security scanners
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0  # gitleaks scans git history

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache curl eatmydata flawfinder clang-tidy \
            libpcre2-dev libssl-dev mold python3 python3-pip pipx zlib1g-dev
          # semgrep: isolate via pipx (PEP 668 blocks a bare pip3 install into the
          # system Python on the Ubuntu 24.04 self-hosted runner). Fall back to a
          # user pip install with --break-system-packages if pipx is unavailable.
          if command -v pipx >/dev/null; then
            pipx install --quiet semgrep
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            pip3 install --quiet --user --break-system-packages semgrep
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: gitleaks (full history scan)
        run: |
          set -euo pipefail
          # Mirrors the identical step in security-scanners.yml -- the two
          # scanners jobs are kept equal on purpose. fetch-depth: 0 above is
          # load-bearing for this step: a shallow clone scans one commit.
          version=8.30.1
          archive="/tmp/gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          bash ci/tools/verify-download.sh "$archive"
          tar -xzf "$archive" -C /tmp gitleaks
          /tmp/gitleaks git --no-banner .
      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          mode: module
          nginx-version: ${{ env.NGINX_VERSION }}
      - name: Configure nginx src tree (clang-tidy headers)
        run: |
          set -euo pipefail
          bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" module
          echo "NGINX_SRC_TREE=$GITHUB_WORKSPACE/.build/nginx-${NGINX_VERSION}" \
            >> "$GITHUB_ENV"
      - name: flawfinder (gate on >=4)
        run: |
          set -euo pipefail
          # minlevel=3: level 1-2 is dominated by token-matches on the struct
          # field op->recv (not the recv(2) syscall) and on FF1029 sites that
          # contain no loop. 34 such alerts were dismissed as false positives.
          #
          # REPORT at 3, GATE at 4 -- see the identical step in
          # security-scanners.yml for why (pre-commit gated stricter than CI
          # before this gate). Keep the two files equal.
          #
          # pipefail is load-bearing: without it `tee` supplies the exit status
          # and the gate silently passes on every finding.
          flawfinder --minlevel=3 --error-level=4 \
            "$GITHUB_WORKSPACE"/src/*.c 2>&1 | tee flawfinder.log
      - name: clang-tidy (cert-*, security.*)
        run: |
          set -euo pipefail
          N="$NGINX_SRC_TREE"
          INCLUDES="-I$N/src/core -I$N/src/event -I$N/src/event/modules -I$N/src/event/quic \
            -I$N/src/os/unix -I$N/objs -I$N/src/http -I$N/src/http/modules -I$N/src/http/v2 -I/usr/include"
          status=0
          for f in "$GITHUB_WORKSPACE"/src/*.c; do
            # shellcheck disable=SC2086
            clang-tidy "$f" \
              --checks='-*,cert-*,clang-analyzer-security.*,-clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling' \
              --warnings-as-errors='*' \
              -- $INCLUDES 2>&1 | tee -a clang-tidy.log || status=1
          done
          exit "$status"
      - name: semgrep (gate on >=WARNING)
        run: |
          set -euo pipefail
          # GATED -- see the identical step in
          # security-scanners.yml for the full reasoning.
          #
          # -j 1 IS LOAD-BEARING: parallel semgrep-core shards exhaust
          # RLIMIT_MEMLOCK on io_uring init and die with EXIT CODE 0, i.e. a
          # crashed scanner that reads as a clean scan. Do not drop it.
          semgrep scan -j 1 --config p/c --config p/security-audit \
            --severity=WARNING --severity=ERROR --error \
            "$GITHUB_WORKSPACE/src/" 2>&1 | tee semgrep.log
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: security-reports
          path: |
            ${{ github.workspace }}/flawfinder.log
            ${{ github.workspace }}/clang-tidy.log
            ${{ github.workspace }}/semgrep.log
          retention-days: 14

  coverage:
    # gcov line+branch coverage of the module's own sources.
    #
    # ci/tools/coverage.sh has existed since the coverage work landed but NO
    # workflow ever invoked it, so the repo had a coverage tool and zero
    # coverage visibility — a report nobody ran. This job is what runs it.
    #
    # Deliberately a REPORT, not a gate: COVERAGE_FAIL_UNDER is left unset, per
    # the repo policy of meaningful tests over a percentage threshold (see
    # feedback-coverage-badge-vs-test-integrity — a % gate invites tests written
    # to move the number rather than to catch bugs). The artifact is what the
    # next session reads to pick the NEXT uncovered path worth a real test.
    #
    # Lives in ci-deep (schedule + dispatch) rather than on the PR gate because
    # it is a full instrumented build plus the complete runtime suite (redis +
    # memcached + fault injection) at -O0 — far too slow for the per-PR path,
    # and its output is a trend to read, not a green/red signal to block on.
    name: Coverage (gcov report)
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    # AUD-CIPORT1: own 64-wide port band, distinct from every other
    # runtime-bearing job on this shared runner -- this job DOES run the full
    # runtime suite (via ci/tools/coverage.sh), so it needs one like the
    # others. See ci/tools/lint-ci-ports.sh (fails CI on a collision or a
    # hardcoded sweep).
    env:
      TEST_BASE_PORT: 19200
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          # dwarves provides pahole, which ci/tests/unit/extract_shm.sh needs
          # to measure ngx_http_cache_turbo_node_t's size (P2-3 slab-class
          # assertion). Without it the check has nothing to skip TO but a
          # silent pass -- so it is a required dependency, not optional.
          sudo apt-get install -y build-essential ccache curl dwarves eatmydata \
            libpcre2-dev libssl-dev mold python3-venv redis-server memcached zlib1g-dev
          # Ubuntu's gcovr 6 parser rejects GCC 14's `10000-block` records.
          # Keep the report reproducible and new enough to read the compiler's
          # gcov output instead of relying on the runner image's apt version.
          python3 -m venv "$RUNNER_TEMP/gcovr"
          "$RUNNER_TEMP/gcovr/bin/pip" install --disable-pip-version-check gcovr==7.2
          echo "$RUNNER_TEMP/gcovr/bin" >> "$GITHUB_PATH"

      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          mode: coverage
          nginx-version: ${{ env.NGINX_VERSION }}

      - name: Sweep stale test listeners
        run: |
          # Kill leftovers from earlier crashed runs still holding test
          # ports in THIS job's own band. Must never widen back to the old
          # shared 18870-18999 -- that killed a SIBLING job's live fixtures
          # (AUD-CIPORT1).
          command -v fuser >/dev/null || sudo apt-get install -y psmisc
          for p in $(seq "$TEST_BASE_PORT" $((TEST_BASE_PORT + 63))); do
            fuser -k -TERM "${p}/tcp" 2>/dev/null || true
          done
          sleep 1

      - name: Verify coverage port band
        run: ci/tools/max-port.sh "$TEST_BASE_PORT"

      - name: Build instrumented, run suite, report
        # coverage.sh drives all three steps (ci-build.sh coverage -> runtime
        # suite -> gcovr). The instrumented build is -O0 and the suite seeds
        # real bodies, so the per-test timeout needs the same headroom the
        # script's own default gives it. TEST_BASE_PORT (job env, above) is
        # read by coverage.sh itself (AUD-CIPORT1).
        env:
          TEST_NGINX_TIMEOUT: "30"
        run: bash ci/tools/coverage.sh nginx "$NGINX_VERSION"

      - name: Coverage summary to job log
        if: always()
        run: |
          # The percentages in the step log make the trend readable without
          # downloading the artifact.
          if [ -f coverage-report/coverage.txt ]; then
            {
              echo '### Module coverage'
              echo '```'
              tail -n 20 coverage-report/coverage.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f coverage-report/unit/coverage.txt ]; then
            {
              echo '### swr/autotune unit coverage'
              echo '```'
              tail -n 20 coverage-report/unit/coverage.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-report
          path: ${{ github.workspace }}/coverage-report
          retention-days: 14

      - name: Notify Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_BUILDS: ${{ secrets.DISCORD_CHANNEL_BUILDS }}
          # Passed as env, never interpolated into the run: block below.
          # A ${{ }} inside `run:` is pasted into the shell command by the
          # runner before bash sees it; via env: the value arrives as data.
          # These three are GitHub-controlled, so this is hardening, not a
          # live injection fix -- but it keeps the whole file free of the
          # pattern, so a future edit cannot quietly add an
          # attacker-controlled context beside a safe one.
          GH_REPO: ${{ github.repository }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          [ -n "$DISCORD_BOT_TOKEN" ] || exit 0
          curl -fsS -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_BUILDS/messages" \
            -d "{\"content\":\"🔴 $GH_REPO — CI Deep / coverage FAILED. $GH_SERVER_URL/$GH_REPO/actions/runs/$GH_RUN_ID\"}" || true
