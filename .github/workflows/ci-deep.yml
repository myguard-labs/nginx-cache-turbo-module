          # anti-vacuity leg uses as its oracle. On ubuntu-latest redis-server
          # already pulls it in, but naming it is what keeps the requirement
          # visible: without redis-cli that scenario SKIPs, and a SKIP here is
          # zero coverage of the only COR-5 guard there is.
          sudo apt-get install -y build-essential ccache curl eatmydata \
            libpcre2-dev libssl-dev redis-server redis-tools zlib1g-dev

        id: testkit_sanitizer_02
        env:
          NGINX_VERSION: "1.31.3"
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/testkit-sanitizer
        continue-on-error: true
        if: always() && steps.testkit_sanitizer_01.outcome == 'success'
      - name: testkit-sanitizer / Restore build caches
        uses: ./.github/actions/build-cache  # zizmor: ignore[self-repository] -- $/ not yet accepted by actionlint
        with:
          # Distinct namespace from testkit.yml's own "testkit" mode: this
          # tree is built under ci-build.sh's asan flags on top of the
          # ref-probe + cache-turbo dual-module configure, so it shares
          # neither the plain testkit tree nor the plain asan tree's cache.
          mode: testkit-asan
          nginx-version: ${{ env.NGINX_VERSION }}

        id: testkit_sanitizer_03
        env:
          NGINX_VERSION: "1.31.3"
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/testkit-sanitizer
        continue-on-error: true
        if: always() && steps.testkit_sanitizer_02.outcome == 'success'
      - name: testkit-sanitizer / Isolate build outputs
        id: testkit_sanitizer_isolate
        if: always() && steps.testkit_sanitizer_03.outcome == 'success'
        continue-on-error: true
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/testkit-sanitizer
          ARCHIVE_FLAVOR: nginx
          ARCHIVE_VERSION: ${{ env.NGINX_VERSION }}
        run: |
          mkdir -p "$BUILD_ROOT" "$GITHUB_WORKSPACE/.build"
          archive="$ARCHIVE_FLAVOR-$ARCHIVE_VERSION.tar.gz"
          ln -s "$GITHUB_WORKSPACE/.build/$archive" "$BUILD_ROOT/$archive"
      - name: testkit-sanitizer / Sweep stale test listeners
        run: |
          # This job's own band only -- widening it would kill a sibling
          # job's live fixtures on the shared runner (AUD-CIPORT1).
          command -v fuser >/dev/null || sudo apt-get install -y psmisc
          for p in $(seq "$TEST_BASE_PORT" $((TEST_BASE_PORT + 63))); do
            fuser -k -TERM "${p}/tcp" 2>/dev/null || true
          done
          sleep 1

        id: testkit_sanitizer_04
        env:
          NGINX_VERSION: "1.31.3"
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/testkit-sanitizer
        continue-on-error: true
        if: always() && steps.testkit_sanitizer_isolate.outcome == 'success'
      - name: testkit-sanitizer / Verify runtime port band
        run: ci/tools/max-port.sh "$TEST_BASE_PORT"

        id: testkit_sanitizer_05
        env:
          NGINX_VERSION: "1.31.3"
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/testkit-sanitizer
        continue-on-error: true
        if: always() && steps.testkit_sanitizer_04.outcome == 'success'
      - name: testkit-sanitizer / Stage cache-turbo + testkit ref probe under ASan/UBSan
        env:
          NGINX_VERSION: "1.31.3"
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/testkit-sanitizer
          TESTKIT_ROOT: ${{ github.workspace }}/.testkit-testkit-sanitizer
        run: ci/tools/testkit-stage.sh --version "$NGINX_VERSION" --sanitizer

        id: testkit_sanitizer_06
        continue-on-error: true
        if: always() && steps.testkit_sanitizer_05.outcome == 'success'
      - name: testkit-sanitizer / Report compiler-cache effectiveness
        run: ccache --show-stats

        id: testkit_sanitizer_07
        env:
          NGINX_VERSION: "1.31.3"
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/testkit-sanitizer
        continue-on-error: true
        if: always() && steps.testkit_sanitizer_06.outcome == 'success'
      - name: testkit-sanitizer / Prober scenarios on the sanitized tree
        env:
          NGINX_VERSION: "1.31.3"
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/testkit-sanitizer
          TESTKIT_ROOT: ${{ github.workspace }}/.testkit-testkit-sanitizer
        run: |
          # rss-slope (S25) and reload-mid-upload (S25) are CT-authored ports
          # of testkit's generic scenarios of the same name, rebuilt against a
          # real cache_turbo HIT path rather than testkit's own `return 200`
          # -- see each scenario's own header comment for the non-vacuity
          # argument and the planted-mutation proof. Both belong HERE, not in
          # testkit.yml's PR gate, because both are loop/reload-shaped rather
          # than single-shot: rss-slope runs 70 sequential requests per
          # oracle (10 warmup + 60 sampled) and reload-mid-upload spans one
          # live SIGHUP -- the same PR-gate-cost reasoning that already keeps
          # l2-cross-instance-fill and shm-coherence-varidx's four-worker
          # Redis fixture out of testkit.yml.
          #
          # rss-slope uses cache_turbo_probe (like shm-coherence-varidx);
          # reload-mid-upload deliberately stays on the default test_ref_probe
          # (see its nginx.conf header) because cache_turbo_probe's zone
          # pointer used to be a process-lifetime static that could not
          # survive a SECOND config parse -- CTPROBE-STATIC-ZONE-NO-RELOAD,
          # memory/labs/nginx-cache-turbo-module/issues.md -- and
          # reload-mid-upload's one SIGHUP is exactly that second parse.
          #
          # reload-cycle (S26) is the fix for that finding, ported here for
          # the same reason as rss-slope/reload-mid-upload: it is an 8-SIGHUP
          # series, not single-shot. It is the first scenario to route
          # @PROBE@ at cache_turbo_probe ACROSS a reload -- see its own
          # header comment for the RED-before/GREEN-after proof against
          # CTPROBE-STATIC-ZONE-NO-RELOAD.
          source ci/tools/testkit-scenarios.sh
          ci/tools/testkit-run.sh --version "$NGINX_VERSION" --sanitizer \
            --port "$TEST_BASE_PORT" \
            -- "${TESTKIT_SCENARIOS_SANITIZED[@]}"

        id: testkit_sanitizer_08
        continue-on-error: true
        if: always() && steps.testkit_sanitizer_06.outcome == 'success'
      - name: testkit-angie / Reset previous check environment
        id: testkit_angie_reset
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/testkit-angie
        run: |
          # Former jobs did not inherit another check group's exported paths.
          for key in MATRIX_VERSION TEST_NGINX_BINARY TEST_NGINX_LOAD_MODULES NGINX_BINARY MODULE_SO NGINX_SRC_TREE; do
            printf '%s=\n' "$key" >> "$GITHUB_ENV"
          done
      - name: testkit-angie / Check out nginx-module-testkit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: myguard-labs/nginx-module-testkit
          ref: 27f724082e16f6d9bd8a2a0ee944ef9dd551ab7e
          path: .testkit-testkit-angie
          persist-credentials: false

        id: testkit_angie_01
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/testkit-angie
        continue-on-error: true
        if: always() && steps.testkit_angie_reset.outcome == 'success'
      - name: testkit-angie / Load version pins
        run: bash .github/scripts/load-versions.sh

        id: testkit_angie_02
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/testkit-angie
        continue-on-error: true
        if: always() && steps.testkit_angie_01.outcome == 'success'
      - name: testkit-angie / Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache curl eatmydata \
            libpcre2-dev libssl-dev zlib1g-dev

        id: testkit_angie_03
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/testkit-angie
        continue-on-error: true
        if: always() && steps.testkit_angie_02.outcome == 'success'
      - name: testkit-angie / Restore build caches
        uses: ./.github/actions/build-cache  # zizmor: ignore[self-repository] -- $/ not yet accepted by actionlint
        with:
          mode: testkit-angie
          flavor: angie
          nginx-version: ${{ env.ANGIE_VERSION }}

        id: testkit_angie_04
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/testkit-angie
        continue-on-error: true
        if: always() && steps.testkit_angie_03.outcome == 'success'
      - name: testkit-angie / Isolate build outputs
        id: testkit_angie_isolate
        if: always() && steps.testkit_angie_04.outcome == 'success'
        continue-on-error: true
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/testkit-angie
          ARCHIVE_FLAVOR: angie
          ARCHIVE_VERSION: ${{ env.ANGIE_VERSION }}
        run: |
          mkdir -p "$BUILD_ROOT" "$GITHUB_WORKSPACE/.build"
          archive="$ARCHIVE_FLAVOR-$ARCHIVE_VERSION.tar.gz"
          ln -s "$GITHUB_WORKSPACE/.build/$archive" "$BUILD_ROOT/$archive"
      - name: testkit-angie / Sweep stale test listeners
        run: |
          command -v fuser >/dev/null || sudo apt-get install -y psmisc
          for p in $(seq "$TEST_BASE_PORT" $((TEST_BASE_PORT + 63))); do
            fuser -k -TERM "${p}/tcp" 2>/dev/null || true
          done
          sleep 1

        id: testkit_angie_05
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/testkit-angie
        continue-on-error: true
        if: always() && steps.testkit_angie_isolate.outcome == 'success'
      - name: testkit-angie / Verify runtime port band
        run: ci/tools/max-port.sh "$TEST_BASE_PORT"

        id: testkit_angie_06
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/testkit-angie
        continue-on-error: true
        if: always() && steps.testkit_angie_05.outcome == 'success'
      - name: testkit-angie / Stage cache-turbo + testkit ref probe for Angie
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/testkit-angie
          TESTKIT_ROOT: ${{ github.workspace }}/.testkit-testkit-angie
        run: >-
          ci/tools/testkit-stage.sh --flavor angie --version "$ANGIE_VERSION"

        id: testkit_angie_07
        continue-on-error: true
        if: always() && steps.testkit_angie_06.outcome == 'success'
      - name: testkit-angie / Report compiler-cache effectiveness
        run: ccache --show-stats

        id: testkit_angie_08
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/testkit-angie
        continue-on-error: true
        if: always() && steps.testkit_angie_07.outcome == 'success'
      - name: testkit-angie / Representative scenario asserts on Angie
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/testkit-angie
          TESTKIT_ROOT: ${{ github.workspace }}/.testkit-testkit-angie
        run: |
          source ci/tools/testkit-scenarios.sh
          ci/tools/testkit-run.sh --flavor angie --version "$ANGIE_VERSION" \
            --port "$TEST_BASE_PORT" -- "${TESTKIT_SCENARIOS_ANGIE[@]}"

        id: testkit_angie_09
        continue-on-error: true
        if: always() && steps.testkit_angie_07.outcome == 'success'
      - name: testkit-angie / Representative scenario SKIPs on an unstaged Angie tree
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/testkit-angie
          TESTKIT_ROOT: ${{ github.workspace }}/.testkit-testkit-angie
        run: |
          source ci/tools/testkit-scenarios.sh
          ci/tools/testkit-run.sh --flavor angie --expect-skip \
            --version "${ANGIE_VERSION}-unstaged" \
            --port "$TEST_BASE_PORT" -- "${TESTKIT_SCENARIOS_ANGIE[@]}"

        id: testkit_angie_10
        continue-on-error: true
        if: always() && steps.testkit_angie_07.outcome == 'success'
      - name: scanners / Reset previous check environment
        id: scanners_reset
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/scanners
        run: |
          # Former jobs did not inherit another check group's exported paths.
          for key in MATRIX_VERSION TEST_NGINX_BINARY TEST_NGINX_LOAD_MODULES NGINX_BINARY MODULE_SO NGINX_SRC_TREE; do
            printf '%s=\n' "$key" >> "$GITHUB_ENV"
          done
      - name: scanners / Load version pins
        run: bash .github/scripts/load-versions.sh

        id: scanners_01
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/scanners
        continue-on-error: true
        if: always() && steps.scanners_reset.outcome == 'success'
      - name: scanners / Private cache and tool directories
        run: |
          set -euo pipefail
          # Keep every cache and user-tool path under this job's own temp dir:
          # a shared runner's home directory can be read-only or shared.
          base="$RUNNER_TEMP/ci-cache"
          mkdir -p "$base/ccache" "$base/xdg" "$base/pyuser" "$base/pip" "$base/pipx" "$base/pipx-bin"
          {
            echo "CCACHE_DIR=$base/ccache"
            echo "XDG_CACHE_HOME=$base/xdg"
            echo "PYTHONUSERBASE=$base/pyuser"
            echo "PIP_CACHE_DIR=$base/pip"
            echo "PIPX_HOME=$base/pipx"
            echo "PIPX_MAN_DIR=$base/pipx-man"
            echo "PIPX_BIN_DIR=$base/pipx-bin"
          } >> "$GITHUB_ENV"

        id: scanners_02
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/scanners
        continue-on-error: true
        if: always() && steps.scanners_01.outcome == 'success'
      - name: scanners / Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache curl eatmydata flawfinder clang-tidy \
            libpcre2-dev libssl-dev mold python3 python3-pip pipx zlib1g-dev
          # semgrep: isolate via pipx (PEP 668 blocks a bare pip3 install into the
          # system Python on the Ubuntu 24.04 self-hosted runner). Fall back to a
          # user pip install with --break-system-packages if pipx is unavailable.
          if command -v pipx >/dev/null; then
            pipx install --quiet 'semgrep==1.169.0'
            echo "$PIPX_BIN_DIR" >> "$GITHUB_PATH"
            export PATH="$PIPX_BIN_DIR:$PATH"
          else
            pip3 install --quiet --user --break-system-packages 'semgrep==1.169.0'
            echo "$PYTHONUSERBASE/bin" >> "$GITHUB_PATH"
            export PATH="$PYTHONUSERBASE/bin:$PATH"
          fi
          test "$(semgrep --version)" = 1.169.0
        id: scanners_03
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/scanners
        continue-on-error: true
        if: always() && steps.scanners_02.outcome == 'success'
      - name: scanners / gitleaks (full history scan)
        run: |
          set -euo pipefail
          # Mirrors the identical step in security-scanners.yml -- the two
          # scanners jobs are kept equal on purpose. fetch-depth: 0 above is
          # load-bearing for this step: a shallow clone scans one commit.
          version=8.30.1
          archive="/tmp/gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          bash ci/tools/verify-download.sh "$archive"
          tar -xzf "$archive" -C /tmp gitleaks
          /tmp/gitleaks git --no-banner .
        id: scanners_04
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/scanners
        continue-on-error: true
        if: always() && steps.scanners_03.outcome == 'success'
      - name: scanners / Restore build caches
        uses: ./.github/actions/build-cache  # zizmor: ignore[self-repository] -- $/ not yet accepted by actionlint
        with:
          mode: module
          nginx-version: ${{ env.NGINX_VERSION }}
        id: scanners_05
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/scanners
        continue-on-error: true
        if: always() && steps.scanners_03.outcome == 'success'
      - name: scanners / Isolate build outputs
        id: scanners_isolate
        if: always() && steps.scanners_05.outcome == 'success'
        continue-on-error: true
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/scanners
          ARCHIVE_FLAVOR: nginx
          ARCHIVE_VERSION: ${{ env.NGINX_VERSION }}
        run: |
          mkdir -p "$BUILD_ROOT" "$GITHUB_WORKSPACE/.build"
          archive="$ARCHIVE_FLAVOR-$ARCHIVE_VERSION.tar.gz"
          ln -s "$GITHUB_WORKSPACE/.build/$archive" "$BUILD_ROOT/$archive"
      - name: scanners / Configure nginx src tree (clang-tidy headers)
        run: |
          set -euo pipefail
          bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" module
          echo "NGINX_SRC_TREE=${BUILD_ROOT}/nginx-${NGINX_VERSION}" \
            >> "$GITHUB_ENV"
        id: scanners_06
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/scanners
        continue-on-error: true
        if: always() && steps.scanners_isolate.outcome == 'success'
      - name: scanners / flawfinder (gate on >=4)
        run: |
          set -euo pipefail
          # minlevel=3: level 1-2 is dominated by token-matches on the struct
          # field op->recv (not the recv(2) syscall) and on FF1029 sites that
          # contain no loop. 34 such alerts were dismissed as false positives.
          #
          # REPORT at 3, GATE at 4 -- see the identical step in
          # security-scanners.yml for why (pre-commit gated stricter than CI
          # before this gate). Keep the two files equal.
          #
          # pipefail is load-bearing: without it `tee` supplies the exit status
          # and the gate silently passes on every finding.
          flawfinder --minlevel=3 --error-level=4 \
            "$GITHUB_WORKSPACE"/src/*.c 2>&1 | tee flawfinder.log
        id: scanners_07
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/scanners
        continue-on-error: true
        if: always() && steps.scanners_03.outcome == 'success'
      - name: scanners / clang-tidy (cert-*, security.*)
        run: |
          set -euo pipefail
          N="$NGINX_SRC_TREE"
          INCLUDES="-I$N/src/core -I$N/src/event -I$N/src/event/modules -I$N/src/event/quic \
            -I$N/src/os/unix -I$N/objs -I$N/src/http -I$N/src/http/modules -I$N/src/http/v2 -I/usr/include"
          status=0
          for f in "$GITHUB_WORKSPACE"/src/*.c; do
            # shellcheck disable=SC2086
            clang-tidy "$f" \
              --checks='-*,cert-*,clang-analyzer-security.*,-clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling' \
              --warnings-as-errors='*' \
              -- $INCLUDES 2>&1 | tee -a clang-tidy.log || status=1
          done
          exit "$status"
        id: scanners_08
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/scanners
        continue-on-error: true
        if: always() && steps.scanners_06.outcome == 'success'
      - name: scanners / semgrep (gate on >=WARNING)
        run: |
          set -euo pipefail
          # GATED -- see the identical step in
          # security-scanners.yml for the full reasoning.
          #
          # -j 1 IS LOAD-BEARING: parallel semgrep-core shards exhaust
          # RLIMIT_MEMLOCK on io_uring init and die with EXIT CODE 0, i.e. a
          # crashed scanner that reads as a clean scan. Do not drop it.
          ci/linter/run-semgrep.sh "$GITHUB_WORKSPACE/src/" 2>&1 | tee semgrep.log
        id: scanners_09
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/scanners
        continue-on-error: true
        if: always() && steps.scanners_03.outcome == 'success'
      - name: scanners / Upload reports
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports
          path: |
            ${{ github.workspace }}/flawfinder.log
            ${{ github.workspace }}/clang-tidy.log
            ${{ github.workspace }}/semgrep.log
          retention-days: 14

        id: scanners_10
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/scanners
        continue-on-error: true
      - name: Lane verdict
        id: verdict
        if: always()
        env:
          LANE_NAME: D-compat
          LANE_STEPS: ${{ toJSON(steps) }}
          LANE_REQUIRED: >-
            checkout compat_mainline_reset compat_mainline_01 compat_mainline_02 compat_mainline_03 compat_mainline_04 compat_mainline_isolate
            compat_mainline_05 compat_mainline_06 compat_mainline_07 compat_stable_reset compat_stable_01 compat_stable_02
            compat_stable_03 compat_stable_04 compat_stable_isolate compat_stable_05 compat_stable_06 compat_stable_07 compat_angie_reset
            compat_angie_01 compat_angie_02 compat_angie_03 compat_angie_04 compat_angie_isolate compat_angie_05 compat_angie_06
            compat_angie_07 legacy_runtime_reset legacy_runtime_01 legacy_runtime_02 legacy_runtime_03 legacy_runtime_isolate
            legacy_runtime_04 legacy_runtime_05 legacy_runtime_06 legacy_runtime_07 memcheck_reset memcheck_01 memcheck_02
            memcheck_03 memcheck_04 memcheck_isolate memcheck_05 memcheck_06 testkit_sanitizer_reset testkit_sanitizer_01
            testkit_sanitizer_02 testkit_sanitizer_03 testkit_sanitizer_isolate testkit_sanitizer_04 testkit_sanitizer_05
            testkit_sanitizer_06 testkit_sanitizer_07 testkit_sanitizer_08 testkit_angie_reset testkit_angie_01 testkit_angie_02
            testkit_angie_03 testkit_angie_04 testkit_angie_isolate testkit_angie_05 testkit_angie_06 testkit_angie_07 testkit_angie_08
            testkit_angie_09 testkit_angie_10 scanners_reset scanners_01 scanners_02 scanners_03 scanners_04 scanners_05 scanners_isolate
            scanners_06 scanners_07 scanners_08 scanners_09 scanners_10
          LANE_OPTIONAL: ''
        shell: python3 {0}
        run: |
          import json
          import os
          import sys

          steps = json.loads(os.environ["LANE_STEPS"])
          required = os.environ["LANE_REQUIRED"].split()
          optional = os.environ["LANE_OPTIONAL"].split()
          failed = []
          for check in required + optional:
              outcome = steps.get(check, {}).get("outcome", "missing")
              if outcome != "success" and not (check in optional and outcome == "skipped"):
                  failed.append(f"{check} ({outcome})")
          summary = ", ".join(failed)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"failed={summary}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("### " + os.environ["LANE_NAME"] + "\n")
              for check in required + optional:
                  output.write(f"- {check}: {steps.get(check, {}).get('outcome', 'missing')}\n")
          if failed:
              print("::error::Required checks failed or could not run: " + summary)
          sys.exit(bool(failed))
      - name: Notify Discord on lane failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_BUILDS: ${{ secrets.DISCORD_CHANNEL_BUILDS }}
          GH_REPO: ${{ github.repository }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_RUN_ID: ${{ github.run_id }}
          LANE_NAME: D-compat
          FAILED_CHECKS: ${{ steps.verdict.outputs.failed || 'lane setup or verdict unavailable' }}
        run: |
          [ -n "$DISCORD_BOT_TOKEN" ] || exit 0
          payload="$(python3 - <<'PYTHON'
          import json
          import os
          prefix = f"{os.environ['GH_REPO']} — CI Deep / {os.environ['LANE_NAME']} FAILED: "
          link = f" {os.environ['GH_SERVER_URL']}/{os.environ['GH_REPO']}/actions/runs/{os.environ['GH_RUN_ID']}"
          checks = os.environ['FAILED_CHECKS'].split(', ')
          # Put actual failures before prerequisite skips; the full list is in the run summary.
          checks.sort(key=lambda check: '(skipped)' in check)
          # Discord Create Message caps content at 2000 characters:
          # https://docs.discord.com/developers/resources/message#create-message
          for count in range(len(checks), -1, -1):
              omitted = len(checks) - count
              suffix = f"; {omitted} more checks in run summary" if omitted else ""
              content = prefix + ', '.join(checks[:count]) + suffix + '.' + link
              if len(content) <= 2000:
                  break
          else:
              raise ValueError('Lane name and run URL exceed Discord content limit')
          print(json.dumps({"content": content}))
