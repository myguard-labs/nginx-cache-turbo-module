              content = prefix + ', '.join(checks[:count]) + suffix + '.' + link
              if len(content) <= 2000:
                  break
          else:
              raise ValueError('Lane name and run URL exceed Discord content limit')
          print(json.dumps({"content": content}))
          PYTHON
          )"
          curl -fsS -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_BUILDS/messages" \
