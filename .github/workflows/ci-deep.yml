      - name: memcheck / Start L2 backends (redis, memcached)
        # apt's postinst calls deb-systemd-invoke/invoke-rc.d to start the
        # service, but GitHub-hosted runner images ship a policy-rc.d that
        # blocks automatic service starts on package install (it exists to
        # stop random daemons from booting on a build image) -- so the
        # packages land in /usr/bin with nothing listening on 6379/11211.
        # `apt-get install` succeeding is not evidence either port is up;
        # start both explicitly and wait for them to accept connections
        # before the soak below ever generates L2 traffic against them.
