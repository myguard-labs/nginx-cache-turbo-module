# sync-sha: 3b127a5b87de0b992517147efa112dacaf5ddd570b4a9ddbd9b4dfcb6338ba5b
name: CI Deep

# Exhaustive dynamic analysis — monthly cron + on-demand only, NEVER on PR.
# Fast PR gates live in static.yml (fuzz regression and scanners),
# and valgrind.yml (memcheck lite);
# THIS file keeps the long/exhaustive runs. CodeQL remains in codeql.yml; this
# workflow complements it with long dynamic-analysis and scanner jobs.
#
# Lanes: D-soak (8 ASan repetitions), D-fuzz-a (3 targets + coverage),
# D-fuzz-b (2 targets + scanbench + analyzer), D-compat (all compatibility,
# Valgrind, testkit and full scanners). Long fuzz inputs retain their budget.
# Structural regroup only: the <=125m measured wall target remains open.
#   * memcheck runs under ci/tools/soak.sh, which passes
#     --suppressions=ci/tools/valgrind.supp and --error-exitcode=99 — the
#     drift-fix baseline for every module.
#   * cache-turbo is a memory-heavy module (shm slab + LRU + SWR + L2 clients),
#     so the soak runs 600s (longer than the 300s baseline) to churn eviction.
#
# Retired: the Helgrind soak (S22). All shared state in this module is
# cross-PROCESS POSIX shm under ngx_shmtx (atomic-CAS based), never a
# pthread_mutex, and there are zero threads in src/ — Helgrind's
# happens-before engine is built on pthread sync primitives within one
# process, so it structurally cannot see this module's race class (the
# job's green was vacuous; TSan would be equally blind for the same reason).
# The replacement oracle is ci/prober-scenarios/shm-coherence-varidx, which
# asserts `at_rest varidx_inflight == 0` and was verified red by mutation
# (S16b). ci/tools/soak.sh still supports USE_HELGRIND as a manual/dispatch
# tool; see the comment at its helgrind branch before re-wiring a CI job to
# it.
#
# Action pins (keep in sync with build-test.yml header):
# actions/checkout@v5        -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd
# actions/upload-artifact@v7.0.2 -> cf430e030ddbb5b0abf93d22962f4752f3646cd9

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Monthly, day 5 @ 03:30 UTC — staggered per repo so ci-deep runs
    # don't pile up on the shared self-hosted runners.
    - cron: "30 3 5 * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Per-target fuzz duration (seconds)"
        required: false
        type: number
        default: 3600
      soak_iterations:
        description: "asan-soak: runtime-suite repetitions (flake hunt)"
        required: false
        type: number
        default: 8

concurrency:
  # Queue runs for the same ref without cancelling an active soak.
  group: ci-deep-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  # Four self-contained lanes. Every required step records its raw outcome;
  # independent groups continue after failure and the lane verdict fails closed.
  # Build trees and testkit checkouts are private to each group; ccache and verified
  # source archives retain the build-cache action contract.
  D-soak:
    name: D-soak
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    # Eight current ASan suites take about 194m plus build time. Preserve
    # their coverage and the 240m timeout; the <=125m measured goal is open.
    timeout-minutes: 240
    env:
      TEST_BASE_PORT: 19136
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

        id: checkout
      - name: asan-soak / Reset previous check environment
        id: asan_soak_reset
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/asan-soak
        run: |
          # Former jobs did not inherit another check group's exported paths.
          for key in MATRIX_VERSION TEST_NGINX_BINARY TEST_NGINX_LOAD_MODULES NGINX_BINARY MODULE_SO NGINX_SRC_TREE; do
            printf '%s=\n' "$key" >> "$GITHUB_ENV"
          done
      - name: asan-soak / Load version pins
        run: bash .github/scripts/load-versions.sh

        id: asan_soak_01
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/asan-soak
        continue-on-error: true
        if: always() && steps.asan_soak_reset.outcome == 'success'
      - name: asan-soak / Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache curl eatmydata libpcre2-dev libssl-dev mold redis-server memcached zlib1g-dev

        id: asan_soak_02
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/asan-soak
        continue-on-error: true
        if: always() && steps.asan_soak_01.outcome == 'success'
      - name: asan-soak / Restore build caches
        uses: ./.github/actions/build-cache  # zizmor: ignore[self-repository] -- $/ not yet accepted by actionlint
        with:
          mode: asan
          nginx-version: ${{ env.NGINX_VERSION }}

        id: asan_soak_03
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/asan-soak
        continue-on-error: true
        if: always() && steps.asan_soak_02.outcome == 'success'
      - name: asan-soak / Isolate build outputs
        id: asan_soak_isolate
        if: always() && steps.asan_soak_03.outcome == 'success'
        continue-on-error: true
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/asan-soak
          ARCHIVE_FLAVOR: nginx
          ARCHIVE_VERSION: ${{ env.NGINX_VERSION }}
        run: |
          mkdir -p "$BUILD_ROOT" "$GITHUB_WORKSPACE/.build"
          archive="$ARCHIVE_FLAVOR-$ARCHIVE_VERSION.tar.gz"
          ln -s "$GITHUB_WORKSPACE/.build/$archive" "$BUILD_ROOT/$archive"
      - name: asan-soak / Build with sanitizers
        run: bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" asan

        id: asan_soak_04
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/asan-soak
        continue-on-error: true
        if: always() && steps.asan_soak_isolate.outcome == 'success'
      - name: asan-soak / Sweep stale test listeners
        run: |
          # Kill leftovers from earlier crashed runs still holding test
          # ports in THIS job's own band. Must never widen back to the old
          # shared 18870-18999 -- that killed a SIBLING job's live fixtures
          # (AUD-CIPORT1).
          command -v fuser >/dev/null || sudo apt-get install -y psmisc
          for p in $(seq "$TEST_BASE_PORT" $((TEST_BASE_PORT + 63))); do
            fuser -k -TERM "${p}/tcp" 2>/dev/null || true
          done
          sleep 1

        id: asan_soak_05
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/asan-soak
        continue-on-error: true
        if: always() && steps.asan_soak_04.outcome == 'success'
      - name: asan-soak / Verify ASan soak port band
        run: ci/tools/max-port.sh "$TEST_BASE_PORT"

        id: asan_soak_06
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/asan-soak
        continue-on-error: true
        if: always() && steps.asan_soak_05.outcome == 'success'
      - name: asan-soak / Run multi-worker fault-injection suite N times (fail-fast)
        env:
          # detect_leaks=1 HERE, tracking asan.yml's CI-3 job, which runs the
          # SAME multi-worker topology (no --single-process). The nginx-core
          # false positive both hit -- ngx_event_process_init()'s three
          # never-freed per-process tables -- is exempted by POINTER in the
          # module's exit_process hook (LSAN-CORE-EVENT-TABLES,
          # src/ngx_http_cache_turbo_blob.c), which nginx also calls on the
          # worker exit path (ngx_worker_process_exit, ngx_process_cycle.c:947).
          #
          # The residual question -- whether a RETIRING worker (`-s reload`
          # generation handover) holds any OTHER unfreed core allocation -- was
          # measured on 2026-08-27 and answered NO: the full multi-worker
          # fault-injection suite runs clean under detect_leaks=1, and a
          # deliberately leaked malloc() in exit_process still turns the run RED.
          # Full rationale and the negative control live in asan.yml's CI-3
          # comment; this job intentionally carries the same setting.
          #
          # This soak runs the SAME suite N times, so it is the leg most likely
          # to surface a leak that only appears after repeated worker
          # generations -- which is precisely why it should not stay at 0.
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/asan-soak
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TEST_CT_TIMEOUT: "30"
          SOAK_ITERATIONS: ${{ github.event.inputs.soak_iterations || 8 }}
        run: |
          B="${BUILD_ROOT}/nginx-${NGINX_VERSION}/objs/nginx"
          n="${SOAK_ITERATIONS}"
          echo "asan-soak: $n iterations of the multi-worker fault-injection suite"
          for i in $(seq 1 "$n"); do
            echo "=== asan-soak iteration $i/$n ==="
            # Sweep between iterations: a crashed run can leave a listener
            # held. Same band as the job's own pre-suite sweep above (not a
            # separate job, so it shares TEST_BASE_PORT -- AUD-CIPORT1).
            for p in $(seq "$TEST_BASE_PORT" $((TEST_BASE_PORT + 63))); do
              fuser -k -TERM "${p}/tcp" 2>/dev/null || true
            done
            python3 ci/tools/test_runtime.py \
              --fault-injection \
              --sanitizer \
              --port "$TEST_BASE_PORT" \
              --redis-server /usr/bin/redis-server \
              --memcached-server /usr/bin/memcached \
              --nginx-binary "$B"
          done
          echo "asan-soak: $n/$n iterations clean"

        id: asan_soak_07
        continue-on-error: true
        if: always() && steps.asan_soak_06.outcome == 'success'
      - name: Lane verdict
        id: verdict
        if: always()
        env:
          LANE_NAME: D-soak
          LANE_STEPS: ${{ toJSON(steps) }}
          LANE_REQUIRED: >-
            checkout asan_soak_reset asan_soak_01 asan_soak_02 asan_soak_03 asan_soak_isolate asan_soak_04 asan_soak_05 asan_soak_06
            asan_soak_07
          LANE_OPTIONAL: ''
        shell: python3 {0}
        run: |
          import json
          import os
          import sys

          steps = json.loads(os.environ["LANE_STEPS"])
          required = os.environ["LANE_REQUIRED"].split()
          optional = os.environ["LANE_OPTIONAL"].split()
          failed = []
          for check in required + optional:
              outcome = steps.get(check, {}).get("outcome", "missing")
              if outcome != "success" and not (check in optional and outcome == "skipped"):
                  failed.append(f"{check} ({outcome})")
          summary = ", ".join(failed)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"failed={summary}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("### " + os.environ["LANE_NAME"] + "\n")
              for check in required + optional:
                  output.write(f"- {check}: {steps.get(check, {}).get('outcome', 'missing')}\n")
          if failed:
              print("::error::Required checks failed or could not run: " + summary)
          sys.exit(bool(failed))
      - name: Notify Discord on lane failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_BUILDS: ${{ secrets.DISCORD_CHANNEL_BUILDS }}
          GH_REPO: ${{ github.repository }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_RUN_ID: ${{ github.run_id }}
          LANE_NAME: D-soak
          FAILED_CHECKS: ${{ steps.verdict.outputs.failed || 'lane setup or verdict unavailable' }}
        run: |
          [ -n "$DISCORD_BOT_TOKEN" ] || exit 0
          payload="$(python3 - <<'PYTHON'
          import json
          import os
          prefix = f"{os.environ['GH_REPO']} — CI Deep / {os.environ['LANE_NAME']} FAILED: "
          link = f" {os.environ['GH_SERVER_URL']}/{os.environ['GH_REPO']}/actions/runs/{os.environ['GH_RUN_ID']}"
          checks = os.environ['FAILED_CHECKS'].split(', ')
          # Put actual failures before prerequisite skips; the full list is in the run summary.
          checks.sort(key=lambda check: '(skipped)' in check)
          # Discord Create Message caps content at 2000 characters:
          # https://docs.discord.com/developers/resources/message#create-message
          for count in range(len(checks), -1, -1):
              omitted = len(checks) - count
              suffix = f"; {omitted} more checks in run summary" if omitted else ""
              content = prefix + ', '.join(checks[:count]) + suffix + '.' + link
              if len(content) <= 2000:
                  break
          else:
              raise ValueError('Lane name and run URL exceed Discord content limit')
          print(json.dumps({"content": content}))
          PYTHON
          )"
          curl -fsS -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_BUILDS/messages" \
            -d "$payload" || true
  D-fuzz-a:
    name: D-fuzz-a
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    # Inputs through 14400s retain four hours of fuzz CPU per target plus tails.
    timeout-minutes: ${{ inputs.fuzz_seconds > 3600 && 420 || 180 }}
    env:
      TEST_BASE_PORT: 19200
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

        id: checkout
      - name: fuzz-a / Reset previous check environment
        id: fuzz_a_reset
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/fuzz-a
        run: |
          # Former jobs did not inherit another check group's exported paths.
          for key in MATRIX_VERSION TEST_NGINX_BINARY TEST_NGINX_LOAD_MODULES NGINX_BINARY MODULE_SO NGINX_SRC_TREE; do
            printf '%s=\n' "$key" >> "$GITHUB_ENV"
          done
      - name: fuzz-a / Load version pins
        run: bash .github/scripts/load-versions.sh

        id: fuzz_a_01
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/fuzz-a
        continue-on-error: true
        if: always() && steps.fuzz_a_reset.outcome == 'success'
      - name: fuzz-a / Install clang + libFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

        id: fuzz_a_02
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/fuzz-a
        continue-on-error: true
        if: always() && steps.fuzz_a_01.outcome == 'success'
      - name: fuzz-a / Select fuzz duration
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/fuzz-a
          FUZZ_SECONDS_INPUT: ${{ inputs.fuzz_seconds || '3600' }}
        run: |
          case "$FUZZ_SECONDS_INPUT" in
            ''|*[!0-9]*)
              echo "::error::fuzz_seconds must contain decimal digits only"
              exit 2
              ;;
          esac
          if [ "$FUZZ_SECONDS_INPUT" -lt 1 ] \
              || [ "$FUZZ_SECONDS_INPUT" -gt 14400 ]; then
            echo "::error::fuzz_seconds must be between 1 and 14400"
            exit 2
          fi
          printf 'FUZZ_SECS=%s\n' "$FUZZ_SECONDS_INPUT" >> "$GITHUB_ENV"

        id: fuzz_a_03
        continue-on-error: true
        if: always() && steps.fuzz_a_02.outcome == 'success'
      - name: fuzz-a / Restore build caches
        uses: ./.github/actions/build-cache  # zizmor: ignore[self-repository] -- $/ not yet accepted by actionlint
        with:
          mode: debug
          nginx-version: ${{ env.NGINX_VERSION }}

        id: fuzz_a_04
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/fuzz-a
        continue-on-error: true
        if: always() && steps.fuzz_a_03.outcome == 'success'
      - name: fuzz-a / Build fuzz targets
        run: bash ci/fuzz/build.sh "$GITHUB_WORKSPACE/ci/fuzz"

        id: fuzz_a_05
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/fuzz-a
        continue-on-error: true
        if: always() && steps.fuzz_a_04.outcome == 'success'
      - name: fuzz-a / Fuzz targets concurrently
        run: |
          set -euo pipefail
          cd ci/fuzz
          # Each target gets the full per-target FUZZ_SECS budget in its own
          # libFuzzer process, at most FUZZ_JOBS (default 3) at once so every
          # target keeps a core on a 4-vCPU runner; the rest queue. The runner
          # waits on all of them and fails on a non-zero exit or any crash-/
          # leak-/timeout-/oom- artifact (written as ci/fuzz/crash-<bin>-*,
          # which the upload step below globs). Logs: ci/fuzz/fuzz-logs/.
          bash run-concurrent.sh fuzz_resp_parser:corpus:fuzz.dict fuzz_norm_args:corpus_norm_args: fuzz_mc_parser:corpus_mc:fuzz_mc.dict

        id: fuzz_a_06
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/fuzz-a
          FUZZ_JOBS: '3'
        continue-on-error: true
        if: always() && steps.fuzz_a_05.outcome == 'success'
      - name: fuzz-a / Upload crash artifacts
        if: always() && steps.fuzz_a_06.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-deep-crashes-fuzz-a
          path: |
            ${{ github.workspace }}/ci/fuzz/crash-*
            ${{ github.workspace }}/ci/fuzz/fuzz-logs/
          retention-days: 30

        id: fuzz_a_07
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/fuzz-a
        continue-on-error: true
      - name: fuzz-a / Upload minimized corpus
        if: always() && steps.fuzz_a_06.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus-fuzz-a
          path: ${{ github.workspace }}/ci/fuzz/*-min
          retention-days: 30

        id: fuzz_a_08
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/fuzz-a
        continue-on-error: true
      - name: coverage / Reset previous check environment
        id: coverage_reset
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/coverage
        run: |
          # Former jobs did not inherit another check group's exported paths.
          for key in MATRIX_VERSION TEST_NGINX_BINARY TEST_NGINX_LOAD_MODULES NGINX_BINARY MODULE_SO NGINX_SRC_TREE; do
            printf '%s=\n' "$key" >> "$GITHUB_ENV"
          done
      - name: coverage / Check out nginx-module-testkit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: myguard-labs/nginx-module-testkit
          ref: 27f724082e16f6d9bd8a2a0ee944ef9dd551ab7e
          path: .testkit-coverage
          persist-credentials: false

        id: coverage_01
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/coverage
        continue-on-error: true
        if: always() && steps.coverage_reset.outcome == 'success'
      - name: coverage / Load version pins
        run: bash .github/scripts/load-versions.sh

        id: coverage_02
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/coverage
        continue-on-error: true
        if: always() && steps.coverage_01.outcome == 'success'
      - name: coverage / Install build and runtime dependencies
        run: |
          sudo apt-get update
          # dwarves provides pahole, which ci/tests/unit/extract_shm.sh needs
          # to measure ngx_http_cache_turbo_node_t's size (P2-3 slab-class
          # assertion). Without it the check has nothing to skip TO but a
          # silent pass -- so it is a required dependency, not optional.
          sudo apt-get install -y build-essential ccache curl dwarves eatmydata \
            libpcre2-dev libssl-dev mold python3-venv redis-server redis-tools memcached zlib1g-dev
          # Ubuntu's gcovr 6 parser rejects GCC 14's `10000-block` records.
          # Keep the report reproducible and new enough to read the compiler's
          # gcov output instead of relying on the runner image's apt version.
          python3 -m venv "$RUNNER_TEMP/gcovr"
          "$RUNNER_TEMP/gcovr/bin/pip" install --disable-pip-version-check gcovr==7.2
          echo "$RUNNER_TEMP/gcovr/bin" >> "$GITHUB_PATH"

        id: coverage_03
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/coverage
        continue-on-error: true
        if: always() && steps.coverage_02.outcome == 'success'
      - name: coverage / Restore build caches
        uses: ./.github/actions/build-cache  # zizmor: ignore[self-repository] -- $/ not yet accepted by actionlint
        with:
          mode: coverage
          nginx-version: ${{ env.NGINX_VERSION }}

        id: coverage_04
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/coverage
        continue-on-error: true
        if: always() && steps.coverage_03.outcome == 'success'
      - name: coverage / Isolate build outputs
        id: coverage_isolate
        if: always() && steps.coverage_04.outcome == 'success'
        continue-on-error: true
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/coverage
          ARCHIVE_FLAVOR: nginx
          ARCHIVE_VERSION: ${{ env.NGINX_VERSION }}
        run: |
          mkdir -p "$BUILD_ROOT" "$GITHUB_WORKSPACE/.build"
          archive="$ARCHIVE_FLAVOR-$ARCHIVE_VERSION.tar.gz"
          ln -s "$GITHUB_WORKSPACE/.build/$archive" "$BUILD_ROOT/$archive"
      - name: coverage / Sweep stale test listeners
        run: |
          # Kill leftovers from earlier crashed runs still holding test
          # ports in THIS job's own band. Must never widen back to the old
          # shared 18870-18999 -- that killed a SIBLING job's live fixtures
          # (AUD-CIPORT1).
          command -v fuser >/dev/null || sudo apt-get install -y psmisc
          for p in $(seq "$TEST_BASE_PORT" $((TEST_BASE_PORT + 63))); do
            fuser -k -TERM "${p}/tcp" 2>/dev/null || true
          done
          sleep 1

        id: coverage_05
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/coverage
        continue-on-error: true
        if: always() && steps.coverage_isolate.outcome == 'success'
      - name: coverage / Verify coverage port band
        run: ci/tools/max-port.sh "$TEST_BASE_PORT"

        id: coverage_06
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/coverage
        continue-on-error: true
        if: always() && steps.coverage_05.outcome == 'success'
      - name: coverage / Build instrumented, run suite, report
        # coverage.sh drives all three steps (ci-build.sh coverage -> runtime
        # suite -> gcovr). The instrumented build is -O0 and the suite seeds
        # real bodies, so the per-test timeout needs the same headroom the
        # script's own default gives it. TEST_BASE_PORT (job env, above) is
        # read by coverage.sh itself (AUD-CIPORT1).
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/coverage
          TEST_NGINX_TIMEOUT: "30"
          TESTKIT_ROOT: ${{ github.workspace }}/.testkit-coverage
        run: bash ci/tools/coverage.sh nginx "$NGINX_VERSION"

        id: coverage_07
        continue-on-error: true
        if: always() && steps.coverage_06.outcome == 'success'
      - name: coverage / Coverage summary to job log
        if: always() && steps.checkout.outcome == 'success'
        run: |
          # The percentages in the step log make the trend readable without
          # downloading the artifact.
          if [ -f coverage-report/coverage.txt ]; then
            {
              echo '### Module coverage'
              echo '```'
              tail -n 20 coverage-report/coverage.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f coverage-report/unit/coverage.txt ]; then
            {
              echo '### swr/autotune unit coverage'
              echo '```'
              tail -n 20 coverage-report/unit/coverage.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f coverage-report/testkit/coverage.txt ]; then
            {
              echo '### Testkit scenario coverage'
              echo '```'
              tail -n 20 coverage-report/testkit/coverage.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f coverage-report/combined/coverage.txt ]; then
            {
              echo '### Combined runtime + testkit coverage'
              echo '```'
              tail -n 20 coverage-report/combined/coverage.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

        id: coverage_08
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/coverage
        continue-on-error: true
      - name: coverage / Upload coverage report
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: ${{ github.workspace }}/coverage-report
          retention-days: 14

        id: coverage_09
        env:
          BUILD_ROOT: ${{ github.workspace }}/.build/deep/coverage
        continue-on-error: true
      - name: Lane verdict
        id: verdict
        if: always()
        env:
          LANE_NAME: D-fuzz-a
          LANE_STEPS: ${{ toJSON(steps) }}
          LANE_REQUIRED: >-
            checkout fuzz_a_reset fuzz_a_01 fuzz_a_02 fuzz_a_03 fuzz_a_04 fuzz_a_05 fuzz_a_06 coverage_reset coverage_01 coverage_02
            coverage_03 coverage_04 coverage_isolate coverage_05 coverage_06 coverage_07 coverage_08 coverage_09
          LANE_OPTIONAL: fuzz_a_07 fuzz_a_08
        shell: python3 {0}
        run: |
          import json
          import os
          import sys

          steps = json.loads(os.environ["LANE_STEPS"])
          required = os.environ["LANE_REQUIRED"].split()
          optional = os.environ["LANE_OPTIONAL"].split()
          failed = []
          for check in required + optional:
              outcome = steps.get(check, {}).get("outcome", "missing")
              if outcome != "success" and not (check in optional and outcome == "skipped"):
                  failed.append(f"{check} ({outcome})")
          summary = ", ".join(failed)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"failed={summary}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("### " + os.environ["LANE_NAME"] + "\n")
              for check in required + optional:
                  output.write(f"- {check}: {steps.get(check, {}).get('outcome', 'missing')}\n")
          if failed:
              print("::error::Required checks failed or could not run: " + summary)
          sys.exit(bool(failed))
      - name: Notify Discord on lane failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_BUILDS: ${{ secrets.DISCORD_CHANNEL_BUILDS }}
          GH_REPO: ${{ github.repository }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_RUN_ID: ${{ github.run_id }}
          LANE_NAME: D-fuzz-a
          FAILED_CHECKS: ${{ steps.verdict.outputs.failed || 'lane setup or verdict unavailable' }}
        run: |
          [ -n "$DISCORD_BOT_TOKEN" ] || exit 0
          payload="$(python3 - <<'PYTHON'
          import json
          import os
          prefix = f"{os.environ['GH_REPO']} — CI Deep / {os.environ['LANE_NAME']} FAILED: "
          link = f" {os.environ['GH_SERVER_URL']}/{os.environ['GH_REPO']}/actions/runs/{os.environ['GH_RUN_ID']}"
          checks = os.environ['FAILED_CHECKS'].split(', ')
          # Put actual failures before prerequisite skips; the full list is in the run summary.
          checks.sort(key=lambda check: '(skipped)' in check)
          # Discord Create Message caps content at 2000 characters:
          # https://docs.discord.com/developers/resources/message#create-message
          for count in range(len(checks), -1, -1):
              omitted = len(checks) - count
              suffix = f"; {omitted} more checks in run summary" if omitted else ""
              content = prefix + ', '.join(checks[:count]) + suffix + '.' + link
              if len(content) <= 2000:
                  break
          else:
              raise ValueError('Lane name and run URL exceed Discord content limit')
          print(json.dumps({"content": content}))
          PYTHON
          )"
          curl -fsS -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_BUILDS/messages" \
            -d "$payload" || true
  D-fuzz-b:
