# sync-sha: 617b069adc9b0aaaba8ac9591c4d3b920aefff65e840e46f97559a7b803c0466
name: Security scanners

# Static/security scanners gate (flawfinder, clang-tidy cert-*/security.*,
# semgrep) on every PR/push. Same job as the ci-deep.yml scanners job.
#
# Action pins (keep in sync with build-test.yml header):
# actions/checkout@v5        -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd
# actions/upload-artifact@v5 -> 330a01c490aca151604b8cf639adc76d48f6c5d4

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NGINX_VERSION: "1.31.1"

on:
  workflow_call: {}
  workflow_dispatch: {}

concurrency:
  group: security-scanners-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scanners:
    name: Security scanners
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","builder02"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0  # gitleaks scans git history
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache curl eatmydata flawfinder clang-tidy \
            libpcre2-dev libssl-dev mold python3 python3-pip pipx zlib1g-dev
          # semgrep: isolate via pipx (PEP 668 blocks a bare pip3 install into the
          # system Python on the Ubuntu 24.04 self-hosted runner). Fall back to a
          # user pip install with --break-system-packages if pipx is unavailable.
          if command -v pipx >/dev/null; then
            pipx install --quiet semgrep
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            pip3 install --quiet --user --break-system-packages semgrep
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: gitleaks (full history scan)
        run: |
          set -euo pipefail
          version=8.30.1
          archive="/tmp/gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          bash ci/tools/verify-download.sh "$archive"
          tar -xzf "$archive" -C /tmp gitleaks
          /tmp/gitleaks git --no-banner .
      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          mode: module
          nginx-version: ${{ env.NGINX_VERSION }}
      - name: Configure nginx src tree (clang-tidy headers)
        run: |
          set -euo pipefail
          bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" module
          echo "NGINX_SRC_TREE=$GITHUB_WORKSPACE/.build/nginx-${NGINX_VERSION}" \
            >> "$GITHUB_ENV"
      - name: flawfinder (gate on >=4)
        run: |
          set -euo pipefail
          # minlevel=3: level 1-2 is dominated by token-matches on the struct
          # field op->recv (not the recv(2) syscall) and on FF1029 sites that
          # contain no loop. 34 such alerts were dismissed as false positives.
          #
          # REPORT at 3, GATE at 4. This step previously had no
          # --error-level at all, so it could not fail whatever it found, while
          # .pre-commit-config.yaml gated locally at 4 -- a finding blocked a
          # commit and then sailed through CI. 4 is the pre-commit threshold;
          # keep the two equal or local-green stops predicting remote-green.
          # Verified 0 hits at level 4 when this gate was turned on.
          #
          # pipefail is load-bearing: without it `tee` supplies the exit status
          # and the gate silently passes on every finding.
          flawfinder --minlevel=3 --error-level=4 \
            "$GITHUB_WORKSPACE"/src/*.c 2>&1 | tee flawfinder.log
      - name: clang-tidy (cert-*, security.*)
        run: |
          set -euo pipefail
          N="$NGINX_SRC_TREE"
          INCLUDES="-I$N/src/core -I$N/src/event -I$N/src/event/modules -I$N/src/event/quic \
            -I$N/src/os/unix -I$N/objs -I$N/src/http -I$N/src/http/modules -I$N/src/http/v2 -I/usr/include"
          status=0
          for f in "$GITHUB_WORKSPACE"/src/*.c; do
            # shellcheck disable=SC2086
            clang-tidy "$f" \
              --checks='-*,cert-*,clang-analyzer-security.*,-clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling' \
              --warnings-as-errors='*' \
              -- $INCLUDES 2>&1 | tee -a clang-tidy.log || status=1
          done
          exit "$status"
      - name: semgrep (gate on >=WARNING)
        run: |
          set -euo pipefail
          # GATED. This step previously ended in `|| true`,
          # so it reported and never blocked, while .pre-commit-config.yaml
          # gated locally with --error at the same severity floor. Matching
          # thresholds is the point: pre-commit exists to predict this job.
          #
          # WARNING not ERROR: the registry's ERROR tier has no C rules that
          # fire on this kind of code, so an ERROR-only gate could never go red.
          # Verified 0 findings at this floor when the gate was turned on.
          #
          # -j 1 IS LOAD-BEARING. Parallel semgrep-core shards allocate one
          # io_uring each, blow past RLIMIT_MEMLOCK and die with
          #     Unix_error: Cannot allocate memory io_uring_queue_init
          # which surfaces as a stack trace and EXIT CODE 0 -- a crashed
          # scanner that reads as a clean scan. Same reason the pre-commit hook
          # sets require_serial. Do not "speed this up" by dropping it.
          #
          # pipefail likewise: without it `tee` supplies the status.
          semgrep scan -j 1 --config p/c --config p/security-audit \
            --severity=WARNING --severity=ERROR --error \
            "$GITHUB_WORKSPACE/src/" 2>&1 | tee semgrep.log
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: security-reports
          path: |
            ${{ github.workspace }}/flawfinder.log
            ${{ github.workspace }}/clang-tidy.log
            ${{ github.workspace }}/semgrep.log
          retention-days: 14
