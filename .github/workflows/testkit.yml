# sync-sha: 3aa33c6e43b4b3288f296e8b7016d588c5d9964977abf777dde0d7b65ba066cb
name: Testkit

# The nginx-module-testkit prober leg.
#
# WHAT IT PROVES THAT NOTHING ELSE HERE DOES
#   labs/nginx-module-testkit ships a finished per-request allocation-
#   neutrality oracle for this module (scenarios/consumer-cache-turbo): two
#   post-drain QUIESCENT probe snapshots taken around one extra served request,
#   comparing cycle-pool counters (cycle_used, cycle_blocks, cycle_large),
#   worker fd count and MASTER fd count. Equal across the pair means the HIT
#   path frees everything it allocates per request -- no cache-entry-ref,
#   header-copy or connection leak surviving repeated serves.
#
#   Our own runtime suite cannot make that assertion: it has no probe into the
#   cycle pool. This is a genuinely new lens, not a second copy of an existing
#   one -- which is the bar ci.yml's header sets for anything that consumes a
#   pool slot.
#
#   The scenario is also non-vacuous by construction: oracle 2 asserts a real
#   `X-Cache: HIT` occurred before the measured pair, so a pass-through filter
#   allocating nothing cannot score "allocation-neutral".
#
# THE SKIP TRAP THIS JOB EXISTS TO CLOSE
#   That scenario had never run once. Its ./requires gate demands a staged
#   ngx_http_cache_turbo_module.so; nobody staged one, so it emitted
#   `1..0 # SKIP` on every testkit CI run since it was written.
#
#   `1..0 # SKIP` is a PASSING TAP plan. A permanently-skipping leg and a green
#   leg are indistinguishable in a job summary, which is exactly how a finished
#   integration stayed disconnected for a month. So this job checks BOTH
#   directions: the staged tree must produce real assertions (`testkit-run.sh`),
#   AND an unstaged tree must still SKIP cleanly rather than fail
#   (`--expect-skip`). Neither half is sufficient alone.
#
# COST -- measured, against ci.yml's work-bound budget
#   ci.yml is WORK-bound, not latency-bound (its header: total work / 4 slots
#   binds at 1001s vs a 921s critical path), and it has a documented policy of
#   REMOVING PR-gate jobs that duplicate ci-deep.yml. So a new job must justify
#   its slot.
#
#   Measured locally on the builder-class box:
#     scenario run, tree already staged .......... 0.40s
#     re-stage, warm ccache + reused src ......... 3.51s
#     first cold build (fetch+configure+make) .... ~3 min, ccache-dominated
#
#   The oracle itself is nearly free; the cost is one nginx build that CANNOT
#   reuse Build&Test's tree, because the prober needs testkit's ref probe
#   compiled into the SAME objs/ (nginx binds its dynamic-module list at
#   configure time -- there is no adding a module to a built tree). With the
#   shared persistent ccache that build is mostly cache hits, which is why this
#   is a PR-gate job rather than a ci-deep one. If the cold cost ever dominates
#   a lane, demote it to ci-deep.yml rather than weakening the oracle.
#
# Path-gated: this leg only reads src/ and its two driver scripts. It is NOT
# run on docs-only PRs.

on:
  workflow_call:
    inputs:
      skip-expensive-jobs:
        description: "true on docs-only PRs -- the job becomes a quick no-op."
        required: false
        default: false
        type: boolean
  workflow_dispatch: {}

# Distinct prefix, same shape as asan.yml/fuzzing.yml. A called workflow
# inherits the caller's github.workflow/github.ref, so an identical group
# string across members would make one member cancel another -- and a group
# matching ci.yml's own would let a member cancel its caller. This also stops
# two runs of this leg overlapping on the shared runner, which matters here
# because both would sweep and bind the same 19456 band.
concurrency:
  group: testkit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prober:
    name: Prober scenarios
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    env:
      # This job's port band under ci/tools/lint-ci-ports.sh. 18880/18944/19008/
      # 19072/19136/19200/19264/19328 are taken by the eight existing
      # runtime-bearing jobs, and the next 64-wide band, 19392-19455, is NOT
      # free: ci/t/core/breaker-retry-count.t reserves 19420-19490 for the
      # fixed multi-peer upstream ports it needs (dead peers that must stay
      # unlistened, plus a specific alive peer -- ct_origin_port() cannot
      # express that for a multi-peer group), and 19392-19455 overlaps it.
      # That reservation lived only in a comment inside the .t file, so
      # nothing caught the clash when this lane was added; the fence in
      # build-test.yml still held only a stale hand-typed 6-band tuple that
      # omitted 19392, which is the sole reason it never fired. Deriving the
      # fence correctly (AUD-CIPORT4) exposed it immediately -- the fence
      # bound 19421/19433 and 41 preset files died on
      # "bind() to 127.0.0.1:19421 failed (98)". 19456 is the first band
      # clear of the reservation; lint-ci-ports.sh check 4 now enforces it.
      #
      # testkit-run.sh reads TEST_BASE_PORT from the environment and defaults
      # its --port to it, so declaring the band here IS passing it -- the same
      # arrangement coverage.sh has, and the lint knows about both.
      TEST_BASE_PORT: 19456
      NGINX_VERSION: "1.31.3"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # The harness is a SIBLING REPO, not a submodule and not vendored.
      #
      # Vendoring was rejected: testkit's t/module/config compiles sources by
      # relative climb out of its own tree (../../src/ngx_test_probe.c), so a
      # partial copy does not build; and a vendored copy drifts from upstream
      # while the port-back never happens -- which is precisely how testkit's
      # own untracked consumers/ snapshot of THIS repo rotted a month stale.
      #
      # A submodule was rejected too: this repo has no .gitmodules today, and
      # adding one changes clone/CI semantics repo-wide for a single test leg.
      # A pinned checkout keeps the coupling local to this job.
      - name: Check out nginx-module-testkit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: myguard-labs/nginx-module-testkit
          # Pinned, not a floating branch: an unpinned harness means a red leg
          # whose cause is a commit in another repo that this PR never touched.
          # Bump deliberately, in its own PR, so the bump is what gets blamed.
          #
          # This pin moved f8e09995 -> 27f7240 (testkit PR #220) IN the S11 PR
          # rather than ahead of it, and that is the one case the rule above
          # yields to: 27f7240 is the commit that ADDS the fanout/quiesce/
          # zone_invariant directives, so shm-coherence-varidx cannot parse --
          # let alone assert -- on any earlier pin. Splitting the bump into its
          # own PR would land a pin bump that changes no behaviour, followed by
          # a scenario PR that is red until it merges. The bump and the only
          # consumer of what it adds are one change.
          ref: 27f724082e16f6d9bd8a2a0ee944ef9dd551ab7e
          path: .testkit
          persist-credentials: false

      - name: Install build dependencies
        if: ${{ !inputs.skip-expensive-jobs }}
        run: |
          sudo apt-get update
          # openssl + zlib headers are for the PROBER CLIENT itself (its
          # body_sha256 oracle links OpenSSL, its gunzip oracle links zlib),
          # not for this module -- cache-turbo's Redis driver is native nginx.
          # redis-server + redis-tools are for shm-coherence-varidx: the
          # varidx_inflight counter it asserts on moves ONLY on the
          # Redis-backed variant-index write path, and redis-cli is that
          # scenario's anti-vacuity oracle (it reads the variant-index set's
          # cardinality out of Redis). Without them the scenario SKIPs
          # cleanly -- correct behaviour, and zero coverage of the only
          # automated COR-5 guard there is.
          sudo apt-get install -y build-essential ccache curl eatmydata \
            libpcre2-dev libssl-dev redis-server redis-tools zlib1g-dev

      - name: Restore build caches
        if: ${{ !inputs.skip-expensive-jobs }}
        uses: ./.github/actions/build-cache
        with:
          # A distinct ccache namespace. This tree's configure differs from
          # every other mode's (it binds two dynamic modules and carries
          # testkit's -DNGX_TEST_HARNESS in the global CFLAGS), so sharing a
          # namespace with `debug` would trade hits for pointless misses.
          mode: testkit
          nginx-version: ${{ env.NGINX_VERSION }}

      - name: Sweep stale test listeners
        if: ${{ !inputs.skip-expensive-jobs }}
        run: |
          # Kill leftovers from earlier crashed runs still holding test ports in
          # THIS job's own band. Must never widen beyond it -- a wider sweep
          # kills a SIBLING job's live fixtures on the shared runner, which is
          # the defect AUD-CIPORT1 fixed.
          command -v fuser >/dev/null || sudo apt-get install -y psmisc
          for p in $(seq "$TEST_BASE_PORT" $((TEST_BASE_PORT + 63))); do
            fuser -k -TERM "${p}/tcp" 2>/dev/null || true
          done
          sleep 1

      - name: Verify runtime port band
        if: ${{ !inputs.skip-expensive-jobs }}
        run: ci/tools/max-port.sh "$TEST_BASE_PORT"

      - name: Stage cache-turbo + testkit ref probe into one tree
        if: ${{ !inputs.skip-expensive-jobs }}
        env:
          TESTKIT_ROOT: ${{ github.workspace }}/.testkit
        run: ci/tools/testkit-stage.sh --version "$NGINX_VERSION"

      - name: Report compiler-cache effectiveness
        if: ${{ !inputs.skip-expensive-jobs }}
        run: ccache --show-stats

      # --- the two directions -------------------------------------------------
      # Both are required. The pass direction alone cannot detect a regression
      # to permanent-SKIP (that exits 0 and reads green); the skip direction
      # alone cannot detect a broken oracle.
      - name: Scenario asserts on a staged tree
        if: ${{ !inputs.skip-expensive-jobs }}
        env:
          TESTKIT_ROOT: ${{ github.workspace }}/.testkit
        run: |
          # consumer-cache-turbo is testkit-run.sh's default; shm-coherence-varidx
          # is named explicitly because naming ANY scenario replaces that
          # default rather than adding to it.
          #
          # shm-coherence-varidx is the cross-process shm invariant lens against
          # this module's own shared counters, and the only automated guard on
          # COR-5 (the varidx_inflight strand, PR #443). It boots four workers
          # and needs redis-server + redis-cli; its ./requires gate SKIPs
          # cleanly without them, which is correct but zero coverage -- so if
          # this leg ever starts reporting `1..0 # SKIP`, that is a finding,
          # not a pass.
          #
          # fault-slab-store (S24) is the probe-armed slab-allocation fault: it
          # arms `fault_slab=` through the probe, forces store_locked()'s node
          # allocation to fail, and asserts the error path is resource-neutral
          # (cycle_used / cycle_blocks / cycle_large / fds flat across the
          # faulting request). It belongs in the PR gate rather than in
          # ci-deep's sanitizer job because it is CHEAP -- one worker, no
          # reload, no soak, ~10 bounded requests total and no external
          # fixture, so it needs no service container and adds seconds. The
          # error paths it reaches are reachable no other way in this repo:
          # exhausting a zone for real is slow AND perturbs the very counters
          # the oracle reads.
          # alloc-per-request / fd-starve / multi-worker (S25) are CT-authored
          # ports of testkit's generic prober scenarios of the same name,
          # rebuilt against a REAL cache_turbo HIT path
          # (ci/prober-scenarios/<name>/nginx.conf) rather than testkit's own
          # bare `return 200`: each conf's traffic goes through a `cache_turbo`
          # location and every case that claims to measure a HIT asserts
          # `X-Cache: HIT` on the wire first, so a pass-through conf (the
          # vacuous-green class this job's own header warns about) cannot pass
          # them. All three are single-shot -- no reload, no soak loop -- so
          # they stay in the PR gate rather than ci-deep.yml's sanitizer job;
          # the reload- and loop-shaped ports (reload-mid-upload, rss-slope)
          # are in ci-deep.yml instead. Non-vacuity for each was proven by a
          # planted mutation (see the scenario's own header comment) observed
          # red, then reverted to green.
          ci/tools/testkit-run.sh --version "$NGINX_VERSION" \
            -- consumer-cache-turbo shm-coherence-varidx fault-slab-store \
               alloc-per-request fd-starve multi-worker

      - name: Scenario SKIPs cleanly on an unstaged tree
        if: ${{ !inputs.skip-expensive-jobs }}
        env:
          TESTKIT_ROOT: ${{ github.workspace }}/.testkit
        run: |
          # A version nothing stages. The gate must SKIP -- not fail: a missing
          # consumer .so is an environment fact, and a red here would train
          # people to ignore this leg.
          #
          # fault-slab-store, alloc-per-request, fd-starve and multi-worker
          # are all named explicitly for the same reason: naming
          # any scenario REPLACES testkit-run.sh's default rather than adding
          # to it, so a scenario absent from this list has its own ./requires
          # gate untested in the skip direction -- exactly the gate that
          # refuses a non-harness .so, and a gate nothing exercises is how a
          # scenario silently degrades to permanent-SKIP in the direction
          # that reads green.
          ci/tools/testkit-run.sh --expect-skip --version "${NGINX_STABLE:-1.30.4}" \
            -- consumer-cache-turbo fault-slab-store \
               alloc-per-request fd-starve multi-worker
