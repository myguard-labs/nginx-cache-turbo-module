# sync-sha: aa4d54fc3f5ce13c5128637d500b6c6a8c392249e0e745ef1a36c5c45f56a79f
name: Valgrind

# Valgrind memcheck lite soak (60s @ 4 conc) — ON-DEMAND ONLY.
#
# This is NO LONGER part of the PR gate. It was removed from ci.yml when the
# runner pool was sized at 4 concurrent slots: at that width the gate is
# work-bound (total work / 4 > critical path), so its 158s of work cost real
# wall-clock on every PR, and dropping this one job alone recovered 6-slot
# makespan at 4 slots. It was the cheapest cut available because it is a strict
# subset of coverage that runs elsewhere:
#
#   - ASan/UBSan still runs on every PR and covers memory errors on that leg;
#   - ci-deep.yml runs the full 600s `memcheck` AND `helgrind` soaks monthly.
#
# Kept (rather than deleted) as a workflow_dispatch entry point: a 60s soak is
# the right tool for a quick manual check on a suspect branch without waiting
# for a full ci-deep run. Retaining workflow_call also means re-adding it to a
# gate is a one-line change if the pool ever widens.
#
# Action pins (keep in sync with build-test.yml header):
# actions/checkout@v5        -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call: {}
  workflow_dispatch: {}

concurrency:
  group: valgrind-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  memcheck-lite:
    name: Memcheck lite (60s soak)
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache curl eatmydata libpcre2-dev libssl-dev mold pkg-config \
            valgrind zlib1g-dev

      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          mode: debug
          nginx-version: ${{ env.NGINX_VERSION }}

      - name: Build debug nginx + cache-turbo module
        run: bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" debug

      - name: Memcheck soak (60s @ 4 conc, WITH suppressions)
        env:
          USE_VALGRIND: "1"
        run: |
          B="$GITHUB_WORKSPACE/.build/nginx-${NGINX_VERSION}/objs"
          MODULE="$B/ngx_http_cache_turbo_module.so" \
            bash ci/tools/soak.sh "$B/nginx" 60 4
