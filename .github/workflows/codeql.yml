# sync-sha: 3ad5c08b17231c03a830a8ec18b5e8e2f4444aecc85346605a66067a60b2fb35
name: CodeQL

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "47 4 5 * *"
  workflow_call: {}
  workflow_dispatch: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    permissions:
      # Read-only checkout of this repo's source; nothing here writes to it.
      contents: read
      # Narrowest scope that still publishes: no `contents: write`, no
      # `actions: write`. Without it the analysis runs and the findings are
      # silently discarded.
      security-events: write  # upload CodeQL SARIF to code-scanning alerts
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # No ccache here: CodeQL's build tracer must see every compiler
          # invocation; a ccache hit skips the compile and hides code from the
          # database. mold/eatmydata are link/IO-only and safe.
          sudo apt-get install -y build-essential curl eatmydata libpcre2-dev libssl-dev mold zlib1g-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: c-cpp
          queries: security-extended
          config: |
            paths:
              - src
            paths-ignore:
              - .build/**

      # ccache: false -- CodeQL's build tracer must see every compiler
      # invocation; a ccache hit skips the compile and hides code from the
      # database. This still caches the upstream tarball and ensures mold/
      # eatmydata (link/IO-only, safe for tracing).
      - name: Restore build caches
        uses: ./.github/actions/build-cache
        with:
          mode: module
          nginx-version: ${{ env.NGINX_VERSION }}
          ccache: "false"

      - name: Build traced source
        run: bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" module

      - name: Analyze
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: /language:c-cpp
