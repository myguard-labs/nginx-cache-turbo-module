# sync-sha: b26c9ca38656a2223956f534032fbfb04304191fabeb7ac7b2401d3a5940afc3
name: ASan and UBSan

# Dedicated ASan+UBSan workflow, PATH-GATED: only runs when a PR/push touches
# code that could carry a memory/UB bug (C sources, the build/runtime harness,
# or this workflow). A docs/memory/other-workflow PR skips it entirely instead
# of paying the ~16-minute sanitizer build+suite for zero possible signal.
#
# Structure (CI-L4) -- two SELF-CONTAINED jobs that run in parallel:
#   asan-single   builds the static --add-module ASan binary, then runs the
#                 --single-process suite (own allocs, R6b event-loop hang,
#                 ci-hang-guard armed)
#   asan-multi    builds the same binary, then runs the master + 4-worker suite
#                 (cross-worker shm-zone UAF / race the 1-worker run cannot reach)
# There is no artifact hop: each job builds for itself. Both restore the same
# build-cache mode (`asan`, one shared ccache key), so whichever build runs
# second is mostly cache hits. ASan links the module statically into the nginx
# binary (no .so), so only the nginx binary is passed to --nginx-binary.
#
# Port bands: the two jobs run concurrently on the shared runner, so each keeps
# its own TEST_BASE_PORT band (ci/tools/lint-ci-ports.sh fails CI on overlap).
#
# Action pins (keep in sync with build-test.yml header):
# actions/checkout@v5         -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd
# actions/upload-artifact@v7.0.2 -> cf430e030ddbb5b0abf93d22962f4752f3646cd9

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call: {}
  workflow_dispatch: {}

concurrency:
  group: asan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  asan-single:
    name: ASan single-process
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    # The suite plus the CT-RESUME-FINALIZE-UAF abort/re-entry arms (~18 min of
    # them alone under ASan) no longer fits 30 min / a 1200s hang guard.
    timeout-minutes: 60
    # AUD-CIPORT1: own 64-wide port band, distinct from every other
    # runtime-bearing job on this shared runner. See
    # ci/tools/lint-ci-ports.sh (fails CI on a collision or a hardcoded sweep).
    env:
      TEST_BASE_PORT: 18944
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache curl eatmydata libpcre2-dev libssl-dev mold zlib1g-dev

      - name: Restore build caches
        uses: ./.github/actions/build-cache  # zizmor: ignore[self-repository] -- $/ not yet accepted by actionlint
        with:
          mode: asan
          nginx-version: ${{ env.NGINX_VERSION }}

      - name: Build with sanitizers
        run: bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" asan

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server memcached gdb

      - name: Sweep stale test listeners
        run: |
          # Kill leftovers from earlier crashed runs still holding test
          # ports in THIS job's own band (cross-repo collisions on shared
          # runners). Must never widen back to the old shared 18870-18999 --
          # that killed a SIBLING job's live fixtures (AUD-CIPORT1).
          command -v fuser >/dev/null || sudo apt-get install -y psmisc
          for p in $(seq "$TEST_BASE_PORT" $((TEST_BASE_PORT + 63))); do
            fuser -k -TERM "${p}/tcp" 2>/dev/null || true
          done
          sleep 1

      - name: Verify single-process port band
        run: ci/tools/max-port.sh "$TEST_BASE_PORT"

      - name: Run runtime suite under ASan and UBSan (single-process)
        env:
          # detect_leaks=1: leak detection is ON for the long-running server.
          # TWO separate nginx-core allocations have to be accounted for
          # first, on two different code paths -- both are "the process is
          # about to exit(), the OS reclaims it" upstream behaviour, neither
          # is a leak a module can fix:
          #
          #   1. the config-parse pool, on the short-lived `nginx -t` /
          #      `-s reload` subprocesses the harness spawns. Handled in the
          #      harness by ci/tools/test_runtime_base.py config_check_env(),
          #      which scopes detect_leaks=0 down to just those processes.
          #   2. cycle->connections / ->read_events / ->write_events, raw
          #      ngx_alloc()s made once per process by
          #      ngx_event_process_init() and freed by NO nginx exit path
          #      (they live outside the cycle pool, so ngx_destroy_pool()
          #      does not reach them). This one fires on the REAL SERVER's
          #      own shutdown, which no per-invocation env hook can reach --
          #      it is one long-lived process whose ASAN_OPTIONS is fixed for
          #      its whole life. Handled in the module instead:
          #      ngx_http_cache_turbo_exit_process() calls
          #      __lsan_ignore_object() on those three POINTERS, under a
          #      sanitizer-only #if. See the LSAN-CORE-EVENT-TABLES block in
          #      src/ngx_http_cache_turbo_blob.c.
          #
          # (2) is why this job was red when detect_leaks=1 first landed: the
          # premise then was that the server exit was already clean, which is
          # true of the cycle pool and false of those three tables.
          #
          # Do NOT replace either with an LSAN_OPTIONS suppression file:
          # leak:ngx_create_pool and leak:main were both tried and DISPROVEN
          # by negative control (issues.md, SRV-ASAN-ABORT-L2-XFILL) -- a
          # suppression matches ANY frame on the allocation stack, so both
          # also hide real module leaks. __lsan_ignore_object() exempts three
          # specific allocations by identity; a deliberate leak planted in
          # the very same function still aborts the run (verified).
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          # An instrumented build is several times slower than a plain one; the
          # default 5s per-request budget is not a real signal here, it just
          # turns latency into a spurious TimeoutError (seen on main 2026-07-26,
          # same commit green on its PR branch).
          TEST_CT_TIMEOUT: "30"
          # Breadcrumb: the harness writes the running test here (see
          # test_runtime.py _write_breadcrumb). On an R6b hang the guard copies
          # it to hanging-test.txt so the backtrace is labelled with the culprit.
          CT_TEST_BREADCRUMB: ${{ github.workspace }}/ci-hang-artifacts/current-test.txt
        # Wrapped in ci-hang-guard.sh: the single-process suite intermittently wedges
        # the nginx event loop (rare, suite-cumulative, not bound to any one test —
        # reproduces locally too, not CI-only; see memory issues.md, 2026-08-21).
        # If the suite runs past the soft timeout the guard captures a gdb all-thread
        # backtrace + SIGQUIT debug dump into ci-hang-artifacts/ (uploaded below) so the
        # next occurrence yields evidence before the finite 3000s hard bound.
        # Keep the existing 2700s soft capture within the 60-minute job.
        #
        # AUD-TESTFIX1 log capture: the guard owns a private command session.
        # nginx stays under its retained command leader. Piping
        # test_runtime.py directly (`cmd | tee log -- ...`) would make tee, not
        # python3, the backgrounded process, and nginx would come up as a SIBLING of
        # tee rather than a descendant — the guard would report "no nginx under pid"
        # and never capture a hang again. Wrapping the whole pipeline in one
        # `bash -c '...'` keeps a single process that is the ancestor of both
        # python3 and tee, so nginx (python3's descendant) stays inside the tracked
        # tree. `set -o pipefail` inside that inner bash makes the wrapper's exit
        # status the suite's, not tee's, so a failing suite still fails this step.
        run: |
          # Leave ten minutes of the existing 60m job for teardown/artifacts.
          CT_HANG_HARD_SECONDS=3000 bash ci/tools/ci-hang-guard.sh 2700 "$GITHUB_WORKSPACE/ci-hang-artifacts" -- \
            bash -c '
              set -o pipefail
              python3 ci/tools/test_runtime.py \
                --fault-injection \
                --single-process \
                --port "$TEST_BASE_PORT" \
                --redis-server /usr/bin/redis-server \
                --memcached-server /usr/bin/memcached \
                --nginx-binary "$GITHUB_WORKSPACE/.build/nginx-${NGINX_VERSION}/objs/nginx" \
                2>&1 | tee runtime-suite-single.log
            '

      - name: Assert the requested fixture set actually came up (AUD-TESTFIX1)
        run: bash ci/tools/assert-fixtures.sh runtime-suite-single.log

      - name: Upload hang-capture artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asan-hang-capture
          path: ci-hang-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  asan-multi:
    name: ASan multi-worker
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    # The suite plus the CT-RESUME-FINALIZE-UAF abort/re-entry arms (~18 min of
    # them alone under ASan) no longer fits 30 min / a 1200s hang guard.
    timeout-minutes: 60
    # AUD-CIPORT1: own 64-wide port band, distinct from every other
    # runtime-bearing job on this shared runner. See
    # ci/tools/lint-ci-ports.sh (fails CI on a collision or a hardcoded sweep).
    env:
      TEST_BASE_PORT: 19008
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache curl eatmydata libpcre2-dev libssl-dev mold zlib1g-dev

      - name: Restore build caches
        uses: ./.github/actions/build-cache  # zizmor: ignore[self-repository] -- $/ not yet accepted by actionlint
        with:
          mode: asan
          nginx-version: ${{ env.NGINX_VERSION }}

      - name: Build with sanitizers
        run: bash ci/tools/ci-build.sh nginx "$NGINX_VERSION" asan

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server memcached

      - name: Sweep stale test listeners
        run: |
          # Kill leftovers from earlier crashed runs still holding test
          # ports in THIS job's own band. Must never widen back to the old
          # shared 18870-18999 -- that killed a SIBLING job's live fixtures
          # (AUD-CIPORT1).
          command -v fuser >/dev/null || sudo apt-get install -y psmisc
          for p in $(seq "$TEST_BASE_PORT" $((TEST_BASE_PORT + 63))); do
            fuser -k -TERM "${p}/tcp" 2>/dev/null || true
          done
          sleep 1

      - name: Verify multi-worker port band
        run: ci/tools/max-port.sh "$TEST_BASE_PORT"

      - name: Run runtime suite multi-worker under ASan and UBSan (CI-3)
        # CI-3: the single-process job covers our allocations; this run exercises
        # the SAME sanitized binary under nginx's real master + 4-worker model (no
        # --single-process), so a cross-worker shm-zone UAF / race / use of a slab
        # freed by another worker surfaces here that the 1-worker run cannot.
        #
        # detect_leaks=1 HERE TOO, same as the single-process job. It was 0
        # for one cycle while the multi-worker topology went unverified; it has
        # now been measured and the flag is on.
        #
        # WHAT MADE IT SAFE: ngx_event_process_init()
        # (src/event/ngx_event.c:755/762/774) allocates cycle->connections/
        # read_events/write_events with raw ngx_alloc() once per worker, and no
        # nginx exit path frees them -- they live outside the cycle pool, so
        # ngx_destroy_pool never reaches them. The module's exit_process hook
        # exempts exactly those three POINTERS with __lsan_ignore_object()
        # (LSAN-CORE-EVENT-TABLES in src/ngx_http_cache_turbo_blob.c), and nginx
        # calls exit_process on the worker path too (ngx_worker_process_exit,
        # ngx_process_cycle.c:947) -- not just the single-process one.
        #
        # THE OPEN QUESTION IS ANSWERED (VERIFIED, not inferred): a RETIRING
        # worker -- the `-s reload` generation handover the single-process leg
        # structurally cannot exercise -- holds NO other unfreed core
        # allocation. Measured 2026-08-27 on nginx 1.31.3, gcc 14.2.0, this
        # binary: the full multi-worker fault-injection suite runs clean under
        # detect_leaks=1, including test_s8_reload_on_to_off_drains_protected,
        # which drives a real `nginx -s reload`.
        #
        # NEGATIVE CONTROL (run, not reasoned): a deliberate malloc() leaked in
        # exit_process makes this leg RED -- 12 leaking processes across three
        # worker generations, each reporting that allocation and NOTHING else,
        # stack rooted at ngx_worker_process_exit (ngx_process_cycle.c:947).
        # So a genuine module leak on the worker-exit path still fails the job;
        # the exemption hides the three core tables by pointer identity and
        # nothing more. (First attempt at that control was VACUOUS: at -O1 gcc
        # elided an unused malloc, so the leak never reached the binary. It has
        # to escape through a volatile sink -- verify with objdump that the
        # call is actually in exit_process before believing a red or a green.)
        #
        # Do NOT replace this with an LSan suppression file: leak:ngx_create_pool
        # and leak:main were both DISPROVEN by negative control -- a suppression
        # matches ANY frame on the allocation stack, so each also hides genuine
        # module leaks. __lsan_ignore_object() (pointer identity) is the tool.
        #
        # Short-lived `nginx -t` / `-s reload` subprocesses are still scoped to
        # detect_leaks=0 by config_check_env() (ci/tools/test_runtime_base.py),
        # which sets it on BOTH ASAN_OPTIONS and LSAN_OPTIONS -- the integrated
        # runtime parses LSAN_OPTIONS after ASAN_OPTIONS, so setting only one
        # is silently overridden.
        #
        # Wrapped in ci-hang-guard.sh for the same reason as the single-process job:
        # if the suite fails a diagnostics capture preserves nginx logs (error.log)
        # so the upstream 502 reason is recoverable after the fact, not just the
        # assertion string. 1200s soft < 30-min job timeout, well above ~7 min
        # healthy run.
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          # See the single-process job: instrumented latency is not a signal.
          TEST_CT_TIMEOUT: "30"
          # Breadcrumb: the harness writes the running test here (see
          # test_runtime.py _write_breadcrumb). On an R6b hang the guard copies
          # it to hanging-test.txt so the backtrace is labelled with the culprit.
          CT_TEST_BREADCRUMB: ${{ github.workspace }}/ci-hang-artifacts/current-test.txt
        run: |
          # Leave ten minutes of the existing 60m job for teardown/artifacts.
          CT_HANG_HARD_SECONDS=3000 bash ci/tools/ci-hang-guard.sh 2700 "$GITHUB_WORKSPACE/ci-hang-artifacts" -- \
            bash -c '
              set -o pipefail
              python3 ci/tools/test_runtime.py \
                --fault-injection \
                --sanitizer \
                --port "$TEST_BASE_PORT" \
                --redis-server /usr/bin/redis-server \
                --memcached-server /usr/bin/memcached \
                --nginx-binary "$GITHUB_WORKSPACE/.build/nginx-${NGINX_VERSION}/objs/nginx" \
                2>&1 | tee runtime-suite-multiworker.log
            '

      - name: Assert the requested fixture set actually came up (AUD-TESTFIX1)
        run: bash ci/tools/assert-fixtures.sh runtime-suite-multiworker.log

      - name: Upload hang-capture artifacts (multi-worker)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asan-hang-capture-multiworker
          path: ci-hang-artifacts/
          if-no-files-found: ignore
          retention-days: 14
