# sync-sha: dd6481e6b46763135cc5411a048c6708c347c57460e14ec8e02e0cbe50119f7d
name: Lint

# The same ci/linter/ scripts a developer runs locally, run again on the PR --
# so a clone that never enabled the hook (`git config core.hooksPath .githooks`)
# cannot land nginx-convention, shell, Perl, Python or workflow-syntax
# regressions. Local and remote run the SAME entry point on purpose: a CI-only
# reimplementation drifts from the hook and the two stop agreeing.
#
# LINT_ONLY leaves out the "c" checker: flawfinder/cppcheck/semgrep over src/
# are already the job of security-scanners.yml, at the same thresholds
# (ci/linter/lint-c.sh mirrors that workflow). Running them twice per PR buys
# nothing but queue time. That is the ONE deliberate exclusion; every other
# lint-*.sh is named below.
#
# "astgrep" IS listed, and is not covered by that exclusion. No other workflow
# runs the ci/ast-grep/ ruleset, so leaving it out would mean the structural
# sweep gates the hook and never a PR -- the half-gate selftest.sh's LINT_ONLY
# set-equality case exists to catch. It is also cheap (no nginx tree, no TU
# parse) and its blocking tier is five promoted rules, not the whole ruleset.
#
# "astgrep-essentials" runs the FULL upstream ast-grep essentials pack (every
# language), checked out below at a pinned commit. It blocks on severity
# `error`.
#
# "shm-lock", "atomic-ordering", "suite-docs", "resume-order" and "park-contract" are this
# module's own checkers and have no skeleton counterpart. They previously ran only from build-test.yml's
# validation job; they are named here so the hook and the PR gate on the same
# set. build-test.yml still calls the implementations directly -- that is
# belt-and-braces, not duplication to remove, since the two workflows are
# independently skippable.
#
# This job uses the shared POOL selector like every other job. Repositories
# without POOL configured fall back to a hosted runner.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  # Triggered by ci.yml, like every other member of the suite. No
  # push/pull_request trigger here: two entry points would run it twice per PR,
  # which ci/linter/lint-ci-cadence.sh fails the build for.
  workflow_call: {}

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Read-only checkout; this job publishes nothing.
  contents: read

jobs:
  lint:
    name: Linters
    runs-on: ${{ fromJSON(vars.POOL || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - name: CI-L1 negative control (forced failure)
        run: exit 1

      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Check out the ast-grep essentials pack
        # Public repo, pinned by commit: a floating pack changes findings under
        # an unchanged tree. Bump the ref deliberately, with a green full-pack
        # scan. Inside the workspace (checkout requires it); git ls-files never
        # lists it, so no other checker lints the pack itself.
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: myguard-labs/ast-grep-essentials
          ref: c0d39c8a6823f187fcc04f9adc1e774b1434c1b1
          path: .essentials
          persist-credentials: false

      - name: Install linters
        # One installer for CI and for a fresh clone; a second apt list here
        # would be the thing that goes stale.
        run: ci/linter/install-linters.sh

      - name: Verify the toolchain is complete
        # A linter missing from PATH makes its check exit 2, which run-all.sh
        # reports as a failure rather than skipping -- this step just surfaces
        # WHICH one before the findings scroll past.
        run: ci/linter/install-linters.sh --check

      - name: Selftest the gate
        # Before trusting the next step's verdict, prove the gate can still say
        # no: a selector that matches nothing must exit 2, not report clean.
        # The step below narrows the run with LINT_ONLY, so a silent selector
        # is exactly the failure that would make this whole job vacuous.
        env:
          AST_GREP_ESSENTIALS: ${{ github.workspace }}/.essentials
        run: ci/linter/selftest.sh

      - name: Configure an nginx tree for the carve-init parser
        # lint-carve-init.sh parses the module header with clang against
        # nginx's real include set, so it needs a tree where ./configure has
        # run -- ALL_INCS does not exist before that. It does NOT need one that
        # has been compiled, and `configure` mode stops before make, so this
        # costs seconds.
        #
        # Before that checker used clang it read the header as text and needed
        # nothing, which is why this job never had a tree. Dropping carve-init
        # from LINT_ONLY instead would be the cheaper edit and the wrong one:
        # selftest.sh asserts LINT_ONLY equals the lint-*.sh glob minus "c",
        # and a checker that runs on the hook but never on a PR is the quieter
        # half of a gate that is not really a gate.
        run: |
          # BUILD_ROOT keeps this tree OUT of .build/, which ci/tests/unit/run.sh
          # auto-discovers. That suite gates on objs/ngx_auto_config.h and is
          # meant to SKIP in this job -- the Runtime job, which has a COMPILED
          # tree, is the one that runs it. `configure` mode stops before make,
          # so a tree at the default path would satisfy that gate with no .o
          # files behind it and the suite would die measuring the shm node.
          tree="$(BUILD_ROOT="$PWD/.carve-tree" bash ci/tools/ci-build.sh nginx "" configure | sed -n 's/^tree=//p')"
          [ -n "$tree" ] || { echo "ci-build.sh printed no tree= line" >&2; exit 1; }
          echo "NGX_SRC_TREE=$tree" >> "$GITHUB_ENV"

      - name: Run linters
        env:
          # Every checker except "c" -- adding a lint-*.sh without adding its
          # name here leaves it running locally and never in CI, which is the
          # quieter half of a gate that is not really a gate. selftest.sh
          # asserts this set equals the ci/linter/lint-*.sh glob minus "c".
          #
          # ONE LINE, even though it trips yamllint's 120-column warning (which
          # does not block). selftest.sh reads this value with a line-based
          # `sed -n 's/^ *LINT_ONLY: *//p'`, so wrapping it in a folded scalar
          # (`>-`) makes that parser read the literal ">-" and report EVERY
          # checker as missing. Rewrap only by teaching selftest.sh to parse YAML.
          AST_GREP_ESSENTIALS: ${{ github.workspace }}/.essentials
          LINT_ONLY: nginx astgrep astgrep-essentials sh python perl yaml spelling semgrep-pin ci-runners ci-ports ci-cadence ci-secrets sync-stamp docs-drift shm-lock stripe-seam atomic-ordering carve-init suite-docs resume-order park-contract
        run: ci/linter/run-all.sh

      - name: Python unit tests (ci/tests)
        # ci/tests/*.py (breadcrumb guard, abort-fixture accounting, pre-commit
        # selector) were run by no workflow. A venv keeps pytest off the system
        # interpreter (PEP 668) while --system-site-packages leaves the tests'
        # own imports available.
        run: |
          python3 -m venv --system-site-packages "$RUNNER_TEMP/pytest-venv"
          "$RUNNER_TEMP/pytest-venv/bin/python" -m pip install --quiet pytest==9.1.0
          "$RUNNER_TEMP/pytest-venv/bin/python" -m pytest -q -p no:cacheprovider ci/tests/*.py
