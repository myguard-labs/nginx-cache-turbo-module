---
# yamllint disable rule:line-length
# The top-level exclude regex is one unsplittable string.
# Hygiene and secret hooks only (CI-P1). The tool linters -- flawfinder,
# semgrep, cppcheck, ast-grep, ruff, shellcheck, actionlint -- are owned by
# ci/linter/run-all.sh, which .githooks/pre-commit runs first. They are NOT
# repeated here: with both gates listing them, every staged commit ran each tool
# twice. ci/linter/selftest.sh fails if a run-all-owned tool reappears in this
# file (a tool must live in exactly one gate).
#
# What stays here, and why it is not in run-all:
#   whitespace / EOF / line-ending fixers, merge-conflict, check-yaml,
#   large-file and private-key hooks -- repo hygiene, no CI counterpart.
#   gitleaks -- scans the STAGED PATCH for token-shaped secrets; run-all has no
#   secret scanner (CI scans history in security-scanners.yml).
#
# Install (once per clone):
#   pipx install pre-commit
#   git config core.hooksPath .githooks
#
# Do NOT run `pre-commit install` in this repo. It writes .git/hooks/pre-commit,
# and core.hooksPath REPLACES .git/hooks/ entirely -- git consults one or the
# other, never both. The result is an inert config that looks installed from
# every angle. .githooks/pre-commit invokes `pre-commit run --hook-stage
# pre-commit` itself; a missing pre-commit binary is exit 2 there (blocking).
#
# Run against everything without committing:
#   pre-commit run --all-files
#
# VERIFY BEFORE TRUSTING (a green hook proves nothing until seen red):
#   printf 'probe   \n\nno newline at eof' > _p.txt
#   pre-commit run --files _p.txt     # expect trailing-whitespace/EOF Failed
#   rm _p.txt

# Fuzz corpus files are byte-exact test inputs: a stripped space or an added
# newline changes what is actually fuzzed. Never let a fixer touch them.
#
# .pem and .der are NOT in this list, deliberately. pre-commit applies the
# top-level exclude before any per-hook rule, so a suffix named here is
# invisible to EVERY hook -- including detect-private-key, whose entire job is
# catching a .pem. Verified: an identical fake key reads "(no files to check)
# Skipped" as probe.pem and "Private key found" as probe.txt. They are excluded
# per-hook on the three fixers below instead, which is the only reason they were
# ever in this list.
exclude: '^ci/fuzz/corpus/|^ci/fuzz/corpus_auto/|^ci/fuzz/corpus_blob/|^ci/fuzz/corpus_mc/|^ci/fuzz/corpus_norm_args/|^ci/fuzz/regressions/|\.traefik-ref/|\.claude/worktrees/|\.build/|(^|/)objs/|(^|/)vendor/|(^|/)node_modules/|(^|/)\.venv/|\.(bin|gz|zip|png|ico|so|o|a)$'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The three fixers rewrite files in place, which is why keys and DER blobs
      # have to stay out of their reach. Per-hook, not top-level: a top-level
      # exclude would also blind detect-private-key below.
      - id: trailing-whitespace
        exclude: '\.(pem|der)$'
      - id: end-of-file-fixer
        exclude: '\.(pem|der)$'
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.(pem|der)$'
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=512]
      # Test vectors are not secrets. A derived module's unit tests can carry
      # locked PEM fixtures (an elided MIGH... blob, a documented P-256
      # vector); gating on those is a pure false positive, while the hook still
      # guards every real path.
      - id: detect-private-key
        # `(ci/)?` because the skeleton standard relocates the suite under ci/:
        # a root-anchored ^tests?/ stops matching the moment a module moves
        # tests/ to ci/tests/, and the hook then fires on the relocated PEM
        # fixtures and blocks the move commit itself. Hit in every module
        # adopting the ci/ layout.
        exclude: '^(ci/)?tests?/'

  - repo: local
    hooks:
      # Mirrors the CI "gitleaks" step. Different scope on purpose: a commit
      # hook can only see what is being committed, so it scans the staged
      # patch, while CI scans the whole history -- a secret that was committed
      # and later removed is still published, and only the history scan finds
      # it. Measured at zero findings before the gate went in.
      #
      # detect-private-key above is not a substitute: it matches PEM key
      # headers only, and misses every token-shaped secret (PATs, bot tokens,
      # cloud keys), which is what actually leaks out of these repos.
      #
      # VERIFY WITH A NON-EXAMPLE SECRET. The obvious probe -- AWS's own
      # AKIAIOSFODNN7EXAMPLE / wJalrXUtnFEMI... pair -- is allowlisted by the
      # default ruleset and reports "no leaks found", which reads exactly like
      # a broken gate. Probe with a plausible token instead:
      # Build the probe token from parts -- a literal one written out here is
      # itself a leak by this hook's own rules, and would land the gate red on
      # its own config file:
      #   T=xoxb-2024827913265; T="$T-2024891053289-fJk2mQ8vNwLpXcRt7HzYbA31"
      #   printf 'k = "%s"\n' "$T" > p.txt
      #   git add p.txt && gitleaks git --staged --no-banner --redact -v
      #   git reset -q p.txt && rm p.txt        # expect: leaks found: 1
      - id: gitleaks
        name: gitleaks (staged patch)
        entry: gitleaks git --staged --no-banner --redact
        language: system
        pass_filenames: false
        always_run: true
