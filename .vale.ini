#
# Vale prose lint, picked up by the shared lint (review-lint.sh). Deliberately
# minimal: Vale's built-in "Vale" style, repetition check only (a doubled word
# such as "the the" is an unambiguous defect). Spelling stays with codespell
# (ci/linter/lint-spelling.sh); Vale.Spelling and Vale.Terms are off because an
# nginx/cache dictionary would be a second, noisier source of truth.
#
# No StylesPath packages are used, so nothing is downloaded and no styles
# directory is checked in beyond the .gitkeep that keeps StylesPath present.
StylesPath = .vale/styles
MinAlertLevel = suggestion

[docs/*.md]
BasedOnStyles = Vale
Vale.Spelling = NO
Vale.Terms = NO
Vale.Repetition = YES

[README.md]
BasedOnStyles = Vale
Vale.Spelling = NO
Vale.Terms = NO
Vale.Repetition = YES
